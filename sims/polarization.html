  exactly; its treatment of unpolarized light agrees with an average over 200,000 random polarized beams;
  crossed polarizers block everything and a third at 45 deg passes 1/8; a quarter-wave plate makes circular
  light, whose turning direction was checked against the field itself in time; a half-wave plate rotates

<style>

<main class="app">

    <button role="tab" id="tab2" aria-selected="false"><span>2</span>Glare</button>
    <button role="tab" id="tab3" aria-selected="false"><span>3</span>Wave plates</button>
    <button role="tab" id="tab4" aria-selected="false"><span>4</span>Many steps</button>
  </div>

  <div class="workspace">
  <canvas id="scene" aria-label="Light passing through polarizers and other elements to a light meter; arrows show the electric field"></canvas>
  <div class="row2">
    <button id="rec">Record the meter</button>
    <button id="clear" class="secondary">Clear points</button>
    <label><input type="checkbox" id="theory"> theory curve</label>

    <div class="grp" id="lab_src"><div>Light source</div>
      <div class="seg" id="src" role="group" aria-label="Light source"><button data-v="lamp">lamp (unpolarized)</button><button data-v="laser">laser (vertical)</button></div></div>
    <div class="grp" id="lab_np"><div>Polarizers in the beam</div>
      <div class="seg" id="np" role="group" aria-label="Number of polarizers"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>

    <label id="lab_a2"><div class="row"><span>Polarizer 2's axis</span><span class="val" id="a2_v"></span></div><input type="range" id="a2" min="-90" max="90" step="1"></label>
    <label id="lab_a3"><div class="row"><span>Polarizer 3's axis</span><span class="val" id="a3_v"></span></div><input type="range" id="a3" min="-90" max="90" step="1"></label>
    <div class="grp" id="lab_mat"><div>The surface</div>
      <div class="seg" id="mat" role="group" aria-label="Surface"><button data-v="1.333">water</button><button data-v="1.52">glass</button><button data-v="2.42">diamond</button></div></div>
    <label id="lab_inc"><div class="row"><span>Angle of incidence (from straight down)</span><span class="val" id="inc_v"></span></div><input type="range" id="inc" min="0" max="89" step="0.5"></label>

    <label id="lab_pa"><div class="row"><span>Wave plate's fast axis, from vertical</span><span class="val" id="pa_v"></span></div><input type="range" id="pa" min="-90" max="90" step="1"></label>
    <label id="lab_an"><div class="row"><span>Polarizer's axis, from vertical</span><span class="val" id="an_v"></span></div><input type="range" id="an" min="-90" max="90" step="1"></label>
    <label id="lab_N"><div class="row"><span>Number of polarizers, turning 90° in equal steps</span><span class="val" id="N_v"></span></div><input type="range" id="N" min="1" max="30" step="1"></label>

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. MODEL
  //    The block between the markers was tested on its own against Malus's law, a Monte Carlo average of
  //    random beams, the field traced in time, Fresnel's equations and energy conservation. It is copied in unchanged.
  // ================================================================
  // ---- physics core: polarized light ----
  // Light travels along the bench toward a meter. Its electric field lies in the plane across the beam: u points
  // to the right and v up, as seen from the meter looking back toward the source. A beam of definite polarization
  // is a Jones vector E = (Eu, Ev) of complex amplitudes; the field at one place is Re(E e^(-i w t)).
  // Light that is unpolarized or only partly polarized is described by its coherency matrix J = <E E^dagger>,
  // a 2x2 Hermitian matrix (an average over the light's random changes); its trace is the intensity.
  // An optical element with Jones matrix M turns J into M J M^dagger, which handles every kind of light exactly.
  //   polarizer, axis at angle theta from vertical (counterclockwise as seen from the meter): M = n n^T, n = (-sin, cos)
  //   wave plate, fast axis along n, retardance G: M = n n^T + e^(iG) s s^T, s = (cos, sin) the slow axis
  //   reflection off a surface (plane of incidence vertical): s light (horizontal, u) and p light (vertical, v)
  //       reflect with the Fresnel amplitudes rs and rp.
  // Stokes numbers: S0 intensity, S1 = horizontal - vertical, S2 = diagonal, S3 = circular, positive when the field
  // turns counterclockwise as seen from the meter.

  const DEG = Math.PI / 180;
  // complex numbers as [re, im]
  const cx = (re, im) => [re, im || 0];
  const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const conj = a => [a[0], -a[1]];
  const cexp = th => [Math.cos(th), Math.sin(th)];
  const abs2 = a => a[0] * a[0] + a[1] * a[1];
  // 2x2 complex matrices as [[a, b], [c, d]]
  function mmul(A, B) {
    return [[cadd(cmul(A[0][0], B[0][0]), cmul(A[0][1], B[1][0])), cadd(cmul(A[0][0], B[0][1]), cmul(A[0][1], B[1][1]))],
            [cadd(cmul(A[1][0], B[0][0]), cmul(A[1][1], B[1][0])), cadd(cmul(A[1][0], B[0][1]), cmul(A[1][1], B[1][1]))]];
  }
  const dagger = A => [[conj(A[0][0]), conj(A[1][0])], [conj(A[0][1]), conj(A[1][1])]];
  const transform = (M, J) => mmul(mmul(M, J), dagger(M));          // J -> M J M^dagger

  // light
  const unpolarized = I => [[cx(I / 2), cx(0)], [cx(0), cx(I / 2)]];
  function pure(E) { return [[cmul(E[0], conj(E[0])), cmul(E[0], conj(E[1]))], [cmul(E[1], conj(E[0])), cmul(E[1], conj(E[1]))]]; }
  const linear = (I, thDeg) => { const a = Math.sqrt(I); return pure([cx(-a * Math.sin(thDeg * DEG)), cx(a * Math.cos(thDeg * DEG))]); };
  const intensity = J => J[0][0][0] + J[1][1][0];

  // elements
  function polarizer(thDeg) {
    const n = [-Math.sin(thDeg * DEG), Math.cos(thDeg * DEG)];
    return [[cx(n[0] * n[0]), cx(n[0] * n[1])], [cx(n[1] * n[0]), cx(n[1] * n[1])]];
  }
  function wavePlate(thDeg, retard) {
    const f = [-Math.sin(thDeg * DEG), Math.cos(thDeg * DEG)], s = [Math.cos(thDeg * DEG), Math.sin(thDeg * DEG)], e = cexp(retard);
    const el = (i, j) => cadd(cx(f[i] * f[j]), cmul(e, cx(s[i] * s[j])));
    return [[el(0, 0), el(0, 1)], [el(1, 0), el(1, 1)]];
  }
  const QUARTER = Math.PI / 2, HALF = Math.PI;
  // Fresnel amplitude reflection, from air onto a surface of index n at incidence thetaI (degrees)
  function fresnel(n, iDeg) {
    const ci = Math.cos(iDeg * DEG), si = Math.sin(iDeg * DEG), st = si / n, ct = Math.sqrt(1 - st * st);
    return { rs: (ci - n * ct) / (ci + n * ct), rp: (n * ci - ct) / (n * ci + ct), Rs: ((ci - n * ct) / (ci + n * ct)) ** 2, Rp: ((n * ci - ct) / (n * ci + ct)) ** 2 };
  }
  function reflector(n, iDeg) { const f = fresnel(n, iDeg); return [[cx(f.rs), cx(0)], [cx(0), cx(f.rp)]]; }
  const brewster = n => Math.atan(n) / DEG;

  // what the light is like: Stokes numbers, degree of polarization, and the ellipse its polarized part traces
  function stokes(J) {
    const S0 = intensity(J), S1 = J[0][0][0] - J[1][1][0], S2 = 2 * J[0][1][0], S3 = -2 * J[0][1][1];
    const Ip = Math.hypot(S1, S2, S3);
    return { S0, S1, S2, S3, p: S0 > 0 ? Math.min(1, Ip / S0) : 0, Ip,
      psi: 0.5 * Math.atan2(S2, S1),                                  // tilt of the ellipse from the u (horizontal) axis
      chi: Ip > 0 ? 0.5 * Math.asin(Math.max(-1, Math.min(1, S3 / Ip))) : 0 };   // 0 = straight line, +-45 deg = circle
  }
  // a Jones vector with the same polarized part (for drawing the field)
  function polarizedPart(J) {
    const s = stokes(J), a = Math.sqrt(s.Ip), c = Math.cos(s.chi), sn = Math.sin(s.chi), cp = Math.cos(s.psi), sp = Math.sin(s.psi);
    return [cx(a * c * cp, -a * sn * sp), cx(a * c * sp, a * sn * cp)];
  }
  // the field at phase wt for a Jones vector: Re(E e^(-i w t))
  const fieldAt = (E, wt) => [E[0][0] * Math.cos(wt) + E[0][1] * Math.sin(wt), E[1][0] * Math.cos(wt) + E[1][1] * Math.sin(wt)];
  // angle of a straight-line polarization, from vertical, counterclockwise as seen from the meter, in (-90, 90]
  function lineAngle(J) { const s = stokes(J); let a = s.psi / DEG - 90; while (a <= -90) a += 180; while (a > 90) a -= 180; return a; }

  // a row of elements
  const through = (J, Ms) => Ms.reduce((acc, M) => transform(M, acc), J);
  // N polarizers turning the light from vertical to horizontal in equal steps
  function manySteps(N) { const Ms = []; for (let k = 1; k <= N; k++) Ms.push(polarizer(90 * k / N)); return Ms; }
  // ---- end of core ----

  const TAB = {
    1: { src: 'lamp', np: 2, a: [0, 60, 90], series: [] },
    2: { n: 1.333, inc: 30, glass: 0, series: [] },
    3: { plate: 'q', pa: 45, an: 0, series: [] },
    4: { N: 1, series: [] }
  };
  let tab = 1, frozen = false, wt = 0;
  const S = () => TAB[tab];
  const fmtA = a => (a > 0 ? '+' : a < 0 ? '−' : '') + Math.abs(a) + '°';
  const pc = v => (100 * v).toFixed(v < 0.001 && v > 0 ? 3 : v < 0.1 ? 2 : 1) + '%';
  const pcShort = v => Math.abs(v) < 5e-5 ? '0%' : pc(v);

  // the light at each stage, for the screen in use: [{ J, after: label }]
  function stages(x) {
    x = x || S();
    if (tab === 1) {
      const out = [{ J: x.src === 'lamp' ? unpolarized(1) : linear(1, 0), at: x.src === 'lamp' ? 'from the lamp' : 'from the laser' }];
      for (let i = 0; i < x.np; i++) out.push({ J: transform(polarizer(x.a[i]), out[out.length - 1].J), at: 'after polarizer ' + (i + 1) });
      return out;
    }
    if (tab === 2) {
      const J0 = unpolarized(1), Jr = transform(reflector(x.n, x.inc), J0);
      return [{ J: J0, at: 'from the lamp' }, { J: Jr, at: 'reflected glare' }, { J: transform(polarizer(x.glass), Jr), at: 'through the sunglasses' }];
    }
    if (tab === 3) {
      const J0 = linear(1, 0), J1 = x.plate === '0' ? J0 : transform(wavePlate(x.pa, x.plate === 'q' ? QUARTER : HALF), J0);
      return [{ J: J0, at: 'from the laser' }, { J: J1, at: x.plate === '0' ? 'no plate' : 'after the wave plate' }, { J: transform(polarizer(x.an), J1), at: 'after the polarizer' }];
    }
    const out = [{ J: linear(1, 0), at: 'from the laser' }];
    manySteps(x.N).forEach((M, i) => out.push({ J: transform(M, out[out.length - 1].J), at: 'after ' + (i + 1) }));
    return out;
  }
  const meterOf = x => intensity(stages(x).slice(-1)[0].J);
  // describe the polarization in words
  function describe(J) {
    const s = stokes(J), I0 = s.S0;
    if (I0 < 5e-5) return 'no light';
    if (s.p < 0.02) return 'unpolarized';
    const deg = Math.abs(s.chi) * 180 / Math.PI, ang = lineAngle(J), part = s.p < 0.98 ? Math.round(100 * s.p) + '% polarized, ' : '';

  // graphs of recorded meter readings

  // ================================================================
  // 3. READOUTS AND CONTROLS

    if (tab === 4) {
      const n = x.N, t = intensity(last);
      html += card('Each step', n === 1 ? 'one turn of 90°' : (90 / n).toFixed(n > 12 ? 2 : 1) + '° per polarizer', n === 1 ? 'a single horizontal polarizer blocks vertical light completely' : 'each polarizer passes cos²(' + (90 / n).toFixed(1) + '°) = ' + pc(Math.cos(Math.PI / 2 / n) ** 2) + ' of what reaches it; ' + n + ' of them pass ' + pc(t));
    }
    $('readout').innerHTML = html;
    if (tab === 1) { [0, 1, 2].forEach(i => { $('a' + (i + 1) + '_v').textContent = fmtA(x.a[i]); }); }
    if (tab === 2) { $('inc_v').textContent = x.inc + '°'; $('glass_v').textContent = fmtA(x.glass) + (x.glass === 0 ? ' (vertical)' : Math.abs(x.glass) === 90 ? ' (horizontal)' : ''); }
    if (tab === 3) { $('pa_v').textContent = fmtA(x.pa); $('an_v').textContent = fmtA(x.an); }
    if (tab === 4) $('N_v').textContent = String(x.N);
  }

  const TEXT = {
    1: { lede: 'Light from a lamp passes through a polarizer and then a second one, to a light meter. Predict: as you turn the second polarizer, how does the reading change? Then set two polarizers at right angles, so no light gets through, and predict what happens if you slip a third one between them.',
         notes: '<p><b>What to try.</b> With one polarizer, turn it all the way round: half the lamp\'s light always gets through. Add a second and turn it, recording the meter every 10° or so; the readings trace a smooth curve, highest when the two axes line up, zero when they are at right angles. Then cross the first and last at 0° and 90°, add a third in the middle, and turn it. Switch to the laser, whose light starts out polarized vertically.</p>' +
                '<p><b>Why.</b> Light is a wave in the electric field, which shakes across the beam. Light from a lamp is a jumble of every direction of shaking, changing all the time; a polarizer passes only the part of the field along its axis. A field <i>E</i> at an angle <i>θ</i> to the axis has a part <i>E</i> cos <i>θ</i> along it, and since intensity goes as the square of the field, the light that gets through is <i>I</i> = <i>I</i><sub>0</sub> cos² <i>θ</i>: Malus\'s law (1809). Crossed polarizers pass nothing. A third one at 45° between them does not add light: it turns the polarization part of the way, so the last polarizer no longer meets light at right angles to it. What gets through is ½ × cos² 45° × cos² 45° = 1/8.</p>' +
                '<p><b>The model.</b> Ideal polarizers: they pass all of the light along their axis and none across it (real ones pass 80 to 90% and leak a little). The red arrows show the field\'s direction and size along the beam, slowed down by about 10<sup>15</sup>; the circles above show the field as seen from the meter, looking back at the source. Angles are measured from vertical, counterclockwise as seen from the meter.</p>' },
    2: { lede: 'Sunlight reflected off water or a road is glare. Polarized sunglasses cut it, but only when you hold your head upright. Predict: at what angle does the glare become completely polarized? Turn the sunglasses and change the angle of the light to find out.',
         notes: '<p><b>What to try.</b> Hold the sunglasses vertical (0°) and sweep the angle of incidence, recording the meter as you go; then do the same with them horizontal (90°). With them vertical, the glare dips to nothing at one angle: Brewster\'s angle, about 53° for water and 57° for glass. Turn your sunglasses sideways and the glare comes back. Try diamond.</p>' +
                '<p><b>Why.</b> Light polarized along the surface (s) and light polarized in the plane of incidence (p) reflect by different amounts, given by Fresnel\'s equations. At Brewster\'s angle, tan <i>θ</i><sub>B</sub> = <i>n</i>, the reflected and refracted beams are at right angles, and the p light cannot reflect at all: the glare is completely polarized along the surface, which is horizontal for a lake or a road. Polarized sunglasses have their axis vertical, so they block it. Photographers use polarizing filters the same way, to cut reflections from water and windows.</p>' +
                '<p><b>The model.</b> Light from the lamp is unpolarized and falls on a flat, clean surface of a transparent material (water 1.333, crown glass 1.52, diamond 2.42; indices for yellow light). Only the reflection from the top surface is counted. The sunglasses are an ideal polarizer; "vertical" means in the plane of incidence.</p>' },
    3: { lede: 'A wave plate does not block light; it delays the part of the field along one axis behind the other. Vertically polarized laser light goes through a quarter-wave plate. Predict: if its axis is at 45°, what does the polarizer after it see as you turn it?',
         notes: '<p><b>What to try.</b> With the quarter-wave plate at 45°, turn the polarizer and record the meter: it reads 50% at every angle, as if the light were unpolarized, yet the circle shows the field going round and round in a perfect circle. Turn the plate to −45° and it goes round the other way. At other plate angles the light is elliptical, and the meter swings between a maximum and a minimum. Switch to the half-wave plate: the light stays a straight line, but turned by twice the plate\'s angle. With the plate at 0° or 90° it does nothing at all.</p>' +
                '<p><b>Why.</b> In a wave plate (a slice of a crystal such as quartz or mica, or a stretched plastic film) light polarized along one axis travels slower than along the other. The plate\'s thickness is chosen so the slow part falls a quarter or a half of a wave behind. Split vertical light into two equal parts along axes at ±45°, delay one by a quarter wave, and they add up to a field that turns in a circle: circular polarization. Delay it by half a wave and they add up to a straight line again, mirrored across the plate\'s axis. 3D cinema glasses use circular polarization, so the picture does not fade when you tilt your head.</p>' +
                '<p><b>The model.</b> Ideal plates of exactly a quarter or a half wave for the laser\'s color, which do not absorb. The direction of turning is given as seen from the meter, looking back toward the laser.</p>' },
    4: { lede: 'A vertical polarizer and a horizontal one block all light. Now turn vertical light to horizontal in steps, with many polarizers each turned a little further. Predict: with 30 polarizers, how much of the light gets through?',
         notes: '<p><b>What to try.</b> Start with one polarizer at 90°: nothing gets through. Two, at 45° and 90°: a quarter. Then increase the number, recording the meter each time. More polarizers let more light through, approaching all of it.</p>' +
                '<p><b>Why.</b> Each polarizer is turned by 90°/<i>N</i> from the one before, so each passes cos²(90°/<i>N</i>) of what reaches it, and <i>N</i> of them pass cos<sup>2<i>N</i></sup>(90°/<i>N</i>). For small steps each loss is tiny, about (90°/<i>N</i>)² in radians, and the total loss, about <i>N</i> × (π/2<i>N</i>)², shrinks like 1/<i>N</i>. With enough steps the polarizers turn the light rather than block it. A twisted stack of molecules in a liquid-crystal display does exactly this, turning the light 90° between crossed polarizers; switch on a voltage and the twist straightens, the turning stops, and the pixel goes dark. In quantum mechanics the same arithmetic, applied to single photons, is the quantum Zeno effect.</p>' +
                '<p><b>The model.</b> Ideal polarizers, as on the first screen. Real ones each absorb some of the light along their axis too, so a real stack of 30 would let through much less.</p>' }
  };

  const SHOW = { lab_src: [1], lab_np: [1], lab_a1: [1], lab_a2: [1], lab_a3: [1], lab_mat: [2], lab_inc: [2], lab_glass: [2], lab_plate: [3], lab_pa: [3], lab_an: [3], lab_N: [4] };
  function visibility() {
    Object.keys(SHOW).forEach(id => { $(id).hidden = SHOW[id].indexOf(tab) < 0; });
    const x = S();
    if (tab === 1) { $('lab_a2').hidden = x.np < 2; $('lab_a3').hidden = x.np < 3; }
    if (tab === 3) $('lab_pa').hidden = x.plate === '0';
    const pr = (id, v) => document.querySelectorAll('#' + id + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v))));
    pr('src', TAB[1].src); pr('np', TAB[1].np); pr('mat', TAB[2].n); pr('plate', TAB[3].plate);
    $('wave').textContent = frozen ? 'Let the wave move' : 'Freeze the wave';
  }
  function sync() {
    const x = S();
    if (tab === 1) [0, 1, 2].forEach(i => { $('a' + (i + 1)).value = String(x.a[i]); });
    if (tab === 2) { $('inc').value = String(x.inc); $('glass').value = String(x.glass); }
    if (tab === 3) { $('pa').value = String(x.pa); $('an').value = String(x.an); }
    if (tab === 4) $('N').value = String(x.N);
  }
  function upd() { visibility(); readout(); draw(); }
  function setTab(k) {
    tab = k;
    [1, 2, 3, 4].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    sync(); upd();
  }
  [1, 2, 3, 4].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));

  const seg = (id, fn) => document.querySelectorAll('#' + id + ' button').forEach(b => b.addEventListener('click', () => { fn(b.dataset.v); upd(); }));
  seg('src', v => { TAB[1].src = v; });
  seg('np', v => { TAB[1].np = +v; });
  seg('mat', v => { TAB[2].n = +v; });
  seg('plate', v => { TAB[3].plate = v; });
  const slider = (id, fn) => $(id).addEventListener('input', () => { fn(+$(id).value); upd(); });
  [1, 2, 3].forEach(i => slider('a' + i, v => { TAB[1].a[i - 1] = v; }));
  slider('inc', v => { TAB[2].inc = v; });
  slider('glass', v => { TAB[2].glass = v; });
  slider('pa', v => { TAB[3].pa = v; });
  slider('an', v => { TAB[3].an = v; });
  slider('N', v => { TAB[4].N = v; });
  $('rec').addEventListener('click', () => { record(); upd(); });
  $('clear').addEventListener('click', () => { S().series = []; upd(); });
  $('theory').addEventListener('change', drawGraph);
  $('wave').addEventListener('click', () => { frozen = !frozen; visibility(); });
  window.addEventListener('resize', draw);

  // ================================================================
  // 4. LOOP: the wave moves along the beam, slowed down enormously
  // ================================================================
  let last = null;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (!frozen && !document.hidden && dt > 0) { wt += dt * 2.5; drawScene(); }
    requestAnimationFrame(frame);
  }
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) frozen = true;
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
