  same at every instant, through the squeeze; kinetic energy + energy held in the bumpers + heat stays equal
  to the starting kinetic energy at every instant; each bumper returns the same share of the closing speed

<body>
<main class="app">
  <div class="topbar">
  <nav class="home" aria-label="Site"><a href="../">Open Physics Sims</a></nav>
  <h1>Colliding carts</h1>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab1" aria-selected="true"><span>1</span>Collisions</button>
    <button role="tab" id="tab2" aria-selected="false"><span>2</span>Center-of-mass view</button>
  </div>
  <a class="about" href="#lede">How to use it ↓</a>
  </div>

  <p class="lede" id="lede"></p>

  <div class="workspace">
  <canvas id="scene" aria-label="Two carts on a track, with a magnified view of their bumpers"></canvas>
  <div class="row2">
    <button id="go">Go</button>
    <button id="reset" class="secondary">Reset</button>
    <label><input type="checkbox" id="slow" checked> slow motion during the collision</label>
    <span class="hint" id="hint"></span>
  </div>
  <canvas id="graph" aria-label="Bars showing each cart's momentum and where the energy is"></canvas>
  </div>

  <div class="sidebar">
  <div class="readout" id="readout"></div>

  <div class="controls">
    <div class="grp" id="lab_bump"><div>Bumpers (the same on both carts)</div>
      <div class="seg" id="bump" role="group" aria-label="Bumpers"><button data-v="magnet">magnets</button><button data-v="spring">springs</button><button data-v="rubber">rubber</button><button data-v="velcro">Velcro</button></div></div>
    <label id="lab_mA"><div class="row"><span>Cart A's mass</span><span class="val" id="mA_v"></span></div><input type="range" id="mA" min="0.25" max="1.25" step="0.25"></label>
    <label id="lab_vA"><div class="row"><span>Cart A's starting velocity</span><span class="val" id="vA_v"></span></div><input type="range" id="vA" min="-1" max="1" step="0.05"></label>
    <label id="lab_mB"><div class="row"><span>Cart B's mass</span><span class="val" id="mB_v"></span></div><input type="range" id="mB" min="0.25" max="1.25" step="0.25"></label>
    <label id="lab_vB"><div class="row"><span>Cart B's starting velocity</span><span class="val" id="vB_v"></span></div><input type="range" id="vB" min="-1" max="1" step="0.05"></label>
  </div>
  </div>

  <div class="notes" id="notes"></div>
</main>

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. MODEL
  //    The block between the markers was tested on its own: momentum and energy at every instant, each
  //    bumper's coefficient of restitution, a separate integration, the impulse and the center-of-mass frame.
  //    It is copied in unchanged.
  // ================================================================
  // ---- physics core: two carts colliding on a level track ----
  // SI units. Two carts roll without friction along a track; each has the same kind of bumper on the end facing
  // the other. The bumpers are the only force between them, equal and opposite (Newton's third law), so the total
  // momentum cannot change. What the bumpers do with the energy depends on what they are:
  //   magnets   - repel without touching, F = A / d^4 across the gap d: nothing is lost (stored in the field, returned)
  //   spring    - a stiff steel spring with a little internal friction: a spring k with a damper alongside
  //   rubber    - a stiffer, lossier pad: the same model, more damping
  //   Velcro    - a spring and heavy damper that grip once they touch, so the carts end up moving together
  // A pad can push but not pull: contact ends when its force would turn into a pull, and whatever energy is still in
  // the pad then dies away inside it. Each pad's damping is set from the pair's reduced mass, so it returns the same
  // share of the carts' relative speed (the coefficient of restitution) whatever the masses and speeds.
  const CART = { L: 0.17 };                         // cart length (m)
  const TRACK = { len: 2.4 };                       // positions are cart centers, 0 to 2.4 m
  const BUMPERS = {
    magnet: { kind: 'magnet', A: 2.4e-7, reach: 0, e: 1, name: 'magnets' },
    spring: { kind: 'pad', k: 3000, e: 0.85, reach: 0.02, name: 'springs' },
    rubber: { kind: 'pad', k: 12000, e: 0.5, reach: 0.008, name: 'rubber pads' },
    velcro: { kind: 'grip', k: 4000, zeta: 1.5, reach: 0.006, name: 'Velcro' }
  };
  // the coefficient of restitution of a pad with damping ratio zeta: a unit closing speed, reduced mass 1, k 1
  function padE(zeta) {
    let x = 0, v = 1, dt = 2e-5;
    const f = (x, v) => Math.max(0, x + 2 * zeta * v);
    for (let i = 0; i < 2e6; i++) {
      const a1 = -f(x, v), a2 = -f(x + dt / 2 * v, v + dt / 2 * a1), a3 = -f(x + dt / 2 * (v + dt / 2 * a1), v + dt / 2 * a2), a4 = -f(x + dt * (v + dt / 2 * a2), v + dt * a3);
      const xn = x + dt * (v + dt / 6 * (a1 + a2 + a3)), vn = v + dt / 6 * (a1 + 2 * a2 + 2 * a3 + a4);
      if (vn < 0 && (xn <= 0 || f(xn, vn) <= 0)) return -vn;     // released: the pad's force has dropped to zero
      x = xn; v = vn;
    }
    return 0;
  }
  // the damping ratio giving a wanted coefficient of restitution, by bisection
  function zetaFor(e) { let lo = 0, hi = 1.5; for (let i = 0; i < 50; i++) { const m = (lo + hi) / 2; if (padE(m) > e) lo = m; else hi = m; } return (lo + hi) / 2; }
  Object.keys(BUMPERS).forEach(k => { const b = BUMPERS[k]; if (b.kind === 'pad') b.zeta = zetaFor(b.e); });

  // The run: cart A starts on the left, B on the right. Positions, speeds, the energy held in the bumpers, and the
  // energy turned to heat, at every step. Integrated by RK4 with a step that shrinks while the bumpers act.
  // p = { mA, mB, vA, vB, xA, xB, bumper }. Returns samples { t, xA, vA, xB, vB, F, stored, lost, s } and events.
  function collide(p, opts) {
    opts = opts || {}; const b = BUMPERS[p.bumper], mA = p.mA, mB = p.mB, mu = mA * mB / (mA + mB);
    const c = b.kind === 'magnet' ? 0 : 2 * (b.zeta) * Math.sqrt(b.k * mu);
    const tMax = opts.tMax || 30, gap0 = (xA, xB) => xB - xA - CART.L - 2 * b.reach;   // gap between the bumpers' faces
    let xA = p.xA, vA = p.vA, xB = p.xB, vB = p.vB, t = 0, lost = 0, gripped = false, touching = false, pad = 0, locked = false;   // pad: the pads' squeeze left after release
    // force pushing the carts apart, from the gap g and its rate gd
    function force(g, gd) {
      if (b.kind === 'magnet') { const d = g + 2 * b.reach; return d > 0 ? b.A / (d * d * d * d) : 1e9; }
      const x = -g, xd = -gd;                      // squeeze of the two pads together (in series)
      if (b.kind === 'grip') return gripped ? b.k * x + c * xd : 0;
      return touching ? Math.max(0, b.k * x + c * xd) : 0;      // contact is switched on at the start of a step
    }
    function stored(g) {
      if (b.kind === 'magnet') { const d = g + 2 * b.reach; return b.A / (3 * d * d * d); }
      if (gripped) return 0.5 * b.k * g * g;
      if (touching) return g < 0 ? 0.5 * b.k * g * g : 0;
      return 0.5 * b.k * pad * pad;
    }
    const out = { t: [], xA: [], vA: [], xB: [], vB: [], F: [], stored: [], lost: [], squeeze: [], contact: [] };
    const push = (F) => { const g = gap0(xA, xB); out.t.push(t); out.xA.push(xA); out.vA.push(vA); out.xB.push(xB); out.vB.push(vB); out.F.push(F); out.stored.push(stored(g)); out.lost.push(lost); out.squeeze.push(b.kind === 'magnet' ? 0 : Math.max(0, touching || gripped ? -g : pad)); out.contact.push(touching || gripped || (b.kind === 'magnet' && F > 0.05)); };
    push(force(gap0(xA, xB), vB - vA));
    let lastSave = 0, first = null, last = null, peak = 0;
    const E0 = 0.5 * mA * vA * vA + 0.5 * mB * vB * vB + stored(gap0(xA, xB));
    while (t < tMax) {
      if (locked) {                                 // stuck together and settled: they move as one
        const dt = 2e-3; xA += vA * dt; xB += vB * dt; t += dt;
        if (t - lastSave >= 2e-3) { push(0); lastSave = t; }
        if (xA - CART.L / 2 < 0 || xB + CART.L / 2 > TRACK.len || opts.stopWhenApart) break;
        continue;
      }
      const g = gap0(xA, xB), near = b.kind === 'magnet' ? g < 0.06 : g < 0.004 || touching || gripped;
      let dt = !near ? 5e-4 : b.kind === 'magnet' ? Math.min(1e-4, 0.002 * (g + 2 * b.reach) / (Math.abs(vB - vA) + 0.01)) : 2e-6;
      if (touching && b.kind === 'pad' && vB - vA > 0 && b.k * -g + c * -(vB - vA) < 0.03 * peak) dt = 2e-8;   // tiny steps as a pad lets go
      // contact begins when the pads meet
      if (b.kind !== 'magnet' && !touching && !gripped && g <= 0 && vB - vA < 0) { touching = true; if (b.kind === 'grip') gripped = true; lost += 0.5 * b.k * pad * pad; pad = 0; }
      const acc = (xa, va, xb, vb) => { const F = force(xb - xa - CART.L - 2 * b.reach, vb - va); return [F, -F / mA, F / mB]; };
      const k1 = acc(xA, vA, xB, vB);
      const k2 = acc(xA + dt / 2 * vA, vA + dt / 2 * k1[1], xB + dt / 2 * vB, vB + dt / 2 * k1[2]);
      const k3 = acc(xA + dt / 2 * (vA + dt / 2 * k1[1]), vA + dt / 2 * k2[1], xB + dt / 2 * (vB + dt / 2 * k1[2]), vB + dt / 2 * k2[2]);
      const k4 = acc(xA + dt * (vA + dt / 2 * k2[1]), vA + dt * k3[1], xB + dt * (vB + dt / 2 * k2[2]), vB + dt * k3[2]);
      // heat in the damper over the step: c times the squared squeeze rate, by Simpson's rule on the stage rates
      if (c > 0 && (touching || gripped)) {
        const r1 = vB - vA, r2 = (vB + dt / 2 * k1[2]) - (vA + dt / 2 * k1[1]), r3 = (vB + dt / 2 * k2[2]) - (vA + dt / 2 * k2[1]), r4 = (vB + dt * k3[2]) - (vA + dt * k3[1]);
        const on = F => F > 0 || gripped ? 1 : 0;
        lost += dt / 6 * c * (on(k1[0]) * r1 * r1 + 2 * on(k2[0]) * r2 * r2 + 2 * on(k3[0]) * r3 * r3 + on(k4[0]) * r4 * r4);
      }
      xA += dt * (vA + dt / 6 * (k1[1] + k2[1] + k3[1])); vA += dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
      xB += dt * (vB + dt / 6 * (k1[2] + k2[2] + k3[2])); vB += dt / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
      t += dt;
      const gn = gap0(xA, xB), Fn = force(gn, vB - vA);
      if (Fn > 0 && first === null) first = t;
      if (Fn > 0) { last = t; peak = Math.max(peak, Fn); }
      // a pad lets go when its force would become a pull; the squeeze it still holds then relaxes into heat
      if (touching && b.kind === 'pad' && vB - vA > 0 && Fn <= 0) { touching = false; pad = Math.max(0, -gn); }
      if (!touching && pad > 0) { const pn = pad * Math.exp(-dt * b.k / c); lost += 0.5 * b.k * (pad * pad - pn * pn); pad = pn; if (pad < 1e-9) { lost += 0.5 * b.k * pad * pad; pad = 0; } }
      const busy = touching || gripped && Math.abs(vB - vA) > 1e-6 || (b.kind === 'magnet' && gn < 0.06);
      if (t - lastSave >= (busy ? 1e-4 : 2e-3)) { push(Fn); lastSave = t; }
      if (xA - CART.L / 2 < 0 || xB + CART.L / 2 > TRACK.len || (opts.stopWhenApart && first !== null && !touching && !gripped && gn > 0.08 && vB - vA > 0)) break;
      if (gripped && Math.abs(vB - vA) < 1e-7 && Math.abs(Fn) < 1e-4) {
        // settled: what little the Velcro still holds is lost, and the pair moves on at one speed (momentum unchanged)
        const V = (mA * vA + mB * vB) / (mA + mB); lost += 0.5 * mA * (vA - V) ** 2 + 0.5 * mB * (vB - V) ** 2 + 0.5 * b.k * gn * gn; vA = V; vB = V; locked = true; gripped = false; touching = false;
        xB = xA + CART.L + 2 * b.reach; push(0); lastSave = t;
      }
    }
    push(force(gap0(xA, xB), vB - vA));
    out.E0 = E0; out.first = first; out.last = last; out.peak = peak; out.mu = mu; out.c = c;
    return out;
  }

  const TEXT = {
    1: { lede: 'Two carts on a level track, with bumpers on the ends that meet. Predict: when a cart runs into an identical one at rest, what does each do afterward? Does the answer change with Velcro instead of springs? With a heavier cart?',
         notes: '<p><b>What to try.</b> Equal masses, one at rest, with magnets: the moving cart stops dead and the other carries on at its speed. Swap in Velcro: they move off together at half the speed. Try a heavy cart hitting a light one, then a light one hitting a heavy one. Send them at each other. Watch the magnified bumpers and the bars while they squeeze: the momentum bars of the two carts change, but their total never does; the kinetic energy drains into the bumpers and then comes back, or does not.</p>' +
                '<p><b>Why.</b> While the bumpers are in contact, each cart pushes on the other with the same force in the opposite direction (Newton\'s third law) for the same time, so whatever momentum one cart gains, the other loses: the total cannot change, whatever the bumpers are made of. Energy is another matter. As the bumpers squeeze, the carts\' kinetic energy is stored in them, like a compressed spring; magnets give it all back, springs most of it, rubber only part of it, and Velcro grabs and keeps the carts together, turning into heat all the energy that the carts could have used to separate. A collision that gives back all the kinetic energy is called elastic; one where the objects stick is perfectly inelastic. The share of the closing speed with which the carts separate is the coefficient of restitution: 1 for the magnets here, 0.85 for the springs, 0.5 for the rubber, 0 for Velcro.</p>' +
                '<p><b>The model.</b> Carts of 0.25 kg, with 0.25 kg bars added on top, on a frictionless track. The magnets repel without touching, with a force that grows as the inverse fourth power of the gap; the springs and rubber pads are each a spring with a damper (internal friction) alongside, which can push but not pull; Velcro grips once it touches. Each bumper is tuned to return the same share of the closing speed whatever the masses and speeds, as textbooks assume; real bumpers vary somewhat. The squeeze lasts a few hundredths of a second and is shown slowed down.</p>' },
    2: { lede: 'The same collision, watched twice: from the lab, and by a camera riding along with the center of mass. Predict: from the moving camera, what does every collision look like, whatever the masses and speeds?',
         notes: '<p><b>What to try.</b> Set up any collision, say a heavy cart overtaking a light one, and watch the lower view. Then switch the bumpers between magnets, springs, rubber and Velcro. Compare the energy bar here with the one on the first screen.</p>' +
                '<p><b>Why.</b> The center of mass moves at a steady velocity, the total momentum divided by the total mass, because the carts\' forces on each other cancel. Ride along with it and the total momentum is zero: the carts always come in from opposite sides, with equal and opposite momenta, and leave the same way. Elastic, they bounce back at the speeds they came in with; with Velcro, they stop dead together. Only this energy, of the carts\' motion relative to the center of mass, is available to the bumpers. The rest, (1/2)<i>MV</i><sup>2</sup> for the motion of the center of mass itself, is untouchable: that is why sticking carts in the lab keep moving, and why the most energy a collision can lose is (1/2)μ<i>v</i><sub>rel</sub><sup>2</sup>, with μ = <i>m</i><sub>A</sub><i>m</i><sub>B</sub>/(<i>m</i><sub>A</sub> + <i>m</i><sub>B</sub>).</p>' +
                '<p><b>The model.</b> Exactly the same collision as on the first screen; only the camera differs. In the lower view the track slides past underneath.</p>' }
  };

  function visibility() {
    $('go').textContent = !run ? 'Go' : playing ? 'Pause' : simT >= run.tEnd ? 'Run again' : 'Resume';
    document.querySelectorAll('#bump button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === P.bumper)));
    const closing = P.vA - P.vB > 0;
    $('hint').textContent = !closing ? 'with these velocities the carts never meet' : run && simT >= run.tEnd ? (run.end === 'track end' ? 'a cart reached the end of the track' : '') : '';
  }
  function vals() {
    const mtxt = m => m.toFixed(2) + ' kg' + (bars(m) ? ' (cart + ' + bars(m) + ' bar' + (bars(m) > 1 ? 's' : '') + ')' : ' (empty cart)');
    $('mA_v').textContent = mtxt(P.mA); $('mB_v').textContent = mtxt(P.mB);
    const vtxt = v => fmtV(v) + (Math.abs(v) < 0.001 ? ' (at rest)' : v > 0 ? ' (right)' : ' (left)');
    $('vA_v').textContent = vtxt(P.vA); $('vB_v').textContent = vtxt(P.vB);
  }
  function sync() { $('mA').value = String(P.mA); $('mB').value = String(P.mB); $('vA').value = String(P.vA); $('vB').value = String(P.vB); vals(); }
  function reset() { run = null; playing = false; simT = 0; }
  function upd() { visibility(); vals(); readout(); draw(); }
  function setTab(k) {
    tab = k;
    [1, 2].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    reset(); sync(); upd();
  }
  [1, 2].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  document.querySelectorAll('#bump button').forEach(b => b.addEventListener('click', () => { P.bumper = b.dataset.v; reset(); upd(); }));
  ['mA', 'mB', 'vA', 'vB'].forEach(id => $(id).addEventListener('input', () => { P[id] = +$(id).value; reset(); upd(); }));
  $('go').addEventListener('click', () => {
    if (!run || simT >= run.tEnd) { run = compute(); simT = 0; playing = true; }
    else playing = !playing;
    upd();
  });
  $('reset').addEventListener('click', () => { reset(); upd(); });
  $('slow').addEventListener('change', upd);
  window.addEventListener('resize', draw);

  // ================================================================
  // 4. LOOP
  // ================================================================
  let last = null;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (dt > 0 && playing && run && !document.hidden) {
      // advance in small pieces so the switch into and out of slow motion lands where it should
      let left = dt;
      while (left > 1e-9 && simT < run.tEnd) {
        const slow = slowNow(simT), rate = slow ? run.slowRate : 1, piece = Math.min(left, 0.004);
        let next = simT + piece * rate;
        if (!slow && run.slowFrom !== undefined && $('slow').checked && simT < run.slowFrom && next > run.slowFrom) { left -= (run.slowFrom - simT) / rate; simT = run.slowFrom; continue; }
        simT = Math.min(run.tEnd, next); left -= piece;
      }
      if (simT >= run.tEnd) { playing = false; visibility(); }
      readout(); draw();
    }
    requestAnimationFrame(frame);
  }
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
