<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/gravitational-lensing.test.js)
  // ================================================================
  // ---- physics core: gravitational lensing ----
  // SI units unless stated. Angles on the sky are in radians in the physics and converted to arcseconds for display.
  // Everything is in the thin-lens approximation: the bending happens where the light passes the lens, and every
  // angle is small.
  const PH = { G: 6.6743e-11, c: 2.99792458e8, Msun: 1.98841e30, Rsun: 6.957e8, AU: 1.495978707e11, pc: 3.0857e16, ly: 9.4607e15,
               yr: 3.15576e7, day: 86400, arcsec: Math.PI / 648000 };

  // ---- distances ----
  // Across the universe, the distances that go into lensing are "angular-diameter" distances in an expanding
  // universe (flat, with matter and dark energy; Planck 2018: H0 = 67.7 km/s/Mpc, matter 0.31).
  const COSMO = { H0: 67.7e3 / (1e6 * 3.0857e16), Om: 0.31 };
  function hubbleE(z, Om) { return Math.sqrt(Om * (1 + z) ** 3 + (1 - Om)); }
  // comoving distance to redshift z (Simpson's rule)
  function comoving(z, cos) {
    cos = cos || COSMO; const n = 400, h = z / n; let s = 0;
    for (let i = 0; i <= n; i++) { const w = i === 0 || i === n ? 1 : i % 2 ? 4 : 2; s += w / hubbleE(i * h, cos.Om); }
    return PH.c / cos.H0 * s * h / 3;
  }
  // the three distances lensing needs: observer to lens, observer to source, lens to source (not Ds - Dl)
  function lensDistances(zl, zs, cos) {
    const Ml = comoving(zl, cos), Ms = comoving(zs, cos);
    return { Dl: Ml / (1 + zl), Ds: Ms / (1 + zs), Dls: (Ms - Ml) / (1 + zs) };
  }
  // how long the light has been traveling from redshift z
  function lookback(z, cos) {
    cos = cos || COSMO; const n = 400, h = z / n; let s = 0;
    for (let i = 0; i <= n; i++) { const w = i === 0 || i === n ? 1 : i % 2 ? 4 : 2, zz = i * h; s += w / ((1 + zz) * hubbleE(zz, cos.Om)); }
    return s * h / 3 / cos.H0;
  }

  // ---- how strong a lens is: its Einstein radius (an angle on the sky) ----
  // a point mass M (a star, a black hole): the ring a source exactly behind it would make
  const thetaEPoint = (M, Dl, Ds, Dls) => Math.sqrt(4 * PH.G * M / (PH.c * PH.c) * Dls / (Dl * Ds));
  // a galaxy or cluster whose stars (or galaxies) move with speed spread sigma: a "singular isothermal" mass
  const thetaEIso = (sigma, Ds, Dls) => 4 * Math.PI * (sigma / PH.c) ** 2 * Dls / Ds;
  // the bending of light passing a point mass at distance b
  const bendAngle = (M, b) => 4 * PH.G * M / (PH.c * PH.c * b);

  // ---- lenses, in units of the Einstein radius (x, y and the deflection all in that unit) ----
  // lens: { kind: 'point' } | { kind: 'iso', q, ang } (an elliptical isothermal galaxy, axis ratio q, rotated by ang)
  //       | { kind: 'binary', m: [m1, m2], z: [[x1, y1], [x2, y2]] } (a star and its planet; masses add to 1)
  function deflect(L, x, y) {
    if (L.kind === 'point') { const r2 = x * x + y * y; return [x / r2, y / r2]; }
    if (L.kind === 'binary') { let ax = 0, ay = 0; for (let k = 0; k < 2; k++) { const dx = x - L.z[k][0], dy = y - L.z[k][1], r2 = dx * dx + dy * dy; ax += L.m[k] * dx / r2; ay += L.m[k] * dy / r2; } return [ax, ay]; }
    // isothermal: turn into the galaxy's own axes, where its mass per area is sqrt(q) / (2 sqrt(q^2 x^2 + y^2))
    const c = Math.cos(L.ang || 0), s = Math.sin(L.ang || 0), u = c * x + s * y, v = -s * x + c * y, q = L.q;
    let au, av;
    if (q > 0.9999) { const r = Math.hypot(u, v); au = u / r; av = v / r; }
    else { const f = Math.sqrt(1 - q * q), psi = Math.sqrt(q * q * u * u + v * v), k = Math.sqrt(q) / f;
      au = k * Math.atan(f * u / psi); av = k * Math.atanh(f * v / psi); }
    return [c * au - s * av, s * au + c * av];
  }
  // mass per area (convergence) at a point, in the same units: used for checking and for drawing
  function kappa(L, x, y) {
    if (L.kind === 'iso') { const c = Math.cos(L.ang || 0), s = Math.sin(L.ang || 0), u = c * x + s * y, v = -s * x + c * y; return Math.sqrt(L.q) / (2 * Math.sqrt(L.q * L.q * u * u + v * v)); }
    return 0;   // point masses: all the mass is at the points
  }
  // the lens equation: a ray seen at (x, y) came from the source plane at (x, y) - deflection
  function traceBack(L, x, y) { const a = deflect(L, x, y); return [x - a[0], y - a[1]]; }
  // how the picture is stretched: the Jacobian of the lens equation, and the magnification 1/det
  function jacobian(L, x, y, h) {
    h = h || 1e-6; const a = traceBack(L, x + h, y), b = traceBack(L, x - h, y), c = traceBack(L, x, y + h), d = traceBack(L, x, y - h);
    return [[(a[0] - b[0]) / (2 * h), (c[0] - d[0]) / (2 * h)], [(a[1] - b[1]) / (2 * h), (c[1] - d[1]) / (2 * h)]];
  }
  const detJ = (L, x, y) => { const J = jacobian(L, x, y); return J[0][0] * J[1][1] - J[0][1] * J[1][0]; };

  // ---- images of a point source ----
  // point lens: the source at distance u from the line of sight (Einstein radii) makes two images, on either side
  function pointImages(u) {
    const r = Math.sqrt(u * u + 4);
    return [{ x: (u + r) / 2, mag: (u * u + 2) / (2 * u * r) + 0.5 }, { x: (u - r) / 2, mag: (u * u + 2) / (2 * u * r) - 0.5 }];
  }
  const pointMag = u => (u * u + 2) / (u * Math.sqrt(u * u + 4));    // total brightening (Paczynski)
  // round isothermal lens: two images when the source is inside the Einstein radius, one outside
  function isoImages(u) {
    const im = [{ x: u + 1, mag: 1 + 1 / u }];
    if (u < 1) im.push({ x: u - 1, mag: 1 / u - 1 });
    return im;
  }
  // any lens: find the images of a point source at (bx, by) by searching a grid and polishing with Newton's method
  function findImages(L, bx, by, R) {
    R = R || 3; const N = 120, h = 2 * R / N, found = [];
    const F = (x, y) => { const t = traceBack(L, x, y); return [t[0] - bx, t[1] - by]; };
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      let x = -R + (i + 0.5) * h, y = -R + (j + 0.5) * h;
      for (let it = 0; it < 40; it++) {
        const f = F(x, y), J = jacobian(L, x, y), det = J[0][0] * J[1][1] - J[0][1] * J[1][0];
        if (!isFinite(det) || Math.abs(det) < 1e-14) break;
        const dx = (J[1][1] * f[0] - J[0][1] * f[1]) / det, dy = (-J[1][0] * f[0] + J[0][0] * f[1]) / det;
        const st = Math.hypot(dx, dy), lim = h * 2; const k = st > lim ? lim / st : 1;
        x -= k * dx; y -= k * dy; if (st < 1e-13) break;
      }
      const f = F(x, y);
      if (Math.hypot(f[0], f[1]) < 1e-10 && Math.hypot(x, y) < R * 1.2 && !found.some(p => Math.hypot(p.x - x, p.y - y) < 1e-6)) found.push({ x, y, mag: 1 / detJ(L, x, y) });

    } else {
      const A = mu.pts.length ? mu.pts[mu.pts.length - 1][1] : 1;
      html = card('Brightness', '×' + A.toFixed(2), 'peak ×' + pointMag(S.u0).toFixed(2) + ' from the star alone, for a closest approach of ' + S.u0.toFixed(2) + ' Einstein radii');
      html += card('Timescale', mu.tE.toFixed(0) + ' days', 'to cross one Einstein radius (' + fmtAngle(mu.thE) + ') at 200 km/s, for a ' + S.mass.toFixed(2) + ' solar-mass star 20,000 light-years away');
      html += card('Day', (mu.t > 0 ? '+' : '') + mu.t.toFixed(0), S.planet ? 'planet ' + mu.au.toFixed(1) + ' AU from its star; its blip lasts about a day, if the path crosses its caustic' : 'the images are ' + fmtAngle(2 * mu.thE) + ' apart at most; no telescope can separate them');
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }

  const TEXT = {
    1: { lede: 'Light passing a mass is bent toward it. Predict: if a galaxy sits almost exactly in front of a more distant one, how many copies of the distant galaxy could we see, and where?',
         notes: '<p><b>What to try.</b> Start with the Sun: starlight grazing its edge is bent by 1.75″, so a star near the Sun appears pushed outward. Then pick the galaxy and slide the source toward the line of sight: two paths reach us, one on each side, and we see two images. Slide it outside the Einstein radius and the second image fades away. Turn on more rays to see that most light misses us.</p>' +
                '<p><b>Why.</b> Mass curves space, and light follows the curves: a ray passing at distance b from a mass M is bent by 4GM/(c²b), twice what a Newtonian guess gives. Rays passing above and below the lens can both be bent toward us, so we see the source in two places. The angle at which a source directly behind the lens would appear on all sides at once is the Einstein radius; it measures the lens’s mass.</p>' +
                '<p><b>The model.</b> Thin lens: all the bending happens where the light passes the lens. Black hole: 6.5 billion solar masses (like M87’s), a point mass. Galaxy and cluster: isothermal (mass falling off as 1/r), with speed spreads of 250 and 1000 km/s, drawn round from the side. Lens at redshift 0.3, source at redshift 1, with distances from the expanding universe (Planck 2018). Heights are stretched so the tiny angles show.</p>' },
    2: { lede: 'A distant galaxy sits behind a closer, massive lens. Predict: as you move it to exactly behind the lens, what will its image turn into?',
         notes: '<p><b>What to try.</b> Drag the background galaxy across the lens and watch it stretch into arcs; put it exactly behind and it becomes a ring. With the galaxy lens, find the spots that give four images, an Einstein cross: they lie inside the small diamond in the corner panel. Notice the marked quarter: some images are flipped. Switch to the telescope view to see what Hubble would.</p>' +
                '<p><b>Why.</b> Each point of the picture is made by tracing its light back past the lens to where it left the background galaxy. Near the lens that light is bent the most, so points spread around a ring all trace back to the same small region behind the lens: the galaxy is stretched into arcs, and its total light grows. Where the stretching becomes infinite (the critical curve) arcs are longest; the source positions that put images there form the caustic.</p>' +
                '<p><b>The model.</b> The same lenses as the first tab, now with the galaxies elongated (elliptical isothermal, axis ratios 0.72 and 0.8). The picture is computed point by point from the exact lens equation. The black hole alone is unrealistic (it would sit inside a galaxy), but it shows the point-mass ring. Sizes are real: the scale bar is in arcseconds.</p>' },
    3: { lede: 'A dim star in our galaxy drifts in front of a more distant star. The two images it makes are far too close for any telescope to separate. Predict: what would a telescope see change?',
         notes: '<p><b>What to try.</b> Press Start and watch the background star brighten and fade over a few weeks. Bring the path closer to the lens star for a taller peak; make the lens star heavier for a longer event. Then give the lens star a planet: with the planet where it starts, the path crosses the planet’s caustic (the red dots) and a short spike appears. Move the planet in its orbit and the spike disappears, as it does in most real events.</p>' +
                '<p><b>Why.</b> The lens star makes two images of the background star, a fraction of a milliarcsecond apart, so we see one star that grows brighter as the images grow (×(u² + 2)/(u√(u² + 4)) at u Einstein radii). A planet near one of the images disturbs it briefly. Surveys such as OGLE and KMTNet watch hundreds of millions of bulge stars for these events, and have found well over a hundred planets this way, including ones as small as Earth.</p>' +
                '<p><b>The model.</b> Lens 6 kpc (20,000 light-years) away, source star like the Sun in the bulge at 8 kpc, moving across at 200 km/s; planet of one Jupiter mass. Images and brightening from the exact lens equation for one or two masses (the two-mass case as a fifth-degree polynomial), averaged over the source star’s disk. Time is sped up about 700,000 times.</p>' }
  };

  // ================================================================
  // 8. CONTROLS
  // ================================================================
  function visibility() {
    const one = tab === 1, two = tab === 2, three = tab === 3;
    $('lab_lens').hidden = three; $('lab_off').hidden = !one; $('lab_fan').hidden = !one || S.lens === 'sun';
    $('lab_size').hidden = !two; $('look').hidden = !two;
    $('lab_mass').hidden = !three; $('lab_u0').hidden = !three; $('lab_planet').hidden = !three; $('lab_pa').hidden = !three || !S.planet; $('lab_ps').hidden = !three || !S.planet;
    $('graph').hidden = !three; $('go').hidden = !three; $('reset').hidden = !three;
    document.querySelector('#lens button[data-v="sun"]').hidden = two;
    $('go').textContent = mu && mu.playing ? 'Pause' : (mu && mu.t >= MU.span ? 'Again' : (mu && mu.t > -MU.span ? 'Play' : 'Start'));
    $('hint').textContent = two ? 'drag the background galaxy' : '';
    document.querySelectorAll('#lens button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.lens)));
    document.querySelectorAll('#look button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.look)));
    document.querySelectorAll('#planet button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.v === '1') === S.planet)));
    $('fan').checked = S.fan;
    $('scene').classList.toggle('grab', two);
    $('off_name').textContent = S.lens === 'sun' ? 'Star\u2019s angle from the Sun' : 'Source\u2019s offset';
  }
  function vals() {
    const info = lensInfo(S.lens);
    if (S.lens === 'sun') { $('off').min = '1.02'; $('off').max = '5'; } else { $('off').min = '0.02'; $('off').max = '2'; }
    $('off').value = String(S.off[S.lens]);
    $('off_v').textContent = S.lens === 'sun' ? S.off.sun.toFixed(2) + ' Sun radii' : S.off[S.lens].toFixed(2) + ' Einstein radii (' + shortAngle(S.off[S.lens] * info.tE) + ')';
    $('size_v').textContent = 'radius ' + shortAngle(S.size * info.tE);
    $('mass_v').textContent = S.mass.toFixed(2) + ' solar masses'; $('u0_v').textContent = S.u0.toFixed(2) + ' Einstein radii';
    $('pa_v').textContent = S.pa + '°'; $('ps_v').textContent = S.ps.toFixed(2) + ' Einstein radii' + (mu ? ' = ' + mu.au.toFixed(1) + ' AU' : '');
  }
  function sync() { $('size').value = String(S.size); $('mass').value = String(S.mass); $('u0').value = String(S.u0); $('pa').value = String(S.pa); $('ps').value = String(S.ps); vals(); }
  function upd() { visibility(); vals(); draw(); readout(); }
  function setTab(k) {
    tab = k; if (k === 2 && S.lens === 'sun') S.lens = 'gal';
    [1, 2, 3].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    if (k === 3) { if (mu) mu.playing = false; startMicro(); }
    sync(); upd();
  }
  [1, 2, 3].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  document.querySelectorAll('#lens button').forEach(b => b.addEventListener('click', () => { S.lens = b.dataset.v; upd(); }));
  document.querySelectorAll('#look button').forEach(b => b.addEventListener('click', () => { S.look = b.dataset.v; upd(); }));
  document.querySelectorAll('#planet button').forEach(b => b.addEventListener('click', () => { S.planet = b.dataset.v === '1'; startMicro(); upd(); }));
  $('off').addEventListener('input', () => { S.off[S.lens] = +$('off').value; upd(); });
  $('fan').addEventListener('change', () => { S.fan = $('fan').checked; upd(); });
  $('size').addEventListener('input', () => { S.size = +$('size').value; upd(); });
  ['mass', 'u0', 'pa', 'ps'].forEach(id => $(id).addEventListener('input', () => { S[id] = +$(id).value; startMicro(); upd(); }));
  $('go').addEventListener('click', () => { if (mu.t >= MU.span) { startMicro(); } mu.playing = !mu.playing; upd(); });
  $('reset').addEventListener('click', () => { mu.playing = false; startMicro(); upd(); });
  window.addEventListener('resize', draw);
  // dragging the background galaxy (tab 2)
  const sc = $('scene'); let dragging = false;
  function toSrc(e) { const r = sc.getBoundingClientRect(), g = geom2(r.width, r.height); return [Math.max(-2, Math.min(2, (e.clientX - r.left - g.cx) / g.s)), Math.max(-1.8, Math.min(1.8, (g.cy - (e.clientY - r.top)) / g.s))]; }
  sc.addEventListener('pointerdown', e => { if (tab !== 2) return; dragging = true; S.src = toSrc(e); sc.setPointerCapture(e.pointerId); e.preventDefault(); upd(); });
  sc.addEventListener('pointermove', e => { if (!dragging) return; S.src = toSrc(e); upd(); });
  const endDrag = () => { dragging = false; }; sc.addEventListener('pointerup', endDrag); sc.addEventListener('pointercancel', endDrag);
  sc.addEventListener('keydown', e => { if (tab !== 2) return; const d = { ArrowLeft: [-0.05, 0], ArrowRight: [0.05, 0], ArrowUp: [0, 0.05], ArrowDown: [0, -0.05] }[e.key]; if (!d) return; S.src = [S.src[0] + d[0], S.src[1] + d[1]]; e.preventDefault(); upd(); });

  // ================================================================
  // 9. LOOP (only the microlensing tab moves)
  // ================================================================
  let last = null, lastRead = 0;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts;
    if (tab === 3 && mu && mu.playing && dt > 0 && !document.hidden) {
      stepMicro(reduced ? 2 * MU.span : dt * 8);        // 8 days per second
      draw(); if (ts - lastRead > 120 || !mu.playing) { readout(); visibility(); lastRead = ts; }
    }
    requestAnimationFrame(frame);
  }
  startMicro(); setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
