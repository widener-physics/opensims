<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/rainbow.test.js)
  // ================================================================
  // ---- physics core: rainbows ----
  // Angles in radians unless a name says deg; wavelengths in nanometers. A drop is a sphere of radius 1, and
  // sunlight comes in along +x. A ray that enters at height b (from -1 to 1, in units of the radius) leaves after
  // bouncing k times inside. Its "angle out" is the angle between the light coming out and the line pointing back
  // along the sunlight: that is the angle, seen from the ground, between the drop and the shadow of your head.
  const DEG = Math.PI / 180;

  // ---- water's refractive index ----
  // The IAPWS formulation (Harvey et al. 1998, IAPWS R9-97), for liquid water at 20 °C and 998.21 kg/m³
  const IAPWS = { a: [0.244257733, 9.74634476e-3, -3.73234996e-3, 2.68678472e-4, 1.58920570e-3, 2.45934259e-3, 0.900704920, -1.66626219e-2],
                  luv: 0.2292020, lir: 5.432937 };   // the last two already divided by 0.589 µm
  function nWater(nm, tC, rho) {
    const T = ((tC === undefined ? 20 : tC) + 273.15) / 273.15, d = (rho === undefined ? 998.21 : rho) / 1000, L = nm / 589, a = IAPWS.a, L2 = L * L;
    const A = d * (a[0] + a[1] * d + a[2] * T + a[3] * L2 * T + a[4] / L2 + a[5] / (L2 - IAPWS.luv * IAPWS.luv) + a[6] / (L2 - IAPWS.lir * IAPWS.lir) + a[7] * d * d);
    return Math.sqrt((2 * A + 1) / (1 - A));                 // from (n² - 1)/(n² + 2) = A
  }
  // air's refractive index (Ciddor 1996, standard dry air at 15 °C and 101 325 Pa), wavelength in vacuum
  const nAir = nm => { const s2 = (1000 / nm) ** 2; return 1 + 1e-8 * (5792105 / (238.0185 - s2) + 167917 / (57.362 - s2)); };
  // what bends the light in a raindrop: water's index relative to the air around it
  const nDrop = nm => nWater(nm) / nAir(nm);
  // the colors of the spectrum the sim draws rays in, violet to red
  const SPECTRUM = Array.from({ length: 16 }, (_, j) => 400 + 20 * j);

  // ---- one ray through a drop ----
  // the angles at the surface: in from the air at i, bent to r inside
  function angles(b, n) { const i = Math.asin(Math.min(1, Math.abs(b))); return { i, r: Math.asin(Math.sin(i) / n) }; }
  // how far the ray has turned after k bounces inside (Descartes): bent at the way in, turned back at each bounce, bent on the way out
  const turn = (b, n, k) => { const { i, r } = angles(b, n); return 2 * (i - r) + k * (Math.PI - 2 * r); };
  // the angle out: between the light coming out and the line pointing back toward the Sun (0 to π)
  const angleOut = (b, n, k) => Math.acos(Math.max(-1, Math.min(1, -Math.cos(turn(b, n, k)))));
  // the rainbow: the ray whose angle out stops changing, where the light piles up. There cos² i = (n² - 1)/(k² + 2k).
  function bow(n, k) { const i = Math.acos(Math.sqrt((n * n - 1) / (k * k + 2 * k))), b = Math.sin(i); return { b, i, deg: angleOut(b, n, k) / DEG }; }
  // the ray's path for drawing: the points where it meets the drop's surface, and the direction it leaves in
  function path(b, n, k) {
    const x0 = -Math.sqrt(Math.max(0, 1 - b * b)), pts = [[-3, b], [x0, b]];
    let p = [x0, b], d = [1, 0];
    const refract = (d, nrm, eta) => { const c = -(d[0] * nrm[0] + d[1] * nrm[1]), s2 = eta * eta * (1 - c * c); if (s2 > 1) return null; const t = eta * c - Math.sqrt(1 - s2); return [eta * d[0] + t * nrm[0], eta * d[1] + t * nrm[1]]; };
    d = refract(d, p, 1 / n);                                  // the outward normal of a unit sphere at p is p itself
    for (let j = 0; j <= k; j++) {
      const s = -2 * (p[0] * d[0] + p[1] * d[1]); p = [p[0] + s * d[0], p[1] + s * d[1]]; pts.push(p);   // across the drop to the far side
      if (j < k) { const dn = p[0] * d[0] + p[1] * d[1]; d = [d[0] - 2 * dn * p[0], d[1] - 2 * dn * p[1]]; }   // a bounce
    }
    const nIn = [-p[0], -p[1]]; d = refract(d, nIn, n);         // out into the air
    return { pts, out: d };
  }

  // ---- how much light each ray keeps ----
  // Fresnel: the share reflected at a water surface for light arriving from the air at angle i, for the two polarizations
  function fresnel(i, n) {
    const r = Math.asin(Math.sin(i) / n), ci = Math.cos(i), cr = Math.cos(r);
    const rs = (ci - n * cr) / (ci + n * cr), rp = (n * ci - cr) / (n * ci + cr);
    return { s: rs * rs, p: rp * rp };
  }
  // the share of a ray's light that comes out after k bounces: let through on the way in, reflected k times, let
  // through on the way out (inside, the ray meets the surface at r, which reflects the same share as i outside)
  function kept(b, n, k) { const { i } = angles(b, n), R = fresnel(i, n); return 0.5 * ((1 - R.s) ** 2 * R.s ** k + (1 - R.p) ** 2 * R.p ** k); }

  // ---- the brightness of the sky in each direction ----
  // Light from all the drops sent out at each angle from the shadow of your head, per unit of sky (solid angle), for
  // one color: sunlight falling evenly on each drop's face, each ray weighted by the light it keeps. Bins of width
  // step degrees from 0 to 180. Geometric optics: the true peak at the bow is rounded off by diffraction (see notes).
  function brightness(n, k, step) {
    const nb = Math.round(180 / step), out = new Float64Array(nb), N = 40000;
    for (let j = 0; j < N; j++) {
      const b = Math.sqrt((j + 0.5) / N), w = kept(b, n, k) / N, th = angleOut(b, n, k) / DEG;   // b = √u: an even spread over the drop's face
      out[Math.min(nb - 1, Math.floor(th / step))] += w;
    }
    for (let m = 0; m < nb; m++) { const a = (m + 0.5) * step * DEG; out[m] /= 2 * Math.PI * Math.sin(a) * step * DEG; }
    return out;
  }
  // the same for evenly spaced rays across a drop's middle, counted rather than weighed: what the drawing of a drop shows
  function rayCount(n, k, step, N) {
    const nb = Math.round(180 / step), out = new Array(nb).fill(0);
    for (let j = 0; j < N; j++) { const b = (j + 0.5) / N; out[Math.min(nb - 1, Math.floor(angleOut(b, n, k) / DEG / step))]++; }
    return out;
  }

  // ---- where the bow is in the sky ----
  // Directions as (azimuth, elevation), with azimuth 0 straight away from the Sun. With the Sun at height h, the
  // shadow of your head is at elevation -h; the bow is the circle of drops at angle a (degrees) from it.
  const unit = (az, el) => [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];
  function bowCircle(hDeg, aDeg, n) {
    const h = hDeg * DEG, a = aDeg * DEG, pts = [];
    const A = unit(0, -h), U = unit(0, Math.PI / 2 - h), V = [0, 1, 0];      // the shadow point, and two directions at right angles to it
    for (let j = 0; j <= n; j++) { const f = 2 * Math.PI * j / n, v = [0, 1, 2].map(q => Math.cos(a) * A[q] + Math.sin(a) * (Math.cos(f) * U[q] + Math.sin(f) * V[q]));
      pts.push({ az: Math.atan2(v[1], v[0]) / DEG, el: Math.asin(Math.max(-1, Math.min(1, v[2]))) / DEG }); }
    return pts;
  }
  const bowTop = (hDeg, aDeg) => aDeg - hDeg;                 // the top of the bow, in degrees above the horizon
  // the angle between a direction and the shadow of your head
  const fromShadow = (az, el, hDeg) => { const A = unit(0, -hDeg * DEG), v = unit(az * DEG, el * DEG); return Math.acos(Math.max(-1, Math.min(1, A[0] * v[0] + A[1] * v[1] + A[2] * v[2]))) / DEG; };

  // ---- the colors the eye sees ----
  // CIE 1931 color-matching functions, as the multi-lobe fit of Wyman, Sloan and Shirley (2013)
  const lobe = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
  const cmf = nm => [1.056 * lobe(nm, 599.8, 37.9, 31.0) + 0.362 * lobe(nm, 442.0, 16.0, 26.7) - 0.065 * lobe(nm, 501.1, 20.4, 26.2),
                     0.821 * lobe(nm, 568.8, 46.9, 40.5) + 0.286 * lobe(nm, 530.9, 16.3, 31.1),
                     1.217 * lobe(nm, 437.0, 11.8, 36.0) + 0.681 * lobe(nm, 459.0, 26.0, 13.8)];
  // sunlight's spectrum, as a 5772 K blackbody (relative)
  const sun = nm => { const l = nm * 1e-9; return 1 / (Math.pow(l / 5e-7, 5) * Math.expm1(0.0143877688 / (l * 5772))); };
  // screen red, green and blue before gamma, from X, Y, Z
  const linRGB = (X, Y, Z) => [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.2040 * Y + 1.0570 * Z];

  // ================================================================

  // what you see, looking toward the rain: drawn so that every direction is at its true angle from the shadow of

      for (let az = -100; az <= 100; az += 2) { const v = unit(az * DEG, 0), d = Math.acos(Math.max(-1, Math.min(1, v[0] * A[0] + v[1] * A[1] + v[2] * A[2]))), f = Math.atan2(v[0] * V[0] + v[1] * V[1] + v[2] * V[2], v[0] * U[0] + v[1] * U[1] + v[2] * U[2]);
        pts.push([cx + d / DEG * Math.sin(f) * s, cy - d / DEG * Math.cos(f) * s]); }
      ctx.fillStyle = C('--ground'); ctx.beginPath(); ctx.moveTo(p.x - 10, p.y + p.h + 10); pts.forEach(q => ctx.lineTo(...q)); ctx.lineTo(p.x + p.w + 10, p.y + p.h + 10); ctx.closePath(); ctx.fill();
      // where the bow would be, if there were drops below the ground
      ctx.save(); ctx.beginPath(); ctx.moveTo(p.x - 10, p.y + p.h + 10); pts.forEach(q => ctx.lineTo(...q)); ctx.lineTo(p.x + p.w + 10, p.y + p.h + 10); ctx.closePath(); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.setLineDash([4, 5]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, bow(NS[RED], 1).deg * s, 0, TAU); ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }
    // the center: the shadow of your head
    font(ctx, 10); ctx.textAlign = 'center';
    if (cy < p.y + p.h - 4) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillText('shadow of your head', cx, cy + 18); }
    else { ctx.fillStyle = '#fff'; ctx.fillText('↓ shadow of your head, ' + h + '° below the horizon', cx, p.y + p.h - 6); }
    font(ctx, 11); ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(compact ? 'what you see' : 'what you see, facing the rain', p.x + 8, p.y + 15);
    ctx.restore();
  }

  function draw() {
    const s = fit($('scene'));
    s.ctx.clearRect(0, 0, s.W, s.H);
    if (s.W >= 120 && s.H >= 80) { if (tab === 2) drawCircle(s.ctx, s.W, s.H, s.compact); else drawDrop(s.ctx, s.W, s.H, s.compact); }
    if (tab !== 2) { const g = fit($('graph')); g.ctx.clearRect(0, 0, g.W, g.H); if (g.W >= 160 && g.H >= 90) drawCurve(g.ctx, g.W, g.H, g.compact); }
  }

  // ================================================================
  // 4. READOUTS AND TEXT
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  let lastHTML = '';
  function readout() {
    let html = '';
    if (tab === 1 || tab === 4) {
      const k = tab === 4 ? S.k : 1, b = S.b[tab], a = angles(b, N1);
      html = card('Angle in', deg(a.i / DEG), 'between the sunlight and the perpendicular to the drop’s surface, where it enters');
      if (tab === 1) html += card('Bent to', deg(a.r / DEG), 'inside the water, by Snell’s law: sin ' + deg(a.i / DEG) + ' = ' + N1.toFixed(3) + ' × sin ' + deg(a.r / DEG));
      else html += card('Light it keeps', (100 * kept(b, N1, k)).toFixed(1) + '%', 'of the ray’s light comes out; the rest goes through the back of the drop or is reflected away where it enters' + (k === 2 ? ', and at the second bounce' : ''));
      html += card('Angle out', deg(angleOut(k === 2 ? -b : b, N1, k) / DEG), k === 1 ? '= 4 × ' + deg(a.r / DEG) + ' − 2 × ' + deg(a.i / DEG) + ': the angle between the light coming out and the line back toward the Sun' : '= 180° + 2 × ' + deg(a.i / DEG) + ' − 6 × ' + deg(a.r / DEG) + ', between the light coming out and the line back toward the Sun');
    } else if (tab === 3) {
      const b = S.b[3], ar = angleOut(b, NS[RED], 1) / DEG, av = angleOut(b, NS[0], 1) / DEG;
      html = card('Red light comes out at', deg(ar), 'water bends red (700 nm) least: n = ' + NS[RED].toFixed(4));
      html += card('Violet light comes out at', deg(av), 'and violet (400 nm) most: n = ' + NS[0].toFixed(4));
      html += card('Red minus violet', (ar - av >= 0 ? '+' : '−') + Math.abs(ar - av).toFixed(2) + '°', 'for this ray; the 14 colors between fall in between');
    } else {
      const h = S.h, top = bowTop(h, bow(NS[RED], 1).deg);
      html = card('The Sun’s height', h + '°', 'above the horizon, behind you');
      html += card('Shadow of your head', h + '° below the horizon', 'straight away from the Sun: the center of the bow');
      html += card('Top of the bow', S.where === 'plane' ? 'a full circle' : top > 0 ? top.toFixed(1) + '° above the horizon' : 'below the horizon', S.where === 'plane' ? 'with drops below you as well as ahead, nothing cuts the circle off' : top > 0 ? 'the outer, red edge; the bow is the part of the circle above the ground' : 'with the Sun this high, the whole circle is below the horizon: no rainbow');
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }

  const TEXT = {
    1: { lede: 'Sunlight enters a raindrop, bounces once off the back, and comes out again. Predict: does the light come out spread evenly in every direction, or bunched up in some directions more than others?',
         notes: '<p><b>What to try.</b> Move the slider from the middle of the drop to its edge, and watch the angle out, and the graph below, which fills in with every ray you send. A ray through the middle comes straight back. Rays further out come out at bigger angles, but only up to a point; then the angle shrinks again. Look at the count on the right as you go, then send in many rays at once and look where they crowd together.</p>' +
                '<p><b>Why.</b> The angle out rises, stops, and falls as you move out across the drop. Near the turning point, a whole range of rays come out at almost the same angle, about 42°, so light piles up there: the drop sends out more light at 42° than at any other angle, and none beyond it. Every drop does the same, which is what makes a rainbow: a bright line in the sky, 42° from the point straight opposite the Sun. René Descartes worked this out in 1637 by tracing ten thousand rays by hand.</p>' +
                '<p><b>The model.</b> Light as rays (geometric optics) through a round drop of water at 20 °C, for one color, yellow-orange light of 589 nm, for which water’s refractive index relative to air is ' + N1.toFixed(4) + ' (the IAPWS formula). Only the light that bounces once off the back is drawn; most of each ray goes straight through, and a little reflects off the front. The size of the drop doesn’t matter to the rays.</p>' },
    2: { lede: 'You stand with the Sun low behind you, facing a rain shower. Every drop does what you saw on the first screen. Predict: which drops send rainbow light to your eye, and why does the bow come out as part of a circle?',
         notes: '<p><b>What to try.</b> Press the button to light up the drops that send you light. Then raise the Sun: the bow sinks, and once the Sun is higher than 42°, it disappears below the horizon. That’s why rainbows come in the morning and late afternoon, not at midday in summer. Then go up in an airplane.</p>' +
                '<p><b>Why.</b> Each drop sends the most light at 42° from the line back toward the Sun. So the drops you see bright are the ones 42° from the point straight opposite the Sun, which, with the Sun behind you, is the shadow of your head. All the directions 42° from one point make a cone, with your eye at its tip, and you see it as a circle around the shadow of your head. The ground cuts it off, so from the ground you see an arc; from an airplane you can see the full circle. Because the bow is a set of directions from your eye, not a thing in one place, everyone sees their own rainbow, made by different drops, and it moves with you as you walk.</p>' +
                '<p><b>The model.</b> The sky is drawn so that every direction appears at its true angle from the shadow of your head, the center of the picture, which keeps circles around it round; the horizon curves down at the sides because of it. The colors and brightness come from the same rays as the other screens, for all colors of sunlight, smeared by half a degree because the Sun is not a point but a disk that wide. Only the light that bounces once is drawn here. The side view shows drops in one plane only; the drops at 42° to the left and right of you light up the sides of the bow. From the ground, only drops above your eyes are lit: in a distant shower, the drops below eye level all lie just under the horizon. A garden sprinkler, close by, can show you a bow below the horizon, against the ground.</p>' },
    3: { lede: 'Sunlight is a mix of all colors, and water bends each one a little differently. Predict: in a rainbow, which color is on the outside of the bow, and which on the inside?',
         notes: '<p><b>What to try.</b> Sweep the slider across the drop, slowly near the edge, and watch the colors in the graph, which is zoomed in to the top of the curves. Each color has its own curve, and each turns at its own angle. Send in many rays to see the whole fan.</p>' +
                '<p><b>Why.</b> Water bends violet light more than red, so a violet ray turns more sharply on the way in and out, and comes out at a smaller angle. Violet piles up at about 40.6° and red at about 42.4°, so seen in the sky, red is the outer edge of the bow and violet the inner. Isaac Newton explained the colors this way in 1704. Inside the bow, all the colors overlap, which is why the sky just inside a rainbow is brighter and whiter than outside it.</p>' +
                '<p><b>What the rays leave out.</b> Light is a wave, and near the bow’s angle the rays that come out together interfere. That makes faint extra bands, pink and green, just inside the violet: supernumerary bows, which no ray theory can explain; Thomas Young used them in 1804 as evidence that light is a wave. How far apart they are depends on the size of the drops. Drops a millimeter across give a bright bow with sharp colors; in fog, with drops a hundredth that size, the colors smear into each other and the bow is almost white: a fogbow.</p>' +
                '<p><b>The model.</b> Rays of 16 colors from 400 to 700 nm, with water’s refractive index relative to air at 20 °C from the IAPWS formula, from ' + NS[RED].toFixed(4) + ' (red) to ' + NS[0].toFixed(4) + ' (violet). The colors on screen are each wavelength’s color as near as a screen can show it.</p>' },
    4: { lede: 'Sometimes there is a second, fainter rainbow outside the first, with a band of darker sky between them. Predict: where does its light come from, and are its colors in the same order?',
         notes: '<p><b>What to try.</b> Bounce the ray twice and sweep it across the drop: it enters near the bottom of the drop this time, and the angle out comes down to a smallest value, then rises again. Compare how much light the ray keeps with one bounce and with two. Then show the sky.</p>' +
                '<p><b>Why.</b> Light that bounces twice inside piles up at about 51°, so it makes a second bow outside the first. Its colors are reversed, red on the inside, because the extra bounce turns the rays back the other way. It’s fainter because some light escapes at every bounce. Between the two bows, at 42° to 51°, no light comes out after either one bounce or two, so that band of sky is darker than either side: Alexander’s dark band, after Alexander of Aphrodisias, who described it around 200 AD. Light bounced three and four times makes bows too, but they lie toward the Sun and are almost never seen.</p>' +
                '<p><b>The model.</b> One color (589 nm) for the rays and the graph; the sky uses 16 colors of sunlight, with the light each ray keeps from Fresnel’s equations for both polarizations, smeared by the Sun’s half-degree width, over a gray rain cloud. Rays alone would make each bow infinitely sharp at its edge; in real drops, light’s wave nature rounds it off (see the notes on the previous screen).</p>' }
  };

  // ================================================================
  // 5. CONTROLS
  // ================================================================
  function visibility() {
    const drop = tab !== 2;
    $('lab_b').hidden = !drop; $('lab_k').hidden = tab !== 4; $('lab_h').hidden = tab !== 2; $('lab_where').hidden = tab !== 2;
    $('many').hidden = !drop; $('many').textContent = S.many[tab] ? 'Back to one ray' : 'Send in many rays';
    $('show').hidden = tab !== 2 && tab !== 4;
    $('show').textContent = tab === 2 ? (S.show ? 'Hide which drops' : 'Show the drops that send you light') : (S.sky ? 'Hide the sky' : 'Show the sky');
    $('show').className = (tab === 2 ? S.show : S.sky) ? 'secondary' : '';
    const ys = seenOf(tab), n = drop ? ys.reduce((s, v) => s + v, 0) : 0;
    $('hint').textContent = drop && n < 40 && !S.many[tab] ? 'move the slider to send in more rays' : '';
    $('graph').hidden = tab === 2; $('scene').classList.toggle('t2', tab === 2);
    document.querySelectorAll('#kseg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === S.k)));
    document.querySelectorAll('#where button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.where)));
    $('scene').setAttribute('aria-label', tab === 2 ? 'A person facing a rain shower with the Sun behind, seen from the side, and the rainbow they see' : 'A raindrop with sunlight passing through it');
    $('graph').setAttribute('aria-label', tab === 4 ? 'Angle out against where the ray enters, and the sky at each angle' : 'Angle out against where the ray enters, and how many rays come out at each angle');
  }
  function vals() {
    const b = S.b[tab] || 0; $('b').value = String(b);
    $('b_v').textContent = b === 0 ? 'the middle' : b === 1 ? 'the very edge' : b.toFixed(3) + ' of the way to the edge';
    $('h').value = String(S.h); $('h_v').textContent = S.h + '°';
  }
  function mark() { if (tab === 2) return; seenOf(tab)[Math.round(S.b[tab] * STEPS)] = 1; }
  function upd() { mark(); visibility(); vals(); draw(); readout(); }
  function setTab(k) { tab = k; [1, 2, 3, 4].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k))); $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes; upd(); }
  [1, 2, 3, 4].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  $('b').addEventListener('input', () => { S.b[tab] = +$('b').value; upd(); });
  $('h').addEventListener('input', () => { S.h = +$('h').value; upd(); });
  document.querySelectorAll('#kseg button').forEach(b => b.addEventListener('click', () => { S.k = +b.dataset.v; upd(); }));
  document.querySelectorAll('#where button').forEach(b => b.addEventListener('click', () => { S.where = b.dataset.v; upd(); }));
  $('many').addEventListener('click', () => { S.many[tab] = !S.many[tab]; if (S.many[tab]) seenOf(tab).fill(1); upd(); });
  $('show').addEventListener('click', () => { if (tab === 2) S.show = !S.show; else S.sky = !S.sky; upd(); });
  window.addEventListener('resize', draw);
  setTab(1);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
