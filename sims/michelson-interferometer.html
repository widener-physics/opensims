    <label id="lab_lam"><div class="row"><span>Wavelength</span><span class="val" id="lam_v"></span></div><input type="range" id="lam" min="400" max="700" step="0.1"></label>
    <label id="lab_d"><div class="row"><span>Movable mirror: arm difference</span><span class="val" id="d_v"></span></div><input type="range" id="d" min="0" max="2000" step="5"></label>
    <label id="lab_fine"><div class="row"><span>Fine screw</span><span class="val" id="fine_v"></span></div><input type="range" id="fine" min="-1.5" max="1.5" step="0.005"></label>
    <div class="grp" id="lab_obj"><div>In the right arm</div><div class="seg" id="obj" role="group" aria-label="In the right arm"><button data-v="cell">a 3 cm gas cell</button><button data-v="warm">warm air</button></div></div>

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/michelson-interferometer.test.js)
  // ================================================================
  // ---- physics core: the Michelson interferometer ----
  // SI units (lengths in meters). A beam splitter sends half the light down each arm; each returns from a mirror and the
  // two halves meet again at the screen. What the screen shows depends only on the difference in the light's trip:
  // twice the difference in arm lengths, plus anything that slows the light in one arm.
  const LASERS = [{ id: 'red', name: 'helium-neon, red', lam: 632.8e-9 }, { id: 'green', name: 'green', lam: 532.0e-9 }, { id: 'blue', name: 'blue', lam: 450.0e-9 }];

  // ---- the ring pattern ----
  // The light spreads out a little from the laser (a lens in front of it), so it crosses the arms at small angles theta.
  // The returning beams look as if they came from two point sources, one 2d behind the other along the axis, so light
  // at angle theta has traveled 2 d cos(theta) farther in one arm, plus extra (the slowing in one arm).
  // Brightness (0 to 1, the two beams equal): cos^2(pi * difference / lambda)
  const pathDiff = (d, th, extra) => 2 * d * Math.cos(th) + (extra || 0);
  const brightness = (d, th, lam, extra) => Math.cos(Math.PI * pathDiff(d, th, extra) / lam) ** 2;
  // the bright rings on a screen covering angles up to thMax: orders m with 2 d cos(theta) + extra = m lambda
  function rings(d, lam, thMax, extra) {
    extra = extra || 0; const out = [], a = (2 * Math.abs(d) * Math.cos(thMax) + extra) / lam, b = (2 * Math.abs(d) + extra) / lam;
    for (let m = Math.ceil(Math.min(a, b)); m <= Math.floor(Math.max(a, b)); m++) { const c = (m * lam - extra) / (2 * Math.abs(d)); if (Math.abs(d) > 0 && c <= 1 && c >= Math.cos(thMax)) out.push({ m, th: Math.acos(c) }); }
    return out.sort((p, q) => p.th - q.th);
  }
  // moving the mirror by dx changes the trip by 2 dx: one ring appears (or vanishes) at the center for every lambda/2
  const fringesPassed = (dx, lam) => 2 * dx / lam;

  // ---- slowing the light in one arm ----
  // the refractive index of air (Edlen 1966, standard dry air at 15 C and 101 325 Pa), at vacuum wavelength lam
  function airIndex15(lam) { const s2 = (1e-6 / lam) ** 2; return 1 + 1e-8 * (8342.13 + 2406030 / (130 - s2) + 15997 / (38.9 - s2)); }
  // at pressure P (Pa) and temperature T (K): n - 1 is proportional to the gas's density, P / T (ideal gas)
  const airIndex = (lam, P, T) => 1 + (airIndex15(lam) - 1) * (P / 101325) * (288.15 / T);
  // a cell of length Lc in one arm, holding air at (P, T): the light crosses it twice
  const cellExtra = (lam, Lc, P, T) => 2 * Lc * (airIndex(lam, P, T) - 1);

  // ---- LIGO ----
  // arms L = 4 km; the light bounces back and forth about 280 times in each arm (an optical cavity) before returning;
  // infrared laser at 1064 nm. A gravitational wave of strain h passing straight down stretches one arm by h L / 2 and
  // squeezes the other by as much.
  const LIGO = { L: 4000, bounces: 280, lam: 1064e-9 };
  const armChange = (h, L) => h * (L || LIGO.L) / 2;
  // the change in the light's trip difference, and the phase it makes
  const ligoExtra = h => 2 * (2 * armChange(h)) * LIGO.bounces;
  const ligoPhase = h => 2 * Math.PI * ligoExtra(h) / LIGO.lam;
  // two black holes spiraling together: the wave's frequency rises as they close in. To leading order (Newtonian
  // "chirp"), with chirp mass Mc, the time left before they merge at frequency f is
  //   tau = (5/256) (pi f)^(-8/3) (G Mc / c^3)^(-5/3); the wave's frequency is twice the orbital frequency.
  const GC3 = 6.6743e-11 * 1.98841e30 / 2.99792458e8 ** 3;      // G Msun / c^3, seconds
  const chirpTau = (f, McSun) => 5 / 256 * Math.pow(Math.PI * f, -8 / 3) * Math.pow(McSun * GC3, -5 / 3);
  const chirpFreq = (tau, McSun) => Math.pow(256 / 5 * tau, -3 / 8) * Math.pow(McSun * GC3, -5 / 8) / Math.PI;
  // the wave itself, a time tau before merger: amplitude grows as f^(2/3); phase from integrating the frequency
  // (phi = -2 (tau / (5 G Mc/c^3))^(5/8)); scaled so its peak (at fMax) is hPeak
  function chirpStrain(tau, McSun, hPeak, fMax) {
    if (tau <= 0) return 0;
    const f = Math.min(chirpFreq(tau, McSun), fMax), ph = -2 * Math.pow(tau / (5 * McSun * GC3), 5 / 8);
    return hPeak * Math.pow(f / fMax, 2 / 3) * Math.cos(ph);
  }
  // ---- end of core ----

  // ================================================================
  // 2. STATE
  // ================================================================
  const TH_MAX = 0.075, TH_BEAM = 0.06;         // the screen shows angles up to 0.075 rad; the beam's own spread
  const S = { laser: 'red', lam: 632.8e-9, d: 1000e-6, fine: 0, obj: 'cell', P: 0, T: 20, gw: 'steady', waves: false };
  let tab = 1, moving = false, t = 0, count0 = null, gwT = 0, gwRun = false, trace = [];
  const MOVE_RATE = 0.25e-6;     // m per second when "Move it slowly"
  const LEAK_RATE = 2000;        // Pa per second when air is let into the cell
  const HEAT_RATE = 4;           // degrees per second when the air is warmed
  const D2 = 1000e-6;     // tab 2 keeps the arms at a fixed difference
  const dTotal = () => tab === 2 ? D2 : S.d + S.fine * 1e-6;
  // the extra trip in the right arm from what is in it (tab 2): relative to an empty, evacuated cell, or to 20 C air
  const extra = () => tab !== 2 ? 0 : S.obj === 'cell' ? cellExtra(S.lam, 0.03, S.P * 1000, 293.15) : -(cellExtra(S.lam, 0.10, 101325, 293.15) - cellExtra(S.lam, 0.10, 101325, S.T + 273.15));
  const phaseNow = () => (2 * dTotal() + extra()) / S.lam;       // trip difference in wavelengths at the center
  function resetCount() { count0 = phaseNow(); }

  // ================================================================
  // 3. DRAWING
  // ================================================================
  function fit(canvas) {
    const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, W: r.width, H: r.height, compact: r.width < 560, dpr };
  }
  const font = (ctx, px, wt) => { ctx.font = (wt || '') + ' ' + px + 'px ' + C('--sans'); };
  function label(ctx, txt, x, y) { ctx.save(); ctx.strokeStyle = C('--panel'); ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeText(txt, x, y); ctx.restore(); ctx.fillText(txt, x, y); }
  // the color of light of wavelength lam (approximate, for drawing)
  function rgb(lam) { const nm = lam * 1e9; let r = 0, g = 0, b = 0;
    if (nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; } else if (nm < 510) { g = 1; b = (510 - nm) / 20; } else if (nm < 580) { r = (nm - 510) / 70; g = 1; } else if (nm < 645) { r = 1; g = (645 - nm) / 65; } else r = 1;
    return [Math.round(255 * r), Math.round(255 * g), Math.round(255 * b)]; }
  const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  // a beam: a plain line, or the wave itself (crests every lw pixels), with phase ph (radians) at its start
  function beam(ctx, x0, y0, x1, y1, col, ph, wave, amp, w) {
    const L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L;
    if (!wave) { ctx.strokeStyle = col; ctx.lineWidth = w || 2.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); return; }
    const lw = 16; ctx.strokeStyle = col; ctx.lineWidth = w || 1.6; ctx.beginPath();
    for (let s = 0; s <= L; s += 1) { const yv = (amp || 5) * Math.sin(ph - TAU * s / lw); const px = x0 + ux * s - uy * yv, py = y0 + uy * s + ux * yv; s ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }

  $('fine').addEventListener('input', () => { S.fine = +$('fine').value; upd(); });
  $('P').addEventListener('input', () => { S.P = +$('P').value; upd(); });
  $('T').addEventListener('input', () => { S.T = +$('T').value; upd(); });
  $('go').addEventListener('click', () => { if (tab === 3) gwRun = !gwRun; else moving = !moving; upd(); });
  $('reset').addEventListener('click', () => { moving = false; if (tab === 1) { S.fine = 0; } if (tab === 2) { S.P = 0; S.T = 20; } if (tab === 3) { gwT = 0; trace = []; gwRun = true; } resetCount(); upd(); });
  $('waves').addEventListener('click', () => { S.waves = !S.waves; upd(); });
  window.addEventListener('resize', draw);
  // dragging the movable mirror (tab 1): a pixel is 5 nm, like turning a fine screw
  const sc = $('scene'); let drag = null;
  sc.addEventListener('pointerdown', e => { if (tab !== 1) return; drag = { x: e.clientX, fine: S.fine }; sc.setPointerCapture(e.pointerId); e.preventDefault(); });
  sc.addEventListener('pointermove', e => { if (!drag) return; S.fine = Math.max(-1.5, Math.min(1.5, drag.fine + (e.clientX - drag.x) * 0.005)); upd(); });
  const endDrag = () => { drag = null; }; sc.addEventListener('pointerup', endDrag); sc.addEventListener('pointercancel', endDrag);
  sc.addEventListener('keydown', e => { if (tab !== 1) return; const d = { ArrowLeft: -0.01, ArrowRight: 0.01 }[e.key]; if (d === undefined) return; S.fine = Math.max(-1.5, Math.min(1.5, S.fine + d)); e.preventDefault(); upd(); });

  // ================================================================
  // 6. LOOP
  // ================================================================
  let last = null, lastRead = 0;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts;
    if (dt > 0 && !document.hidden && !reduced) {
      t += dt;
      if (moving) {
        if (tab === 1) { S.fine += MOVE_RATE * dt * 1e6; if (S.fine > 1.5) { S.d += 1e-6; S.fine -= 1; } vals(); }
        if (tab === 2 && S.obj === 'cell') { S.P = Math.min(101.3, S.P + LEAK_RATE * dt / 1000); if (S.P >= 101.3) moving = false; vals(); }
        if (tab === 2 && S.obj === 'warm') { S.T = Math.min(120, S.T + HEAT_RATE * dt); if (S.T >= 120) moving = false; vals(); }
      }
      if (tab === 3 && gwRun) { gwT += dt; trace.push([gwT, strainNow()]); while (trace.length && trace[0][0] < gwT - 7) trace.shift(); if (S.gw === 'merger' && gwT > 6) { gwRun = false; } }
      draw();
      if (ts - lastRead > 120) { readout(); visibility(); lastRead = ts; }
    }
    requestAnimationFrame(frame);
  }
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
