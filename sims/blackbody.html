<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/blackbody.test.js)
  // ================================================================
  // ---- physics core: blackbody radiation ----
  // SI units: wavelength in meters, temperature in kelvin.
  const PC = { h: 6.62607015e-34, c: 2.99792458e8, k: 1.380649e-23, sigma: 5.670374419e-8, wien: 2.897771955e-3,
               Tsun: 5772, Rsun: 6.957e8, Lsun: 3.828e26 };      // IAU 2015 nominal solar values
  // Planck's law: power per unit area, per unit solid angle, per unit wavelength (W m^-2 sr^-1 m^-1)
  function planck(lam, T) {
    const x = PC.h * PC.c / (lam * PC.k * T);
    if (x > 700) return 0;
    return 2 * PC.h * PC.c * PC.c / Math.pow(lam, 5) / Math.expm1(x);
  }
  // the same, as power leaving each square meter of the surface per meter of wavelength (times pi: all directions)
  const exitance = (lam, T) => Math.PI * planck(lam, T);
  const peakWavelength = T => PC.wien / T;                          // Wien's displacement law
  const totalPower = T => PC.sigma * Math.pow(T, 4);                // Stefan-Boltzmann, W per square meter
  // the share of the power between two wavelengths (Simpson's rule on a log grid)
  function share(T, l1, l2) {
    const n = 600, a = Math.log(l1), b = Math.log(l2), dh = (b - a) / n; let s = 0;
    for (let i = 0; i <= n; i++) { const l = Math.exp(a + i * dh), w = i === 0 || i === n ? 1 : i % 2 ? 4 : 2; s += w * exitance(l, T) * l; }
    return s * dh / 3 / totalPower(T);
  }

  // ---- the color the eye sees ----
  // CIE 1931 color-matching functions, as the multi-lobe fit of Wyman, Sloan and Shirley (2013); wavelength in nm
  const lobe = (x, mu, s1, s2) => { const t = (x - mu) / (x < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
  const cmf = nm => [1.056 * lobe(nm, 599.8, 37.9, 31.0) + 0.362 * lobe(nm, 442.0, 16.0, 26.7) - 0.065 * lobe(nm, 501.1, 20.4, 26.2),
                     0.821 * lobe(nm, 568.8, 46.9, 40.5) + 0.286 * lobe(nm, 530.9, 16.3, 31.1),
                     1.217 * lobe(nm, 437.0, 11.8, 36.0) + 0.681 * lobe(nm, 459.0, 26.0, 13.8)];
  // tristimulus values X, Y, Z of a blackbody (arbitrary overall scale), and its chromaticity x, y
  function xyz(T) { let X = 0, Y = 0, Z = 0; for (let nm = 360; nm <= 830; nm += 1) { const p = planck(nm * 1e-9, T), m = cmf(nm); X += p * m[0]; Y += p * m[1]; Z += p * m[2]; } return [X, Y, Z]; }
  function chroma(T) { const v = xyz(T), s = v[0] + v[1] + v[2]; return [v[0] / s, v[1] / s]; }
  // the color as screen RGB (sRGB, 0-255), at full brightness: only its hue and saturation, not how bright it is.
  // Colors outside the screen's range are brought in by mixing in white.
  function srgb(X, Y, Z) {
    let r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z, g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z, b = 0.0557 * X - 0.2040 * Y + 1.0570 * Z;
    const lo = Math.min(r, g, b); if (lo < 0) { r -= lo; g -= lo; b -= lo; }
    const hi = Math.max(r, g, b); r /= hi; g /= hi; b /= hi;
    const enc = v => Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055));
    return [enc(r), enc(g), enc(b)];
  }
  const rgb = T => srgb(...xyz(T));

  // ---- measuring a star's color with filters ----
  // Johnson B and V filters, as bell curves with their standard centers and widths (445 nm, 94 nm wide; 551 nm, 88 nm)
  const FILTERS = { B: { c: 445e-9, w: 94e-9 }, V: { c: 551e-9, w: 88e-9 } };
  const filterT = (f, lam) => { const s = FILTERS[f].w / 2.3548; return Math.exp(-0.5 * Math.pow((lam - FILTERS[f].c) / s, 2)); };
  // the light a detector counts through a filter (photons, so weighted by wavelength), arbitrary scale
  function through(f, T) { let s = 0; for (let nm = 250; nm <= 850; nm += 1) { const l = nm * 1e-9; s += planck(l, T) * filterT(f, l) * l; } return s; }
  // the color index B - V = -2.5 log10(B/V) + zero point; the zero point makes Vega (a 9602 K blackbody here) 0.00
  const VEGA_T = 9602;
  const ZP = 2.5 * Math.log10(through('B', VEGA_T) / through('V', VEGA_T));
  const colorIndex = T => -2.5 * Math.log10(through('B', T) / through('V', T)) + ZP;
  // and back: the temperature with a given color index (bisection on log T; B - V falls as T rises)
  function tempFromIndex(bv) { let lo = Math.log(1500), hi = Math.log(60000); for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (colorIndex(Math.exp(m)) > bv) lo = m; else hi = m; } return Math.exp((lo + hi) / 2); }

  // ---- size from light ----
  // a star's luminosity, in units of the Sun's, from its radius (in Sun radii) and surface temperature
  const luminosity = (R, T) => R * R * Math.pow(T / PC.Tsun, 4);
  const radiusFrom = (L, T) => Math.sqrt(L) * Math.pow(PC.Tsun / T, 2);
  // some stars: surface temperature (K), radius and luminosity (in the Sun's), apparent V magnitude. The luminosities
  // are published ones, measured separately; luminosity() should come out close to them.
  const STARS = [
    { id: 'sun', name: 'the Sun', T: 5772, R: 1, L: 1 },
    { id: 'proxima', name: 'Proxima Centauri', T: 3042, R: 0.154, L: 0.00155, V: 11.13 },
    { id: 'betelgeuse', name: 'Betelgeuse', T: 3700, R: 760, L: 87000, V: 0.50 },
    { id: 'aldebaran', name: 'Aldebaran', T: 3900, R: 44.1, L: 439, V: 0.86 },
    { id: 'arcturus', name: 'Arcturus', T: 4286, R: 25.4, L: 170, V: -0.05 },
    { id: 'procyon', name: 'Procyon', T: 6530, R: 2.05, L: 6.93, V: 0.34 },
    { id: 'vega', name: 'Vega', T: 9602, R: 2.36, L: 40, V: 0.03 },
    { id: 'sirius', name: 'Sirius', T: 9940, R: 1.711, L: 25.4, V: -1.46 },
    { id: 'rigel', name: 'Rigel', T: 12100, R: 74.1, L: 120000, V: 0.13 },
    { id: 'siriusB', name: 'Sirius B', T: 25000, R: 0.008098, L: 0.02448, V: 8.44 }
  ];
  // ---- end of core ----

  // ================================================================
  // 2. SETTINGS AND STATE
  // ================================================================
  const star = id => STARS.find(s => s.id === id);
  const PRESETS = [{ name: 'a person', T: 310 }, { name: 'stove coil', T: 1000 }, { name: 'lava', T: 1400 }, { name: 'light bulb', T: 2800 },
                   { name: 'Betelgeuse', T: 3700 }, { name: 'the Sun', T: 5772 }, { name: 'Sirius', T: 9940 }, { name: 'Rigel', T: 12100 }];
  const SKY = ['sirius', 'vega', 'rigel', 'betelgeuse', 'arcturus', 'aldebaran', 'procyon'];      // tab 2
  const SKY_POS = { sirius: [0.30, 0.70], vega: [0.80, 0.22], rigel: [0.56, 0.78], betelgeuse: [0.44, 0.30], arcturus: [0.15, 0.32], aldebaran: [0.70, 0.52], procyon: [0.88, 0.80] };
  const SA = ['sun', 'proxima', 'sirius', 'siriusB', 'arcturus', 'betelgeuse', 'rigel'];          // tab 3
  // log sliders: 300 K to 30 000 K (tab 1); 2500 K to 40 000 K and 0.005 to 1000 Sun radii (tab 3)
  const logMap = (lo, hi) => ({ to: v => lo * Math.pow(hi / lo, v / 1000), from: x => Math.round(1000 * Math.log(x / lo) / Math.log(hi / lo)) });
  const MT = logMap(300, 30000), MTB = logMap(2500, 40000), MRB = logMap(0.005, 1000);
  const S = { T: 5772, kept: null, range: 2, sel: 'betelgeuse', flt: 'none', A: 'betelgeuse', TB: 5772, RB: 1 };
  let tab = 1;

  // ================================================================
  // 3. DRAWING
  // ================================================================
  function fit(canvas) {
    const dpr = window.devicePixelRatio || 1, r = canvas.getBoundingClientRect();
    const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, W: r.width, H: r.height, compact: r.width < 560 };

    ctx.save(); ctx.translate(12, b.y + b.h / 2); ctx.rotate(-Math.PI / 2); font(ctx, 10); ctx.fillStyle = C('--muted'); ctx.textAlign = 'center'; ctx.fillText('luminosity (Suns)', 0, 0); ctx.restore();
  }

  function draw() {
    const s = fit($('scene')), g = fit($('graph'));
    s.ctx.clearRect(0, 0, s.W, s.H); g.ctx.clearRect(0, 0, g.W, g.H);
    const okS = s.W >= 120 && s.H >= 80, okG = g.W >= 160 && g.H >= 90;
    if (tab === 1) { if (okS) drawSpectrum(s.ctx, s.W, s.H, s.compact); if (okG) drawSkyColor(g.ctx, g.W, g.H, g.compact); }
    else if (tab === 2) { if (okS) drawSkyFilter(s.ctx, s.W, s.H, s.compact); if (okG) drawMeasure(g.ctx, g.W, g.H, g.compact); }
    else { if (okS) drawPair(s.ctx, s.W, s.H, s.compact); if (okG) drawHR(g.ctx, g.W, g.H, g.compact); }
  }

  // ================================================================
  // 4. READOUTS AND TEXT
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  let lastHTML = '';
  function readout() {
    let html = '';
    if (tab === 1) {
      const lp = peakWavelength(S.T), P = totalPower(S.T), vis = share(S.T, 380e-9, 750e-9), sun = totalPower(PC.Tsun);
      html = card('Brightest at', lenStr(lp), 'in the ' + band(lp) + (lp > 750e-9 ? '' : ' part of the spectrum') + '; Wien’s law: 2.898 mm·K ÷ ' + kfmt(S.T));
      html += card('Power from each square meter', si(P) + 'W', 'σT⁴; ' + (Math.abs(P / sun - 1) < 0.005 ? 'the same as' : times(P / sun) + ' times') + ' the Sun’s surface. Double the temperature: 16 times the power');
      html += card('Share that is visible light', vis < 1e-4 ? (vis < 1e-12 ? 'none' : (100 * vis).toExponential(1) + '%') : (100 * vis).toFixed(vis < 0.1 ? 2 : 0) + '%', vis < 1e-12 ? 'all of it is infrared: we feel it as warmth but can’t see it' : 'between 380 and 750 nm; ' + (100 * share(S.T, 750e-9, 1) ).toFixed(0) + '% is infrared, ' + (100 * share(S.T, 1e-9, 380e-9)).toFixed(0) + '% ultraviolet');
    } else if (tab === 2) {
      const s = star(S.sel), fb = through('B', s.T), fv = through('V', s.T), bv = colorIndex(s.T), Tm = tempFromIndex(bv);
      html = card('Through B, through V', 'B/V = ' + (fb / fv * Math.pow(10, -0.4 * ZP)).toFixed(2), 'the ratio of the light each filter lets through, measured against Vega’s; bluer stars give more');
      html += card('Color index B − V', (bv >= 0 ? '+' : '−') + Math.abs(bv).toFixed(2), '−2.5 log₁₀ of that ratio: astronomers’ magnitudes. Positive is redder than Vega, negative bluer');
      html += card('Temperature from its color', kfmt(Math.round(Tm / 10) * 10), 'read off the blackbody curve. ' + s.name + '’s measured surface temperature: about ' + kfmt(s.T));
    } else {
      const A = star(S.A), LA = luminosity(A.R, A.T), LB = luminosity(S.RB, S.TB), r = LB / LA, rr = (S.RB / A.R) ** 2, tt = (S.TB / A.T) ** 4;
      html = card(A.name, Lstr(+LA.toPrecision(3)) + (A.id === 'sun' ? ' Sun' : ' Suns'), rStr(A.R) + ', ' + kfmt(A.T) + (A.id !== 'sun' ? '; published luminosity about ' + Lstr(A.L) : ''));
      html += card('Star B', Lstr(+LB.toPrecision(3)) + (Math.abs(LB - 1) < 0.005 ? ' Sun' : ' Suns'), rStr(S.RB) + ', ' + kfmt(S.TB));
      html += card('Star B compared with A', Math.abs(r - 1) < 0.005 ? 'just as bright' : (r > 1 ? times(r) + ' times brighter' : times(1 / r) + ' times fainter'), '= (radius ratio)² × (temperature ratio)⁴ = ' + fmtR(rr) + ' × ' + fmtR(tt) + '; the surface area times σT⁴');
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }
  const fmtR = v => { if (v >= 1000 || v < 0.01) { const e = Math.floor(Math.log10(v)); return (v / 10 ** e).toFixed(1) + ' × 10' + sup(e); } return +v.toPrecision(3) + ''; };
  const times = v => v >= 10 ? Lstr(+v.toPrecision(3)) : fmtR(v);

  const TEXT = {
    1: { lede: 'Everything gives off light because it is warm: you, a stove coil, the Sun. Predict: as something gets hotter, does the color of its glow change, or only how bright it is?',
         notes: '<p><b>What to try.</b> Start with a person: the curve peaks near 10 µm, far into the infrared, so switch to the 0–40 µm range to see all of it. Warm it up to a stove coil and lava and watch the peak slide toward the visible band as the curve grows enormously. Keep the Sun’s curve, then try Betelgeuse and Rigel: the hotter curve is higher at <i>every</i> wavelength, and its peak is bluer. Notice that the Sun peaks in the green but looks white: its curve is spread across all the colors.</p>' +
                '<p><b>Why.</b> A blackbody absorbs all light that falls on it, and gives off light with a spectrum that depends only on its temperature (Planck’s law). The peak moves to shorter wavelengths in proportion to 1/T (Wien’s law), and the total power from each square meter grows as σT⁴ (the Stefan–Boltzmann law). Stars are close to blackbodies, so their colors tell their temperatures: the cool red giant Betelgeuse peaks in the near infrared, the hot Rigel in the ultraviolet.</p>' +
                '<p><b>The model.</b> Planck’s law, with the 2019 SI constants. The power is per square meter of surface, per micrometer of wavelength, into all directions. The colors shown are what the eye would see, from the CIE’s color-matching curves, displayed at full brightness so only the hue changes; below about 800 K a body’s glow is too faint and too red to see. Temperatures: a person’s skin about 310 K (37 °C); a glowing stove coil about 1000 K; lava about 1400 K; a light bulb’s filament about 2800 K.</p>' },
    2: { lede: 'Astronomers can’t take a star’s temperature with a thermometer. Predict: with just a camera and two colored filters, how could you tell which star is hottest?',
         notes: '<p><b>What to try.</b> Look at the sky through the B filter, then the V filter. Betelgeuse and Aldebaran fade a lot through B, while Rigel and Vega barely change: blue light is a bigger share of a hot star’s light. Click each star and watch its point move along the curve. Compare Sirius and Vega: almost the same color, so almost the same temperature.</p>' +
                '<p><b>Why.</b> A camera behind a filter measures how much light the star gives in one range of colors. The ratio of the brightnesses through the blue (B) and yellow-green (V) filters doesn’t depend on how far away the star is or how big, only on the shape of its spectrum, which for a blackbody depends only on temperature. Astronomers write the ratio on their logarithmic magnitude scale as the color index B − V, set to zero for Vega. Reading it off the blackbody curve gives the temperature; this is how the temperatures of millions of stars are found.</p>' +
                '<p><b>The model.</b> Each star is a blackbody at its measured surface temperature, seen through bell-shaped approximations of the standard B and V filters (445 and 551 nm). Brightnesses through V are from the stars’ measured V magnitudes; their positions are not their real places in the sky. Real stars are not perfect blackbodies: dark absorption lines and the hydrogen in their atmospheres change their colors, so astronomers calibrate the color–temperature relation with stars of known temperature. The Sun’s measured B − V, for example, is 0.65, redder than the 0.44 of a 5772 K blackbody here.</p>' },
    3: { lede: 'Betelgeuse is cooler than the Sun: its surface is about 3700 K, the Sun’s 5772 K. Predict: does Betelgeuse give off more light than the Sun, or less?',
         notes: '<p><b>What to try.</b> With Betelgeuse as star A and the Sun as star B, compare: each square meter of Betelgeuse gives off a sixth of what the Sun’s does, but it has about 580 000 times the surface area. Then raise star B’s radius at a fixed temperature and watch it climb straight up the H–R diagram; raise its temperature at a fixed radius and watch it slide along a dashed line. Try Sirius B: hotter than any of the others, but tiny, so it is faint.</p>' +
                '<p><b>Why.</b> A star’s total output, its luminosity, is its surface area 4πR² times the power from each square meter, σT⁴. So L = 4πR²σT⁴, or in terms of the Sun, L = (R/R☉)² (T/T☉)⁴. Turned around, this is how astronomers find the sizes of most stars: the color gives the temperature, the brightness and distance give the luminosity, and the radius follows. On the H–R diagram, stars of one size lie along a line; the big, cool giants sit at the top right, the small, hot white dwarfs at the bottom left.</p>' +
                '<p><b>The model.</b> Stars as blackbody spheres. Temperatures, radii and luminosities from published measurements: the Sun (IAU 2015 values), Proxima Centauri, Sirius A and B, Arcturus, Betelgeuse (its radius from Joyce et al. 2020; it varies) and Rigel. The luminosities computed from radius and temperature agree with the published ones to within about 20%. The two stars in the picture are drawn to the same scale.</p>' }
  };

  // ================================================================
  // 5. CONTROLS
  // ================================================================
  $('pre').innerHTML = PRESETS.map((p, i) => '<button data-i="' + i + '">' + p.name + '</button>').join('');
  $('star').innerHTML = SKY.map(id => '<button data-v="' + id + '">' + star(id).name + '</button>').join('');
  $('sa').innerHTML = SA.map(id => '<button data-v="' + id + '">' + star(id).name.replace('the Sun', 'Sun') + '</button>').join('');
  function visibility() {
    $('lab_t').hidden = tab !== 1; $('lab_pre').hidden = tab !== 1; $('lab_rng').hidden = tab !== 1;
    $('lab_star').hidden = tab !== 2; $('lab_flt').hidden = tab !== 2;
    $('lab_sa').hidden = tab !== 3; $('lab_tb').hidden = tab !== 3; $('lab_rb').hidden = tab !== 3;
    $('keep').hidden = tab !== 1; $('unkeep').hidden = tab !== 1; $('unkeep').disabled = !S.kept;
    $('hint').textContent = tab === 1 ? (S.kept ? 'kept: ' + kfmt(S.kept) : '') : tab === 2 ? 'click a star in the sky, or pick one below' : '';
    document.querySelectorAll('#pre button').forEach(b => b.setAttribute('aria-pressed', String(PRESETS[+b.dataset.i].T === Math.round(S.T))));
    document.querySelectorAll('#rng button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === S.range)));
    document.querySelectorAll('#star button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.sel)));
    document.querySelectorAll('#flt button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.flt)));
    document.querySelectorAll('#sa button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.A)));
    $('scene').classList.toggle('pick', tab === 2); $('graph').classList.toggle('two', tab === 2);
    $('scene').setAttribute('aria-label', tab === 1 ? 'The spectrum of a blackbody' : tab === 2 ? 'Bright stars in the night sky, seen through a filter' : 'Two stars drawn to the same scale');
    $('graph').setAttribute('aria-label', tab === 1 ? 'The color of the glow, among stars of known temperature' : tab === 2 ? 'The star’s spectrum through each filter, and color index against temperature' : 'Hertzsprung–Russell diagram');
  }
  function vals() {
    $('t').value = String(MT.from(S.T)); $('t_v').textContent = kfmt(S.T) + ' (' + Math.round(S.T - 273.15).toLocaleString('en-US') + ' °C)';
    $('tb').value = String(MTB.from(S.TB)); $('tb_v').textContent = kfmt(S.TB);
    $('rb').value = String(MRB.from(S.RB)); $('rb_v').textContent = rStr(S.RB).replace(' × the Sun’s radius', ' R☉');
  }
  function upd() { visibility(); vals(); draw(); readout(); }
  function setTab(k) {
    tab = k; [1, 2, 3].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes; upd();
  }
  [1, 2, 3].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  // a round number for the slider's temperature, so presets and the slider agree
  const roundT = T => T < 1000 ? Math.round(T / 5) * 5 : Math.round(T / 10) * 10;
  $('t').addEventListener('input', () => { S.T = roundT(MT.to(+$('t').value)); upd(); });
  document.querySelectorAll('#pre button').forEach(b => b.addEventListener('click', () => { const p = PRESETS[+b.dataset.i]; S.T = p.T;
    // switch to a range that shows the peak
    const lp = peakWavelength(p.T) * 1e6; if (lp > S.range * 0.8 || (S.range > 2 && lp < S.range / 8)) S.range = lp < 1.6 ? 2 : lp < 8 ? 10 : 40; upd(); }));
  document.querySelectorAll('#rng button').forEach(b => b.addEventListener('click', () => { S.range = +b.dataset.v; upd(); }));
  $('keep').addEventListener('click', () => { S.kept = S.T; upd(); });
  $('unkeep').addEventListener('click', () => { S.kept = null; upd(); });
  document.querySelectorAll('#star button').forEach(b => b.addEventListener('click', () => { S.sel = b.dataset.v; upd(); }));
  document.querySelectorAll('#flt button').forEach(b => b.addEventListener('click', () => { S.flt = b.dataset.v; upd(); }));
  document.querySelectorAll('#sa button').forEach(b => b.addEventListener('click', () => { S.A = b.dataset.v; upd(); }));
  $('tb').addEventListener('input', () => { S.TB = Math.round(MTB.to(+$('tb').value) / 10) * 10; upd(); });
  $('rb').addEventListener('input', () => { const r = MRB.to(+$('rb').value); S.RB = +r.toPrecision(r < 1 ? 2 : 3); upd(); });
  // clicking a star in the sky
  $('scene').addEventListener('click', e => { if (tab !== 2) return; const r = $('scene').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 1e9; skyLayout(r.width, r.height).forEach(p => { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p.id; } });
    if (best && bd < 60) { S.sel = best; upd(); } });
  window.addEventListener('resize', draw);
  setTab(1);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
