      <div class="seg" id="preset" role="group" aria-label="Start from"><button data-v="sine">sine</button><button data-v="square">square</button><button data-v="triangle">triangle</button><button data-v="sawtooth">sawtooth</button><button data-v="clear">flat</button></div></div>
    <label class="check" id="lab_target"><input type="checkbox" id="target" checked> show the shape it’s aiming for</label>
    <div class="harm" id="harm"><div class="head">Each harmonic’s amplitude</div></div>
    <div class="grp" id="lab_ex"><div>Start from</div>
      <div class="seg" id="ex" role="group" aria-label="Start from"><button data-v="sine">sine</button><button data-v="hump">hump</button><button data-v="step">step</button><button data-v="spike">spike</button></div></div>
    <label id="lab_N"><div class="row"><span>Harmonics used</span><span class="val" id="N_v"></span></div><input type="range" id="N" min="1" max="20" step="1"></label>
    <div class="grp" id="lab_edge"><div>Switched on and off</div>
      <div class="seg" id="edge" role="group" aria-label="Switched on and off"><button data-v="smooth">smoothly</button><button data-v="sharp">sharply</button></div></div>
    <label id="lab_tau"><div class="row"><span>How long it lasts</span><span class="val" id="tau_v"></span></div><input type="range" id="tau" min="0" max="100" step="1"></label>

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/fourier.test.js)
  // ================================================================
  // ---- physics core: Fourier series and spectra ----
  // A repeating wave with period 1 (x counts periods) is a sum of a steady level a0 and sine and cosine waves at
  // whole-number multiples n of the repeat rate:  y(x) = a0 + sum over n of [ a_n cos(2 pi n x) + b_n sin(2 pi n x) ].
  const TWO_PI = 2 * Math.PI;
  // the standard shapes, height 1, and their known coefficients (all sine terms; they are odd functions of x)
  const SHAPES = {
    sine:     { name: 'sine',     f: x => Math.sin(TWO_PI * x), b: n => n === 1 ? 1 : 0, jump: 0 },
    square:   { name: 'square',   f: x => { const u = x - Math.floor(x); return u === 0 || u === 0.5 ? 0 : u < 0.5 ? 1 : -1; }, b: n => n % 2 ? 4 / (Math.PI * n) : 0, jump: 2 },
    triangle: { name: 'triangle', f: x => { const u = x - Math.floor(x); return u < 0.25 ? 4 * u : u < 0.75 ? 2 - 4 * u : 4 * u - 4; }, b: n => n % 2 ? 8 / (Math.PI * Math.PI * n * n) * ((n - 1) / 2 % 2 ? -1 : 1) : 0, jump: 0 },
    sawtooth: { name: 'sawtooth', f: x => { const u = x - Math.floor(x + 0.5); return u === -0.5 ? 0 : 2 * u; }, b: n => 2 * (n % 2 ? 1 : -1) / (Math.PI * n), jump: 2 }
  };
  // the first N coefficients of a shape, as arrays indexed by n (index 0 is the steady level)
  function shapeCoeffs(key, N) { const a = new Array(N + 1).fill(0), b = new Array(N + 1).fill(0); for (let n = 1; n <= N; n++) b[n] = SHAPES[key].b(n); return { a, b }; }
  // the sum, using terms 1..N (all of them if N is left out)
  function series(c, x, N) {
    const M = N === undefined ? Math.max(c.a.length, c.b.length) - 1 : Math.min(N, Math.max(c.a.length, c.b.length) - 1);
    let y = c.a[0] || 0;
    for (let n = 1; n <= M; n++) { const th = TWO_PI * n * x; y += (c.a[n] || 0) * Math.cos(th) + (c.b[n] || 0) * Math.sin(th); }
    return y;
  }
  // how far the sum overshoots near a jump, as a fraction of the jump (for square and sawtooth; Gibbs: about 0.0895)
  function overshoot(key, N, samples) {
    const c = shapeCoeffs(key, N), K = samples || 8000; let top = -Infinity;
    for (let i = 0; i < K; i++) top = Math.max(top, series(c, i / K));
    return (top - 1) / SHAPES[key].jump;
  }
  // the highest point the sum reaches (for the triangle: how far its corners are rounded off)
  function peak(c, N, samples) { const K = samples || 4000; let top = -Infinity; for (let i = 0; i < K; i++) top = Math.max(top, series(c, i / K, N)); return top; }

  // ---- a shape drawn by hand: M equally spaced samples over one period ----
  // a0 = average; a_n = (2/M) sum y_k cos(2 pi n k / M); b_n = (2/M) sum y_k sin(2 pi n k / M)  (for n below M/2)
  function analyze(y, N) {
    const M = y.length, a = new Array(N + 1).fill(0), b = new Array(N + 1).fill(0);
    for (let k = 0; k < M; k++) a[0] += y[k] / M;
    for (let n = 1; n <= N; n++) { let sa = 0, sb = 0; for (let k = 0; k < M; k++) { const th = TWO_PI * n * k / M; sa += y[k] * Math.cos(th); sb += y[k] * Math.sin(th); } a[n] = 2 * sa / M; b[n] = 2 * sb / M; }
    return { a, b };
  }
  const amplitude = (c, n) => Math.hypot(c.a[n] || 0, c.b[n] || 0);
  // root-mean-square difference between the samples and the sum of the first N terms
  function rmsMiss(y, c, N) { const M = y.length; let s = 0; for (let k = 0; k < M; k++) { const d = y[k] - series(c, k / M, N); s += d * d; } return Math.sqrt(s / M); }

  // ---- a short burst of a tone: how long it lasts against how spread out its frequencies are ----
  // the tone, frequency f0 (Hz), switched on and off by an envelope lasting tau seconds: smooth (a bell curve whose
  // full width at half height is tau) or sharp (on for exactly tau)
  const envelope = (t, tau, kind) => kind === 'sharp' ? (Math.abs(t) <= tau / 2 ? 1 : 0) : Math.exp(-4 * Math.LN2 * t * t / (tau * tau));
  const burst = (t, tau, kind, f0) => envelope(t, tau, kind) * Math.sin(TWO_PI * f0 * t);
  // its spectrum: the size of each frequency in it, |X(f)| with X(f) = integral of x(t) e^(-2 pi i f t) dt.
  // The envelope's transform E(f) is real; the sine splits it into copies at +f0 and -f0: |X| = |E(f - f0) - E(f + f0)| / 2
  function envSpec(f, tau, kind) {
    if (kind === 'sharp') return Math.abs(f) < 1e-12 ? tau : Math.sin(Math.PI * f * tau) / (Math.PI * f);
    return tau * Math.sqrt(Math.PI / (4 * Math.LN2)) * Math.exp(-Math.PI * Math.PI * tau * tau * f * f / (4 * Math.LN2));
  }
  const spectrum = (f, tau, kind, f0) => Math.abs(envSpec(f - f0, tau, kind) - envSpec(f + f0, tau, kind)) / 2;
  // the spread: the width of the spectrum's main peak at half its height (found by searching outward from the top)
  function spread(tau, kind, f0) {
    const S = f => spectrum(f, tau, kind, f0);
    // the top of the main peak: near f0, searched within a fraction of the expected width
    let fp = f0, top = S(f0); const w = 1 / tau;
    for (let i = -200; i <= 200; i++) { const f = f0 + i * w / 400; if (f > 0 && S(f) > top) { top = S(f); fp = f; } }
    const half = top / 2, edge = (dir) => {
      let lo = fp, hi = fp; const step = w / 50;
      while (S(hi) > half) { lo = hi; hi += dir * step; if (hi <= 0) return 0; }
      for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (S(m) > half) lo = m; else hi = m; }
      return (lo + hi) / 2;
    };
    const f1 = edge(-1), f2 = edge(1);
    return { f1, f2, df: f2 - f1, peak: fp, top };
  }
  // ---- end of core ----

  // ================================================================
  // 2. SETTINGS AND STATE
  // ================================================================
  const F0 = 220;                  // tabs 1 and 2: the wave repeats 220 times a second (A3)
  const TONE = 440;                // tab 3: concert A
  const NH = 10, NDRAW = 20, M = 256;
  const KEYS = ['sine', 'square', 'triangle', 'sawtooth'];
  const S = { b: new Array(NH + 1).fill(0), preset: 'sine', target: true,
              y: new Array(M).fill(0), ex: 'hump', N: 5, edge: 'smooth', tv: 50 };
  S.b[1] = 1;
  let tab = 1, coef = null;
  const tauOf = v => 0.002 * Math.pow(25, v / 100);      // 2 ms to 50 ms
  // the examples to draw over
  const EX = {
    sine: x => Math.sin(TAU * x),
    hump: x => 1.6 * Math.exp(-(((x - 0.5) / 0.1) ** 2)) - 0.8,
    step: x => x < 0.5 ? 0.7 : -0.7,
    spike: x => Math.abs(x - 0.5) < 0.012 ? 1 : -0.8
  };
  function setExample(k) { S.ex = k; for (let i = 0; i < M; i++) S.y[i] = EX[k](i / M); coef = analyze(S.y, NDRAW); }
  setExample('hump');
  // which standard shape (if any) the sliders now make, and with harmonics up to which number
  function matched() {
    let K = 0; for (let n = 1; n <= NH; n++) if (Math.abs(S.b[n]) > 0.004) K = n;
    if (!K) return null;
    for (const key of KEYS) { let good = true; for (let n = 1; n <= NH && good; n++) { const want = n <= K ? SHAPES[key].b(n) : 0; if (Math.abs(S.b[n] - want) > 0.006) good = false; } if (good) return { key, K }; }
    return null;
  }

  // ================================================================
  // 3. SOUND (Web Audio): only after the Sound button, or Play, is pressed
  // ================================================================

  // ================================================================
  // 4. DRAWING

  function curve(ctx, b, X, fn, x0, x1, col, w, dash) {

  }

  // ---- tab 1: the sum, two cycles ----
  function drawBuild(ctx, W, H, compact) {

    font(ctx, 11); ctx.fillStyle = C('--muted'); ctx.textAlign = 'left';
    label(ctx, compact ? 'the sum, two cycles' : 'the sum of the harmonics below: two cycles, repeating ' + F0 + ' times a second', b.x, 17);
    if (S.target && tk && !(m && m.key === 'sine')) { ctx.fillStyle = C('--target'); ctx.textAlign = 'right'; label(ctx, (compact ? '' : 'dashed: ') + 'a true ' + SHAPES[tk].name + ' wave', W - 12, 17); }
  }
  // ---- bars: one per harmonic ----
  function drawBars(ctx, W, H, compact, vals, K, R, signed, used, title, freqs) {
    const b = { x: compact ? 30 : 38, y: 26, w: 0, h: H - 26 - (freqs && !compact ? 34 : 22) }; b.w = W - b.x - 12;
    const Y = v => signed ? b.y + b.h / 2 - v / R * b.h / 2 : b.y + b.h - v / R * b.h;

  }
  // ---- tab 2: the drawing and the curve rebuilt from its harmonics ----
  const drawBox = (W, H) => { const compact = W < 560, b = { x: compact ? 30 : 38, y: 28, w: 0, h: H - 28 - 26 }; b.w = W - b.x - 12; return b; };
  const DR = 1.3;

  // ---- tab 3: the burst, and its spectrum ----

  function drawPulse(ctx, W, H, compact) {

  function drawSpectrum(ctx, W, H, compact) {

  function draw() {

  // ================================================================
  // 5. READOUTS AND TEXT
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  function listN(ns) { return ns.length > 5 ? ns.slice(0, 5).join(', ') + ', …' : ns.join(', '); }
  function readout() {
    let html = '';
    if (tab === 1) {
      const ns = []; for (let n = 1; n <= NH; n++) if (Math.abs(S.b[n]) > 0.004) ns.push(n);
      html = card('Harmonics in it', ns.length ? listN(ns) : 'none', ns.length ? 'at ' + listN(ns.map(n => n * F0)) + ' Hz: whole-number multiples of ' + F0 + ' Hz' : 'every amplitude is zero: a flat line');
      const m = matched();
      if (!m) html += card('Shape', ns.length ? 'your own mix' : '—', ns.length ? 'not the start of a standard shape; the buttons above set one' : 'pick a shape above, or raise a slider');

      html += card('Pitch', ns.length ? F0 + ' Hz (A3)' : '—', 'every mix repeats ' + F0 + ' times a second, so the pitch stays the same; the harmonics change the tone');

      html += card('Average level', fmt(coef.a[0], 2), 'the steady part (harmonic 0); it doesn’t change the sound');
    } else {
      const tau = tauOf(S.tv), sp = spread(tau, S.edge, TONE);
      html = card('Lasts', (tau * 1000).toFixed(1) + ' ms', 'about ' + (tau * TONE).toFixed(tau * TONE < 10 ? 1 : 0) + ' cycles of the ' + TONE + ' Hz tone' + (S.edge === 'smooth' ? ' (width at half height)' : ''));
      html += card('Frequencies in it', sp.f1.toFixed(0) + ' to ' + sp.f2.toFixed(0) + ' Hz', 'a spread of ' + sp.df.toFixed(0) + ' Hz, across the peak at half its height');

  const TEXT = {
    1: { lede: 'Every repeating wave can be built by adding sine waves at whole-number multiples of one frequency. Predict: can smooth sine waves add up to a square wave, with its sudden jumps?',
         notes: '<p><b>What to try.</b> Start with the sine wave, then raise the third harmonic a little, then the fifth: the sum flattens on top. Press square to set the first five odd harmonics at once, then lower the higher ones one at a time and watch the corners soften. Look closely at the jumps: the sum overshoots. Try the triangle wave: with the same harmonics its sum is almost perfect. Turn the sound on as you add harmonics: the pitch stays the same while the tone grows brighter. Then flip a harmonic over (make its amplitude negative): the shape changes a lot, but the sound hardly at all.</p>' +
                '<p><b>Why.</b> Any wave that repeats f times a second is a sum of sine waves at f, 2f, 3f, and so on (Fourier’s theorem). A square wave needs only the odd harmonics, with amplitudes 4/(πn); a triangle wave also needs only odd ones, but they fall as 1/n², so a few are enough. Smooth shapes need few harmonics; sharp corners and jumps need many. At a jump the sum always overshoots, by about 9% of the jump however many harmonics you add: more harmonics squeeze the overshoot closer to the jump but never shrink it (the Gibbs phenomenon). Your ear mostly hears how much of each harmonic there is, not how they line up, which is why flipping one changes the tone so little.</p>' +
                '<p><b>The model.</b> Ten harmonics of 220 Hz (the A below middle C), each a sine wave starting at zero; a negative amplitude is the same sine wave flipped over. The standard shapes have height 1. The sound is made in your browser from exactly these amplitudes, at a fixed loudness setting, so flipping a harmonic doesn’t change the volume.</p>' },
    2: { lede: 'Draw any repeating shape and see which harmonics it is made of. Predict: does a smooth hump or a sudden step need more harmonics to rebuild?',
         notes: '<p><b>What to try.</b> Draw over the gray curve with the mouse or a finger: whatever you draw is one cycle of a wave that repeats forever. Slide the number of harmonics and watch the blue curve close in on your drawing. Compare the hump, the step and the spike: the hump’s harmonics die away quickly, the step’s fall slowly, and the spike’s hardly fall at all. Make the two ends of your drawing meet at different heights and see what the rebuilt curve does at the edges. Turn on the sound to hear your drawing.</p>' +
                '<p><b>Why.</b> Each harmonic’s amplitude measures how much your drawing resembles a sine or cosine wave at that frequency: multiply them together and average over a cycle. Smooth drawings are made almost entirely of low harmonics; sharp features need high ones, and a very narrow spike needs nearly all of them equally (the same trade-off as on the next tab). The end of one cycle joins the start of the next, so if your ends don’t meet, that is a jump, and the rebuilt curve wiggles and overshoots there.</p>' +
                '<p><b>The model.</b> Your drawing is stored as 256 equally spaced heights over one cycle. Each harmonic’s cosine and sine parts, a and b, are found by summing over those points (a discrete Fourier transform); its amplitude, plotted in the bars, is √(a² + b²). The average level is listed separately. The sound repeats your cycle 220 times a second, as on the first tab.</p>' },
    3: { lede: 'A 440 Hz tone that lasts only a moment. Predict: does a very short beep contain only 440 Hz?',
         notes: '<p><b>What to try.</b> Play the pulse at about 50 ms: a clear beep. Make it shorter and play it again, watching the spectrum: it spreads out, and at a few milliseconds the pitch is gone and you hear a click. Then switch it on and off sharply: ripples appear on both sides of the spectrum, and you can hear a click at each end.</p>' +
                '<p><b>Why.</b> Only a sine wave that goes on forever has a single frequency. Switch it on and off and it is no longer a single sine wave: it is a mixture of many, near 440 Hz, which add up to the burst and cancel everywhere else. The shorter the burst, the wider the range of frequencies it takes, so the duration times the spread stays about the same. This is why sending short pulses quickly takes a wide band of radio frequencies, and in quantum mechanics, where frequency stands for energy, the same trade-off is the uncertainty principle.</p>' +
                '<p><b>The model.</b> A 440 Hz tone (concert A) shaped by a bell curve (its duration is the width at half height) or switched on and off sharply. The spectrum is the size of its Fourier transform, calculated exactly, and scaled so its peak is always the same height. The spread is the width of the main peak at half its height. For long bursts, duration × spread is 4 ln 2/π = 0.88 for the bell curve and 1.21 for sharp edges.</p>' }

  function visibility() {

    $('lab_ex').hidden = tab !== 2; $('lab_N').hidden = tab !== 2;
    $('lab_edge').hidden = tab !== 3; $('lab_tau').hidden = tab !== 3;
    $('snd').hidden = tab === 3; $('play').hidden = tab !== 3;
    $('snd').textContent = AU.on ? 'Sound: on' : 'Sound: off'; $('snd').setAttribute('aria-pressed', String(AU.on));
    $('hint').textContent = tab === 2 ? 'draw on the wave above' : tab === 3 ? 'turn your volume down a little first' : '';
    const m = matched(), pv = m && m.key === S.preset ? S.preset : (!m && S.preset === 'clear' && !S.b.some(v => Math.abs(v) > 0.004) ? 'clear' : null);
    document.querySelectorAll('#preset button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === pv)));
    document.querySelectorAll('#ex button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.ex)));
    document.querySelectorAll('#edge button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.edge)));
    $('scene').classList.toggle('draw', tab === 2);
    $('scene').setAttribute('aria-label', tab === 1 ? 'The sum of the harmonics' : tab === 2 ? 'Drawing area: one cycle of a wave, and the curve rebuilt from its harmonics' : 'A short burst of a 440 Hz tone');
    $('graph').setAttribute('aria-label', tab === 3 ? 'The frequencies in the burst' : 'The amplitude of each harmonic');
  }
  function vals() {
    for (let n = 1; n <= NH; n++) { $('h' + n).value = String(S.b[n]); $('h' + n + '_v').textContent = fmt(S.b[n], 2); }
    $('target').checked = S.target;
    $('N').value = String(S.N); $('N_v').textContent = S.N + ' of ' + NDRAW;
    $('tau').value = String(S.tv); $('tau_v').textContent = (tauOf(S.tv) * 1000).toFixed(1) + ' ms';
  }
  function upd() { visibility(); vals(); draw(); readout(); audioUpdate(); }
  function setTab(k) {
    tab = k; [1, 2, 3].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes; upd();
  }
  [1, 2, 3].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  document.querySelectorAll('#preset button').forEach(b => b.addEventListener('click', () => { const k = b.dataset.v; S.preset = k;
    for (let n = 1; n <= NH; n++) S.b[n] = k === 'clear' ? 0 : SHAPES[k].b(n); upd(); }));
  for (let n = 1; n <= NH; n++) $('h' + n).addEventListener('input', () => { S.b[n] = +$('h' + n).value; upd(); });
  $('target').addEventListener('change', () => { S.target = $('target').checked; upd(); });
  document.querySelectorAll('#ex button').forEach(b => b.addEventListener('click', () => { setExample(b.dataset.v); upd(); }));
  $('N').addEventListener('input', () => { S.N = +$('N').value; upd(); });
  document.querySelectorAll('#edge button').forEach(b => b.addEventListener('click', () => { S.edge = b.dataset.v; upd(); }));
  $('tau').addEventListener('input', () => { S.tv = +$('tau').value; upd(); });
  $('snd').addEventListener('click', () => { if (!AU.on) AU.on = audioInit(); else { AU.on = false; audioQuiet(); } upd(); });
  $('play').addEventListener('click', playBurst);
  window.addEventListener('resize', draw);
  // drawing on tab 2: every sample the pointer passes over is set, joining up fast strokes
  const sc = $('scene'); let pen = null;
  function at(e) { const r = sc.getBoundingClientRect(), b = drawBox(r.width, r.height);
    const k = Math.max(0, Math.min(M - 1, Math.round((e.clientX - r.left - b.x) / b.w * M))), v = Math.max(-1, Math.min(1, -((e.clientY - r.top) - (b.y + b.h / 2)) / (b.h / 2) * DR));
    return [k, v]; }
  function paint(p) {
    if (pen) { const [k0, v0] = pen, [k1, v1] = p, s = k1 >= k0 ? 1 : -1; for (let k = k0; k !== k1 + s; k += s) S.y[k] = k1 === k0 ? v1 : v0 + (v1 - v0) * (k - k0) / (k1 - k0); }
    else S.y[p[0]] = p[1];
    pen = p; S.ex = null; coef = analyze(S.y, NDRAW);
  }
  let queued = false;
  sc.addEventListener('pointerdown', e => { if (tab !== 2) return; pen = null; paint(at(e)); sc.setPointerCapture(e.pointerId); e.preventDefault(); upd(); });
  sc.addEventListener('pointermove', e => { if (tab !== 2 || !pen) return; paint(at(e)); if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; upd(); }); } });
  const endPen = () => { if (pen) { pen = null; upd(); } };
  sc.addEventListener('pointerup', endPen); sc.addEventListener('pointercancel', endPen);

  setTab(1);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
