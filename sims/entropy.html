<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/entropy.test.js)
  // ================================================================
  // ---- physics core: entropy and microstates ----
  const KB = 1.380649e-23;                       // Boltzmann's constant, J/K
  // ---- counting ----
  // ln n!: added up exactly below 256, Stirling's series above (error below 1e-12)
  const LNF = [0]; for (let i = 1; i < 256; i++) LNF[i] = LNF[i - 1] + Math.log(i);
  function lnFact(n) {
    if (n < 256) return LNF[n];
    return n * Math.log(n) - n + 0.5 * Math.log(2 * Math.PI * n) + 1 / (12 * n) - 1 / (360 * n * n * n);
  }
  const lnChoose = (n, k) => k < 0 || k > n ? -Infinity : lnFact(n) - lnFact(k) - lnFact(n - k);
  // N molecules, each in the left or right half: the number of arrangements with n on the left, and its chance
  const lnWays = (N, n) => lnChoose(N, n);
  const chance = (N, n) => Math.exp(lnChoose(N, n) - N * Math.LN2);
  // the chance that the fraction on the left is within d of one half
  function chanceWithin(N, d) { let p = 0; for (let n = 0; n <= N; n++) if (Math.abs(n / N - 0.5) <= d + 1e-12) p += chance(N, n); return p; }
  // a number given by its natural log, written as mantissa and power of ten
  function tenPow(lnx) { const l = lnx / Math.LN10, e = Math.floor(l); return { m: Math.pow(10, l - e), e }; }

  // ---- two Einstein solids sharing energy ----
  // a solid of N oscillators holding q packets (quanta) of energy: ways = (q + N - 1)! / (q! (N - 1)!)
  const lnOmegaSolid = (N, q) => lnChoose(q + N - 1, q);
  // for every split qA + qB = q: ln of the ways for A, for B, and together
  function splits(NA, NB, q) { const out = []; for (let qA = 0; qA <= q; qA++) { const a = lnOmegaSolid(NA, qA), b = lnOmegaSolid(NB, q - qA); out.push({ qA, a, b, t: a + b }); } return out; }
  // temperature, in units of (packet energy)/k: 1/T = dS/dU, from the large-number formula S/k = (q+N) ln(q+N) - q ln q - N ln N
  const tempSolid = (N, q) => q <= 0 ? 0 : 1 / Math.log(1 + N / q);
  // one random step: a randomly chosen oscillator, if it has any energy, gives one packet to another randomly chosen one.
  // The chance of any step equals the chance of its reverse, so in the long run every arrangement is equally likely.
  function hop(st, rand) { const n = st.length, i = Math.floor(rand() * n); if (st[i] > 0) { const j = Math.floor(rand() * n); st[i]--; st[j]++; return [i, j]; } return null; }

  // ---- a gas of colliding disks in a box 2 wide and 1 tall, with a partition down the middle ----
  // Positions are kept as whole numbers of a tiny unit (1/2^30 of the box's height) and stepped with the Verlet rule
  //   x(next) = 2 x(now) - x(before) + round(a dt^2)
  // in whole numbers, so that reversing the motion (swapping "now" and "before") retraces it exactly, bit for bit
  // (Levesque and Verlet 1993). Disks push apart like stiff springs while they overlap; so do the walls.
  const GAS = { Q: 1073741824, dt: 2e-4, W: 2, H: 1 };
  GAS.k = 0.5 * Math.PI * Math.PI / Math.pow(12 * GAS.dt, 2);     // stiffness: a collision lasts about 12 steps
  const diskRadius = N => Math.min(0.03, Math.sqrt(0.22 / (Math.PI * N)));
  function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  // N disks placed at random in the left half (or within a corner box), moving in random directions;
  // speeds from the 2D thermal (Maxwell) distribution with rms speed vrms, or all equal if `same`
  function makeGas(N, opt) {
    opt = opt || {}; const rand = mulberry(opt.seed || 1), r = opt.r || diskRadius(N), Q = GAS.Q, dt = GAS.dt;
    const box = opt.box || [0, 0, 1, 1], vrms = opt.vrms || 1;
    const x = new Float64Array(N), y = new Float64Array(N), px = new Float64Array(N), py = new Float64Array(N); let placed = 0, tries = 0;
    while (placed < N && tries < 2e6) { tries++;
      const cx = box[0] + r + rand() * (box[2] - box[0] - 2 * r), cy = box[1] + r + rand() * (box[3] - box[1] - 2 * r); let ok = true;
      for (let j = 0; j < placed && ok; j++) if ((x[j] / Q - cx) ** 2 + (y[j] / Q - cy) ** 2 < 4.4 * r * r) ok = false;
      if (ok) { x[placed] = Math.round(cx * Q); y[placed] = Math.round(cy * Q); placed++; } }
    for (let i = 0; i < N; i++) { const a = rand() * 2 * Math.PI, s = opt.same ? vrms : vrms * Math.sqrt(-Math.log(1 - rand()));
      px[i] = x[i] - Math.round(s * Math.cos(a) * dt * Q); py[i] = y[i] - Math.round(s * Math.sin(a) * dt * Q); }
    return { N, r, x, y, px, py, wall: opt.wall !== false, steps: 0, dir: 1, fx: new Float64Array(N), fy: new Float64Array(N), placed };
  }
  // forces (per unit mass) on every disk, from the positions now
  function forces(g) {
    const Q = GAS.Q, k = GAS.k, r = g.r, N = g.N, d2 = 4 * r * r, fx = g.fx, fy = g.fy;
    fx.fill(0); fy.fill(0);
    const cs = 2 * r, nx = Math.max(1, Math.floor(GAS.W / cs)), ny = Math.max(1, Math.floor(GAS.H / cs));
    if (!g.head || g.head.length !== nx * ny) { g.head = new Int32Array(nx * ny); g.next = new Int32Array(N); g.cell = new Int32Array(N); }
    const head = g.head, next = g.next, cell = g.cell; head.fill(-1);
    for (let i = 0; i < N; i++) { const X = g.x[i] / Q, Y = g.y[i] / Q;
      // walls: the outer ones, and the partition while it is in
      if (X < r) fx[i] += k * (r - X); if (X > GAS.W - r) fx[i] -= k * (X - GAS.W + r);
      if (Y < r) fy[i] += k * (r - Y); if (Y > GAS.H - r) fy[i] -= k * (Y - GAS.H + r);
      if (g.wall) { const m = GAS.W / 2; if (X < m && X > m - r) fx[i] -= k * (X - m + r); else if (X >= m && X < m + r) fx[i] += k * (m + r - X); }
      const cx = Math.min(nx - 1, Math.max(0, Math.floor(X / GAS.W * nx))), cy = Math.min(ny - 1, Math.max(0, Math.floor(Y / GAS.H * ny))), c = cy * nx + cx;
      cell[i] = c; next[i] = head[c]; head[c] = i; }
    for (let i = 0; i < N; i++) {
      const c = cell[i], cx = c % nx, cy = (c - cx) / nx, X = g.x[i] / Q, Y = g.y[i] / Q;
      for (let oy = -1; oy <= 1; oy++) { const yy = cy + oy; if (yy < 0 || yy >= ny) continue;
        for (let ox = -1; ox <= 1; ox++) { const xx = cx + ox; if (xx < 0 || xx >= nx) continue;
          for (let j = head[yy * nx + xx]; j >= 0; j = next[j]) { if (j <= i) continue;
            const dx = X - g.x[j] / Q, dy = Y - g.y[j] / Q, s2 = dx * dx + dy * dy;
            if (s2 < d2 && s2 > 0) { const s = Math.sqrt(s2), f = k * (2 * r - s) / s; fx[i] += f * dx; fy[i] += f * dy; fx[j] -= f * dx; fy[j] -= f * dy; } } } } }
  }
  function stepGas(g, n) {
    const c = GAS.dt * GAS.dt * GAS.Q;
    for (let s = 0; s < (n || 1); s++) {
      forces(g);
      for (let i = 0; i < g.N; i++) { const nx = 2 * g.x[i] - g.px[i] + Math.round(g.fx[i] * c), ny = 2 * g.y[i] - g.py[i] + Math.round(g.fy[i] * c); g.px[i] = g.x[i]; g.py[i] = g.y[i]; g.x[i] = nx; g.y[i] = ny; }
      g.steps += g.dir;
    }
  }
  // turn every velocity around: swap "now" and "before"
  function reverseGas(g) { for (let i = 0; i < g.N; i++) { const a = g.x[i], b = g.y[i]; g.x[i] = g.px[i]; g.y[i] = g.py[i]; g.px[i] = a; g.py[i] = b; } g.dir = -g.dir; }
  // velocity of disk i (box heights per second), from its last step
  const velocity = (g, i) => [(g.x[i] - g.px[i]) / (GAS.Q * GAS.dt), (g.y[i] - g.py[i]) / (GAS.Q * GAS.dt)];
  function countLeft(g) { let n = 0; const m = GAS.W / 2 * GAS.Q; for (let i = 0; i < g.N; i++) if (g.x[i] < m) n++; return n; }
  // energy per unit mass: kinetic (from the step's velocity) plus the springiness of overlaps
  // (velocities are those of the last step, so they lag the positions by half a step; the drift this causes is small)
  function energy(g) {
    let e = 0; const Q = GAS.Q, k = GAS.k, r = g.r, m = GAS.W / 2;
    for (let i = 0; i < g.N; i++) { const v = velocity(g, i); e += 0.5 * (v[0] * v[0] + v[1] * v[1]);
      const X = (g.x[i] + g.px[i]) / 2 / Q, Y = (g.y[i] + g.py[i]) / 2 / Q, w = s => s > 0 ? 0.5 * k * s * s : 0;
      e += w(r - X) + w(X - GAS.W + r) + w(r - Y) + w(Y - GAS.H + r);
      if (g.wall) e += X < m ? w(X - m + r) : w(m + r - X);
      for (let j = i + 1; j < g.N; j++) { const dx = X - (g.x[j] + g.px[j]) / 2 / Q, dy = Y - (g.y[j] + g.py[j]) / 2 / Q, d = Math.hypot(dx, dy); if (d < 2 * r) e += w(2 * r - d); } }
    return e;
  }
  // ---- end of core ----

  // ================================================================
  // 2. STATE
  // ================================================================
  const NS = [2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000];
  const S = { ni: { 1: 16, 2: 2, 4: 19 }, nudge: false, NA: 100, NB: 150, q: 120 };
  let tab = 1;

      ctx.strokeStyle = C('--ghost'); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(b.x, Y(best.qA)); ctx.lineTo(b.x + b.w, Y(best.qA)); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = C('--solidA'); ctx.lineWidth = 1.8; ctx.beginPath(); for (let i = Math.max(0, n - span); i < n; i++) i > Math.max(0, n - span) ? ctx.lineTo(X(i), Y(h[i])) : ctx.moveTo(X(i), Y(h[i])); ctx.stroke();
      font(ctx, 10); ctx.fillStyle = C('--muted'); ctx.textAlign = 'right'; ctx.fillText(S.q + '', b.x - 4, Y(S.q) + 3); ctx.fillText('0', b.x - 4, Y(0) + 3); ctx.fillText('time (last 10 s)', b.x + b.w, b.y + b.h + 13);
      font(ctx, 11); ctx.fillStyle = C('--ink'); ctx.textAlign = 'left'; ctx.fillText('packets in A' + (compact ? '' : ' (dashed: most likely)'), b.x + 2, b.y - 7); }
  }

  function draw() {
    const s = fit($('scene')), g = fit($('graph'));
    s.ctx.clearRect(0, 0, s.W, s.H); g.ctx.clearRect(0, 0, g.W, g.H);
    const okS = s.W >= 120 && s.H >= 80, okG = g.W >= 160 && g.H >= 100;
    if (tab === 1 || tab === 4) { if (okS) drawGas(s.ctx, s.W, s.H, s.compact, tab); if (okG) drawHistory(g.ctx, g.W, g.H, g.compact, tab); }
    else if (tab === 2) { if (okS) drawCount(s.ctx, s.W, s.H, s.compact); if (okG) drawWays(g.ctx, g.W, g.H, g.compact); }
    else { if (okS) drawSolids(s.ctx, s.W, s.H, s.compact); if (okG) drawSolidGraphs(g.ctx, g.W, g.H, g.compact); }
  }

  // ================================================================
  // 4. READOUTS AND TEXT
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  const jk = lnO => { const v = KB * lnO; if (v === 0) return '0'; const e = Math.floor(Math.log10(v)); return (v / 10 ** e).toFixed(2) + ' × 10' + sup(e) + ' J/K'; };
  let lastHTML = '';
  function readout() {
    let html = '';
    if (tab === 1 || tab === 4) {
      const G = GS[tab], N = G.g.N, nl = countLeft(G.g), s = lnWays(N, nl);
      html = card('On the left', nl + ' of ' + N, (100 * nl / N).toFixed(0) + '%; ' + big(lnWays(N, nl)) + (lnWays(N, nl) === 0 ? ' arrangement has' : ' arrangements have') + ' this split');
      html += card('Entropy, S/k = ln Ω', s.toFixed(s < 100 ? 2 : 1), 'S = ' + jk(s) + '; when spread evenly, ' + lnWays(N, Math.floor(N / 2)).toFixed(1) + ' (that’s about N ln 2 = ' + (N * Math.LN2).toFixed(1) + ')');
      if (tab === 1) html += card('All on the left again', '1 in ' + big(N * Math.LN2), N <= 12 ? 'the chance at any moment; with so few, you will see it happen' : 'the chance at any moment that all ' + N + ' are back on the left');
      else html += card('Time since release', G.t.toFixed(2), G.back ? (G.nudged >= 0 ? 'back to the moment of release, but the nudge spoiled the return' : 'back at the start: entropy fell, which the laws of motion allow') : G.tRev !== null ? 'counting down: the motion is retracing itself' : G.released ? 'reverse the velocities whenever you like' : 'take out the partition to start');
    } else if (tab === 2) {
      const N = nOf(2), h = Math.floor(N / 2), lw = lnWays(N, h);
      html = card('Arrangements in all', '2' + sup(N) + (N > 6 ? ' = ' + big(N * Math.LN2) : ' = ' + (2 ** N)), 'each of the ' + N + ' molecules on the left or the right');
      html += card('Even split' + (N % 2 ? ' (' + h + '–' + (N - h) + ')' : ''), 'Ω = ' + big(lw), (100 * chance(N, h)).toFixed(chance(N, h) < 0.01 ? 2 : 1) + '% of all; S/k = ln Ω = ' + lw.toFixed(2) + '; all on one side: Ω = 1, S/k = 0');
      const w = chanceWithin(N, 0.05); html += card('Within 5% of even', (100 * w).toFixed(w > 0.999 ? 3 : 1) + '% of the time', 'all on the left: 1 in ' + big(N * Math.LN2) + (CT.shuffles ? '; your ' + CT.shuffles.toLocaleString('en-US') + (CT.shuffles === 1 ? ' shuffle: ' : ' shuffles: ') + (100 * CT.tally.reduce((a, c, n) => a + (Math.abs(n / N - 0.5) <= 0.05 + 1e-12 ? c : 0), 0) / CT.shuffles).toFixed(1) + '%' : ''));
    } else {
      const qa = qA(), qb = S.q - qa, sp = splits(S.NA, S.NB, S.q), best = sp.reduce((a, b) => b.t > a.t ? b : a), tA = tempSolid(S.NA, qa), tB = tempSolid(S.NB, qb);
      html = card('Energy in A', qa + ' of ' + S.q + ' packets', 'most likely: ' + best.qA + ', the share that makes the two temperatures equal');
      html += card('Temperatures (kT/ε)', 'A ' + tA.toFixed(2) + ', B ' + tB.toFixed(2), Math.abs(qa - best.qA) <= 2 * spreadQ(sp) ? 'about equal: no more steady flow, just wandering' : 'energy flows from ' + (tA > tB ? 'A to B' : 'B to A') + ', the hotter to the colder');
      const t = sp[qa].t; html += card('Entropy, S/k = ln Ω_A + ln Ω_B', t.toFixed(1), 'most it can be: ' + smaxStr(best.t) + '; S = ' + jk(t));
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }
  const smaxStr = v => v.toFixed(1);
  // how far the energy in A typically wanders from its most likely value (the spread of its odds)
  function spreadQ(sp) { const m = Math.max(...sp.map(s => s.t)); let w = 0, a = 0, a2 = 0; sp.forEach(s => { const p = Math.exp(s.t - m); w += p; a += p * s.qA; a2 += p * s.qA * s.qA; }); return Math.sqrt(Math.max(0, a2 / w - (a / w) ** 2)); }

  const TEXT = {
    1: { lede: 'A gas is held in the left half of a box. Predict: when the partition comes out, will the gas ever all gather on the left again by itself?',
         notes: '<p><b>What to try.</b> Take out the partition and watch the share on the left fall to half, then wander around it. Start over with only 4 or 5 molecules: now they often all end up on one side, and the entropy graph dips to zero each time. Then try 100 or 1000: the wandering shrinks, and the gas never comes back.</p>' +
                '<p><b>Why.</b> Each way of placing the molecules, left or right, is a microstate, and the molecules’ collisions visit them all without preference. There is only one way to have all of them on the left, but for 100 molecules about 10²⁹ ways to have them split 50–50. So the gas goes to the even split not because anything pushes it there, but because almost every microstate looks like that. The entropy S = k ln Ω counts the ways (Ω) on a log scale; it rises by N k ln 2 as the gas spreads, and the second law, that entropy doesn’t fall, is a statement about overwhelming odds.</p>' +
                '<p><b>The model.</b> Disks in two dimensions, bouncing elastically off each other and the walls, with speeds from the thermal distribution. Only left or right is counted, so the entropy here is the spreading-out part; the speeds’ share does not change, because the energy does not. Real air molecules move far faster: they would cross a 1 m box in a few milliseconds. The disks are drawn to scale and take up a little room, which makes the share wander slightly less than 1/(2√N).</p>' },
    2: { lede: 'Put each molecule on the left or the right of a box at random. Predict: with 4 molecules, how often are they split evenly? With 1000?',
         notes: '<p><b>What to try.</b> Start with 4 molecules and look at all 16 arrangements: 6 of them are 2–2, and only 1 has all four on the left. Shuffle a few times, then 1000 times, and watch the red tally settle onto the blue bars. Then raise the number of molecules: the peak of the bars grows narrower, and with 1000 molecules almost every shuffle lands within 5% of even.</p>' +
                '<p><b>Why.</b> If every arrangement (microstate) is equally likely, the chance of a split (macrostate) is just its share of the arrangements. The count Ω for n on the left is N! / (n! (N − n)!), largest at the even split. The width of the peak, as a share of N, shrinks as 1/√N, so for a mole of gas (10²³ molecules) the share on each side is 50% to about 12 decimal places. Entropy, S = k ln Ω, is largest at the even split: equal to about N k ln 2 there, and zero when all are on one side.</p>' +
                '<p><b>The model.</b> Counting only: each molecule left or right, independently, 50–50. For more than 40 molecules, the bars are grouped. Exact counts are used (with logarithms, so even 2¹⁰⁰⁰ fits).</p>' },
    3: { lede: 'Two solids touch: A starts with all the energy, B with none. Predict: does the energy end up shared equally per atom, all of it in B, or something else?',
         notes: '<p><b>What to try.</b> Press Play and watch the energy, in packets, spread from A into B until the dot on the entropy graph reaches the top of the black curve. Notice that it stays near there, wandering a little. Make B much bigger than A, or give them more energy, and see where the energy settles; the temperatures, not the energies, end up equal.</p>' +
                '<p><b>Why.</b> In a simple model of a solid (Einstein’s), each atom is an oscillator holding a whole number of energy packets. The number of ways to share q packets among N oscillators is (q + N − 1)! / (q! (N − 1)!). For two solids together, the ways multiply, Ω = Ω_A Ω_B, and nearly all of them have the energy split so that each solid’s entropy rises as fast as the other’s falls. That balance point is equal temperature, because temperature is defined by 1/T = dS/dU. Heat flows from hot to cold simply because there are vastly more ways to be at equal temperature.</p>' +
                '<p><b>The model.</b> Einstein solids, with one packet of energy ε per step of each oscillator. At each step, an oscillator chosen at random passes one packet, if it has one, to another chosen at random; over time this visits every arrangement equally often. Temperatures are from the large-number formula kT/ε = 1 / ln(1 + N/q).</p>' },
    4: { lede: 'Let the gas spread out, then reverse every molecule’s velocity. Predict: will it gather back into the left half, the way a film run backward would?',
         notes: '<p><b>What to try.</b> Take out the partition, let the gas spread for a few seconds, then reverse: every molecule retraces its path and they all crowd back into the left half, exactly on time. Start over, turn on the nudge, and do the same: one molecule is moved by a billionth of the box before the reversal, and the gas only partly gathers back before spreading out again. Try waiting longer before reversing: the nudged run fails sooner.</p>' +
                '<p><b>Why.</b> Newton’s laws work the same forward and backward, so the gathering is allowed: entropy can fall. But it takes a perfectly arranged set of velocities, and the slightest error ruins it, because each collision magnifies an error in angle by a factor of roughly the distance between collisions over the size of a molecule. A billionth becomes the whole box within a few dozen collisions. This is why we never see a spread-out gas gather itself up: the arrangements that would do it exist, but they are a vanishingly small share of all of them.</p>' +
                '<p><b>The model.</b> As on the first tab. Positions are stored as whole numbers of a tiny unit and stepped with a rule that is exactly reversible in the computer’s arithmetic, so the backward run is perfect to the last digit without the nudge (Levesque and Verlet, 1993).</p>' }
  };

  // ================================================================
  // 5. CONTROLS
  // ================================================================
  function visibility() {
    const gas = tab === 1 || tab === 4, G = gas ? GS[tab] : null;
    $('lab_n').hidden = tab === 3; $('lab_nudge').hidden = tab !== 4;
    $('lab_na').hidden = tab !== 3; $('lab_nb').hidden = tab !== 3; $('lab_q').hidden = tab !== 3;
    $('go').hidden = tab === 2; $('rev').hidden = tab !== 4; $('shuf').hidden = tab !== 2; $('shuf1k').hidden = tab !== 2;
    $('go').textContent = gas ? (!G.released ? 'Remove the partition' : G.playing ? 'Pause' : 'Play') : (SO.playing ? 'Pause' : 'Play');
    $('go').disabled = tab === 4 && G.back;
    if (tab === 4) $('rev').disabled = !G.released || G.tRev !== null;
    $('hint').textContent = tab === 4 && G.released && G.tRev === null ? (G.t < 1 ? 'let it spread first' : '') : '';
  }
  function vals() {
    if (tab !== 3) { $('n').value = String(S.ni[tab]); $('n_v').textContent = nOf(tab); }
    $('nudge').checked = S.nudge;
    $('na').value = String(S.NA); $('na_v').textContent = S.NA; $('nb').value = String(S.NB); $('nb_v').textContent = S.NB; $('q').value = String(S.q); $('q_v').textContent = S.q;
  }
  function upd() { visibility(); vals(); draw(); readout(); }
  function setTab(k) {
    tab = k; [1, 2, 3, 4].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    $('scene').classList.toggle('count', k === 2);
    $('scene').setAttribute('aria-label', k === 2 ? 'Arrangements of molecules in a box' : k === 3 ? 'Two solids sharing packets of energy' : 'A box of gas molecules');
    upd();
  }
  [1, 2, 3, 4].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  $('n').addEventListener('input', () => { S.ni[tab] = +$('n').value; if (tab === 2) resetCount(); else newGas(tab); upd(); });
  $('nudge').addEventListener('change', () => { S.nudge = $('nudge').checked; upd(); });
  ['na', 'nb', 'q'].forEach(id => $(id).addEventListener('input', () => { S[{ na: 'NA', nb: 'NB', q: 'q' }[id]] = +$(id).value; resetSolids(); upd(); }));
  $('go').addEventListener('click', () => {
    if (tab === 3) { SO.playing = !SO.playing; upd(); return; }
    const G = GS[tab]; if (!G.released) { G.released = true; G.g.wall = false; G.playing = true; G.hist = [[0, countLeft(G.g)]]; G.g.steps = 0; G.t = 0; G.elapsed = 0; G.lastRec = 0; } else G.playing = !G.playing; upd();
  });
  $('rev').addEventListener('click', () => { const G = GS[4]; if (!G.released || G.tRev !== null) return;
    if (S.nudge) { const i = Math.floor(Math.random() * G.g.N); G.g.x[i] += 1; G.g.px[i] += 1; G.nudged = i; }
    reverseGas(G.g); G.tRev = G.t; G.playing = true; G.elapsed = G.t; upd(); });
  $('reset').addEventListener('click', () => { if (tab === 2) resetCount(); else if (tab === 3) resetSolids(); else newGas(tab); upd(); });
  $('shuf').addEventListener('click', () => { shuffle(1); upd(); });
  $('shuf1k').addEventListener('click', () => { shuffle(1000); upd(); });
  window.addEventListener('resize', draw);

  // ================================================================
  // 6. LOOP
  // ================================================================
  let last = null, msPerStep = 0.05, lastRead = 0;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function advanceGas(G, dt) {
    // as much of real time as the computer can manage in about 9 ms
    let want = Math.round(dt * STEPS_PER_S); want = Math.max(1, Math.min(want, Math.floor(9 / msPerStep)));
    const t0 = performance.now(); let done = 0;
    for (; done < want; done++) {
      if (G.tRev !== null && G.g.steps <= 0) { G.back = true; G.playing = false; G.hist.push([G.elapsed + done * GAS.dt, countLeft(G.g)]); break; }
      stepGas(G.g, 1);
    }
    if (done) msPerStep = 0.8 * msPerStep + 0.2 * (performance.now() - t0) / done;
    // time since release: forward until reversed, then counting down (the graph keeps running on)
    G.t = G.g.steps * GAS.dt; G.elapsed = (G.elapsed || 0) + done * GAS.dt;
    const te = G.tRev === null ? G.t : G.elapsed;
    if (G.released && te - G.lastRec > 0.05) { G.hist.push([te, countLeft(G.g)]); G.lastRec = te; if (G.hist.length > 4000) G.hist.shift(); }
  }
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts;
    if (dt > 0 && !document.hidden) {
      let moved = false;
      if (tab === 1 || tab === 4) { const G = GS[tab]; if (G.released && G.playing && !reduced) { advanceGas(G, dt); moved = true; if (G.back) upd(); }
        else if (!G.released && !reduced) { advanceGas(G, dt); moved = true; } }
      else if (tab === 3 && SO.playing && !reduced) { const n = 4 * (S.NA + S.NB); for (let i = 0; i < n; i++) hop(SO.st, Math.random); SO.hops += n; SO.hist.push(qA()); if (SO.hist.length > 4000) SO.hist.shift(); moved = true; }
      if (moved) { draw(); if (ts - lastRead > 150) { readout(); lastRead = ts; } }
    }
    requestAnimationFrame(frame);
  }
  newGas(1); newGas(4); resetCount(); resetSolids();
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
</html>
