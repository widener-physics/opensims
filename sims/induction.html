<main class="app">

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. MODEL
  //    The block between the markers was tested on its own against a brute-force Biot-Savart sum, the
  //    point-dipole limit, energy conservation and step-by-step integrations. It is copied in unchanged.
  // ================================================================
  // ---- physics core: electromagnetic induction ----
  // SI units throughout. The magnet is a uniformly magnetized cylinder (radius b, length L, remanence Br), which
  // is exactly a solenoid carrying a surface current Br/mu0 per meter of its length. The flux it sends through a
  // circular turn of wire on its axis follows from the mutual inductance of two coaxial loops (elliptic integrals),
  // summed over the magnet's length. A coil is N such turns spread evenly over a short length. Induced emf is
  // -N dPhi/dt; with the coil closed through a resistor the current is emf / (coil + resistor), and the coil pushes
  // back on the magnet with the force whose power is exactly the heat in the circuit. The coil's self-inductance
  // (L/R about 0.2 ms here, against passes lasting 10 ms or more) is left out.
  // The sliding rod: a rod of mass m on frictionless rails a distance l apart, in a uniform field B, closed
  // through a resistor R: emf = B l v, current B l v / R, and a braking force B^2 l^2 v / R.
  const MU0 = 4e-7 * Math.PI, G = 9.8;
  // complete elliptic integrals K(m), E(m) with parameter m = k^2, by the arithmetic-geometric mean
  function ellipKE(m) {
    let a = 1, b = Math.sqrt(1 - m), c, sum = m / 2, p = 0.5;
    for (let i = 0; i < 60; i++) {
      c = (a - b) / 2; const an = (a + b) / 2; b = Math.sqrt(a * b); a = an; p *= 2; sum += p * c * c;
      if (Math.abs(c) < 1e-17) break;
    }
    const K = Math.PI / (2 * a);
    return [K, K * (1 - sum)];
  }
  // mutual inductance of two coaxial circular loops, radii r1 and r2, a distance s apart
  function mutual(r1, r2, s) {
    const m = 4 * r1 * r2 / ((r1 + r2) * (r1 + r2) + s * s), k = Math.sqrt(m);
    let f;
    if (m < 1e-3) f = Math.PI * k * m / 16 * (1 + 0.75 * m + 75 / 128 * m * m);   // series: avoids cancellation when far apart
    else { const [K, E] = ellipKE(m); f = (2 / k - k) * K - (2 / k) * E; }
    return MU0 * Math.sqrt(r1 * r2) * f;
  }
  // the magnet and the coils
  const MAGNET = { b: 0.006, L: 0.025, Br: 1.2 };            // a neodymium cylinder 12 mm across and 25 mm long
  MAGNET.mass = 7500 * Math.PI * MAGNET.b * MAGNET.b * MAGNET.L;   // 21 g
  MAGNET.moment = MAGNET.Br * Math.PI * MAGNET.b * MAGNET.b * MAGNET.L / MU0;
  const COIL = { a: 0.02, len: 0.012, ohmPerTurn: 2 * Math.PI * 0.02 * 0.213 };   // 2 cm radius, 28-gauge copper wire
  const coilResistance = N => N * COIL.ohmPerTurn;

  // Flux through one turn of radius a whose plane is a distance s from the magnet's center:
  //   Phi1(s) = (Br/mu0) * integral over the magnet's length of mutual(a, b, s')
  // Tabulated once as a running integral Q of the mutual inductance, so Phi1(s) = (Br/mu0)(Q(s + L/2) - Q(s - L/2)),
  // and its slope is exactly (Br/mu0)(M(s + L/2) - M(s - L/2)) with no table at all.
  function fluxTable(mag, a, S, n) {
    S = S || 0.6; n = n || 12000;
    const ds = 2 * S / n, Q = new Float64Array(n + 1); let prev = mutual(a, mag.b, -S);
    for (let i = 1; i <= n; i++) { const cur = mutual(a, mag.b, -S + i * ds); Q[i] = Q[i - 1] + (prev + cur) / 2 * ds; prev = cur; }
    return { S, ds, Q, mag, a };
  }
  function Qat(T, s) {
    if (s <= -T.S) return 0; if (s >= T.S) return T.Q[T.Q.length - 1];
    const f = (s + T.S) / T.ds, i = Math.min(Math.floor(f), T.Q.length - 2), t = f - i;
    // cubic Hermite with the exact derivative (the mutual inductance itself) at both ends
    const h = T.ds, y0 = T.Q[i], y1 = T.Q[i + 1], d0 = mutual(T.a, T.mag.b, -T.S + i * h), d1 = mutual(T.a, T.mag.b, -T.S + (i + 1) * h);
    const t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * d0 + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * d1;
  }
  const phi1 = (T, s) => T.mag.Br / MU0 * (Qat(T, s + T.mag.L / 2) - Qat(T, s - T.mag.L / 2));
  const dphi1 = (T, s) => T.mag.Br / MU0 * (mutual(T.a, T.mag.b, s + T.mag.L / 2) - mutual(T.a, T.mag.b, s - T.mag.L / 2));
  // a coil: N turns spread evenly over its length, centered at 0; the magnet's center at x on the axis.
  // Flux per turn (averaged over the turns) and its slope, by 6-point Gauss-Legendre across the winding.
  const GLX = [-0.9324695142, -0.6612093865, -0.2386191861, 0.2386191861, 0.6612093865, 0.9324695142];
  const GLW = [0.1713244924, 0.3607615730, 0.4679139346, 0.4679139346, 0.3607615730, 0.1713244924];
  function coilFlux(T, x) { let s = 0; for (let j = 0; j < 6; j++) s += GLW[j] / 2 * phi1(T, x - COIL.len / 2 * GLX[j]); return s; }
  function coilSlope(T, x) { let s = 0; for (let j = 0; j < 6; j++) s += GLW[j] / 2 * dphi1(T, x - COIL.len / 2 * GLX[j]); return s; }
  // the circuit: emf, current and the force back on the magnet. sign = +1 with the magnet's north end toward +x.
  // R = Infinity for an open circuit.
  function coilState(T, N, R, x, v, sign) {
    const k = N * coilSlope(T, x), emf = -sign * k * v, Rt = coilResistance(N) + R, I = isFinite(Rt) ? emf / Rt : 0;
    return { flux: sign * coilFlux(T, x), emf, I, force: sign * k * I, power: emf * I };   // force on the magnet, along +x
  }
  // the flux function psi(r, z): the flux through a circle of radius r centered on the axis a distance z from the
  // magnet's center. The field lines are its contour lines, with equal flux between neighbors.
  function psiGrid(mag, rMax, zMax, nr, nz) {
    const g = { rMax, zMax, nr, nz, v: [] };
    for (let i = 0; i <= nr; i++) {
      const r = Math.max(1e-6, rMax * i / nr) * (Math.abs(rMax * i / nr - mag.b) < 1e-7 ? 1.0001 : 1);
      const T = fluxTable(mag, r, zMax + mag.L, 4 * nz), row = [];
      for (let j = 0; j <= nz; j++) row.push(i === 0 ? 0 : phi1(T, -zMax + 2 * zMax * j / nz));
      g.v.push(row);
    }
    return g;
  }

  // Lenz's law: a single loop of copper wire, 8 cm across, its ends joined through a current meter (0.1 ohm in all,
  // so the loop's self-inductance delays the current by only about a microsecond). Heights y are measured along the
  // vertical axis, up positive; the magnet's north end points up when sign = +1. Flux is counted positive upward,
  // and current positive when it circulates counterclockwise as seen from above (by the right-hand rule, that current
  // makes a field pointing up through the loop, so the loop's north side is on top).
  const LOOP = { a: 0.04, R: 0.1 };
  // the loop at height yl moving at vl, the magnet at ym moving at vm: only the relative motion matters
  function loopState(T, ym, yl, vm, vl, sign) {
    const s = ym - yl, v = vm - vl, d = dphi1(T, s), flux = sign * phi1(T, s), rate = sign * d * v;

         notes: '<p><b>What to try.</b> Drag the magnet into the coil and stop: the flux through the coil stays high, but the emf drops to zero. Pull it back out and the emf reverses. Then push it through at a steady speed and record the peak emf; do it again at other speeds, and with other numbers of turns. Turn the magnet around. Watch the graphs as it passes the middle of the coil.</p>' +

  setTab(1);
  requestAnimationFrame(frame);

</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
