<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/doppler-effect.test.js)
  // ================================================================
  // ---- physics core: the Doppler effect ----
  // SI units. Sound travels at v through still air, the same in every direction. A source gives out waves at
  // frequency f0 (in its own time); a listener hears whatever crests reach it.
  const SOUND = { v: 343 };        // m/s, air at 20 degrees C
  const LIGHT = { c: 2.99792458e8 };

  // ---- the classic formula ----
  // source velocity us, listener velocity ul (vectors), n: unit vector from the source (when it sent the sound) to the
  // listener (when it hears it). Speeds toward each other raise the pitch.
  function heardRatio(us, ul, n, v) {
    v = v || SOUND.v;
    return (v - (ul[0] * n[0] + ul[1] * n[1])) / (v - (us[0] * n[0] + us[1] * n[1]));
  }

  // ---- a recorded motion: the source's positions and velocities at equal time steps ----
  function makeTrack(dt, n) { return { dt, n, t: new Float64Array(n), x: new Float64Array(n), y: new Float64Array(n), vx: new Float64Array(n), vy: new Float64Array(n), len: 0, start: 0 }; }
  // add a sample (a ring buffer: the oldest is overwritten once full)
  function record(T, t, x, y, vx, vy) {
    const k = (T.start + T.len) % T.n;
    T.t[k] = t; T.x[k] = x; T.y[k] = y; T.vx[k] = vx; T.vy[k] = vy;
    if (T.len < T.n) T.len++; else T.start = (T.start + 1) % T.n;
  }
  const at = (T, i) => (T.start + i) % T.n;      // i-th oldest sample
  // the source's position and velocity at time s, between samples (cubic Hermite, using the recorded velocities)
  function sourceAt(T, s) {
    if (T.len === 0) return null;
    const t0 = T.t[at(T, 0)], i = Math.max(0, Math.min(T.len - 2, Math.floor((s - t0) / T.dt)));
    const a = at(T, i), b = at(T, i + 1), h = T.t[b] - T.t[a], u = h > 0 ? (s - T.t[a]) / h : 0;
    const h00 = 2 * u * u * u - 3 * u * u + 1, h10 = u * u * u - 2 * u * u + u, h01 = -2 * u * u * u + 3 * u * u, h11 = u * u * u - u * u;
    const d00 = (6 * u * u - 6 * u) / h, d10 = 3 * u * u - 4 * u + 1, d01 = (-6 * u * u + 6 * u) / h, d11 = 3 * u * u - 2 * u;
    return { x: h00 * T.x[a] + h10 * h * T.vx[a] + h01 * T.x[b] + h11 * h * T.vx[b], y: h00 * T.y[a] + h10 * h * T.vy[a] + h01 * T.y[b] + h11 * h * T.vy[b],
             vx: d00 * T.x[a] + d10 * T.vx[a] + d01 * T.x[b] + d11 * T.vx[b], vy: d00 * T.y[a] + d10 * T.vy[a] + d01 * T.y[b] + d11 * T.vy[b] };
  }
  // what reaches a listener at L = { x, y, vx, vy } at time t: every moment te when the source sent sound that arrives
  // now, v (t - te) = distance from the source then to the listener now. Subsonic sources give one; a source faster
  // than sound gives none before its shock cone arrives and two after. For each: the heard/sent frequency ratio, the
  // distance the sound traveled, and the source's position then.
  function arrivals(T, t, L, v) {
    v = v || SOUND.v; const out = [];
    if (T.len < 2) return out;
    const g = s => { const p = sourceAt(T, s); return v * (t - s) - Math.hypot(L.x - p.x, L.y - p.y); };
    const tNew = Math.min(t, T.t[at(T, T.len - 1)]);
    let hi = tNew, ghi = g(hi);
    for (let i = T.len - 2; i >= 0; i--) {     // step back through the recording, looking for sign changes
      const lo = T.t[at(T, i)], glo = g(lo);
      if ((glo >= 0) !== (ghi >= 0)) {
        let a = lo, b = hi, ga = glo; for (let k = 0; k < 60; k++) { const m = (a + b) / 2, gm = g(m); if ((gm >= 0) === (ga >= 0)) { a = m; ga = gm; } else b = m; }
        const te = (a + b) / 2, p = sourceAt(T, te), dx = L.x - p.x, dy = L.y - p.y, d = Math.hypot(dx, dy) || 1e-9, n = [dx / d, dy / d];
        out.push({ te, ratio: heardRatio([p.vx, p.vy], [L.vx || 0, L.vy || 0], n, v), dist: d, x: p.x, y: p.y });
      }
      hi = lo; ghi = glo;
    }
    return out;
  }
  // how loud each arrival is: falls off as 1/distance; and the waves are squeezed or stretched by the motion, so the
  // pressure amplitude scales with the frequency ratio as well (for a small source, amplitude ~ ratio / distance)
  const loudness = (arr, ref) => Math.min(4, (ref || 20) / Math.max(arr.dist, 1) * Math.abs(arr.ratio));

  // ---- straight-line motion, worked out exactly (for checking, and for the faster-than-sound picture) ----
  // source at (x0 + u s, y0) at time s; listener still at (X, Y): times te with v (t - te) = distance
  function straightArrivals(x0, y0, u, X, Y, t, v) {
    v = v || SOUND.v;
    // (v (t - s))^2 = (X - x0 - u s)^2 + (Y - y0)^2, a quadratic in s
    const A = v * v - u * u, B = -2 * v * v * t + 2 * u * (X - x0), Cc = v * v * t * t - (X - x0) ** 2 - (Y - y0) ** 2;
    const out = [];
    if (Math.abs(A) < 1e-12) { const s = -Cc / B; if (s <= t) out.push(s); return out; }
    const D = B * B - 4 * A * Cc; if (D < 0) return out;
    [(-B - Math.sqrt(D)) / (2 * A), (-B + Math.sqrt(D)) / (2 * A)].forEach(s => { if (s <= t + 1e-12 && v * (t - s) >= -1e-9) out.push(s); });
    return out.sort((p, q) => q - p);
  }
  // faster than sound: the shock cone's half-angle, sin(angle) = v / u
  const machAngle = (u, v) => Math.asin((v || SOUND.v) / u);
  // when the boom reaches a listener a distance d from the path, as the source passes x = X at time X/u (starting at x = 0, t = 0)
  const boomTime = (X, d, u, v) => { v = v || SOUND.v; return X / u + d * Math.sqrt(u * u - v * v) / (u * v); };

  // ---- light ----
  // relativistic Doppler: a source moving at beta = v/c, its velocity at angle th to the line toward us (measured in
  // our frame): received/sent frequency = 1 / (gamma (1 - beta cos th)); straight toward us or away it is
  // sqrt((1 + beta)/(1 - beta)) or its inverse
  function lightRatio(beta, th) { const g = 1 / Math.sqrt(1 - beta * beta); return 1 / (g * (1 - beta * Math.cos(th))); }
  // redshift z = (seen wavelength - sent) / sent, for a source moving straight away at beta, and back
  const zFromBeta = beta => Math.sqrt((1 + beta) / (1 - beta)) - 1;
  const betaFromZ = z => ((1 + z) ** 2 - 1) / ((1 + z) ** 2 + 1);
  // hydrogen's visible (Balmer) lines, nm in air: H-alpha .. H-delta
  const BALMER = [656.28, 486.13, 434.05, 410.17];
  // a star tugged by a planet in a circular orbit (period P, planet mass m, star mass M, orbit seen edge-on):
  // the star's speed toward and away from us swings by K = (2 pi G / P)^(1/3) m / (M + m)^(2/3)
  const G = 6.6743e-11;
  const wobbleK = (P, m, M) => Math.pow(2 * Math.PI * G / P, 1 / 3) * m / Math.pow(M + m, 2 / 3);

  // ---- naming a pitch ----
  // the nearest note on the piano (A4 = 440 Hz) and how far off it is, in cents (hundredths of a semitone)
  function noteName(f) {
    const n = 12 * Math.log2(f / 440) + 57, k = Math.round(n), names = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
    return { name: names[((k % 12) + 12) % 12] + Math.floor(k / 12), cents: Math.round(100 * (n - k)) };
  }
  // ---- end of core ----

  // ================================================================
  // 2. THE SOUND SOURCES (real speeds and pitches, which the sliders then change)
  // ================================================================

    ctx.strokeStyle = C('--rule'); ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
    font(ctx, 10); ctx.fillStyle = C('--muted'); ctx.textAlign = 'right';
    (tab === 2 ? [0.25, 0.5, 1, 2, 4] : [0.5, 0.75, 1, 1.5, 2]).forEach(r => { const y = Y(r); ctx.strokeStyle = r === 1 ? C('--ghost') : C('--soft'); ctx.beginPath(); ctx.moveTo(b.x, y); ctx.lineTo(b.x + b.w, y); ctx.stroke(); ctx.fillText(Math.round(P.f * r) + '', b.x - 4, y + 3); });
    ctx.textAlign = 'left'; ctx.fillStyle = C('--ink'); font(ctx, 11); ctx.fillText('pitch you hear (Hz), last ' + span + ' s', b.x + 4, b.y - 5);
    [0, 1].forEach(k => { ctx.strokeStyle = k ? C('--hot') : C('--curve'); ctx.lineWidth = 2; ctx.beginPath(); let pen = false;
      pitchLog.forEach(q => { const r = q[1 + k]; if (q[0] < simT - span || r === null || r === undefined) { pen = false; return; } const y = Math.max(b.y, Math.min(b.y + b.h, Y(Math.abs(r)))); if (pen) ctx.lineTo(X(q[0]), y); else ctx.moveTo(X(q[0]), y); pen = true; }); ctx.stroke(); });
    // the wave arriving now, against the wave sent
    const w2 = stack ? { x: 44, y: H * 0.5 + 18, w: W - 52, h: H * 0.5 - 40 } : { x: W * 0.6 + 10, y: 18, w: W * 0.4 - 22, h: H - 44 };
    ctx.strokeStyle = C('--rule'); ctx.strokeRect(w2.x, w2.y, w2.w, w2.h);
    ctx.fillStyle = C('--ink'); ctx.textAlign = 'left'; ctx.fillText('sound arriving now', w2.x + 4, w2.y - 5);
    const win = 6 / P.f, A0 = 0.42 * w2.h;
    ctx.strokeStyle = C('--ghost'); ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i = 0; i <= 200; i++) { const tt = i / 200 * win, x = w2.x + i / 200 * w2.w, y = w2.y + w2.h / 2 - 0.35 * A0 * Math.sin(TAU * P.f * tt); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = C('--curve'); ctx.lineWidth = 2; ctx.beginPath();
    const amp = a => Math.min(1, 0.35 * loudness(a, tab === 2 ? 400 : 25));
    for (let i = 0; i <= 300; i++) { const tt = i / 300 * win; let y = 0; arr.forEach(a => { y += amp(a) * Math.sin(TAU * P.f * Math.max(-6, Math.min(6, a.ratio)) * tt + a.te * 37); }); const x = w2.x + i / 300 * w2.w; const yy = w2.y + w2.h / 2 - A0 * Math.max(-1.2, Math.min(1.2, y)); i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); } ctx.stroke();
    font(ctx, 10); ctx.fillStyle = C('--muted'); ctx.textAlign = 'right'; ctx.fillText((win * 1000).toFixed(1) + ' ms; dashed: as sent', w2.x + w2.w - 4, w2.y + w2.h + 14);
  }

  function cur() { const list = PRESETS[tab] || PRESETS[1], p = list.find(q => q.id === S.preset[tab]) || list[0]; return Object.assign({}, p, { u: S.u[tab], f: S.f[tab] }); }
  let lastArr = [];
  function drawScene() {
    const { ctx, W, H, compact } = fit($('scene')); ctx.clearRect(0, 0, W, H);
    if (W < 80 || H < 60) { lastArr = tab === 4 ? [] : heardNow(); return; }
    if (tab === 4) drawLight(ctx, W, H, compact); else lastArr = drawSound(ctx, W, H, compact);
  }
  function draw() { drawScene(); drawGraph(lastArr); }

  // ================================================================
  // 6. READOUTS AND TEXT
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  const kmh = u => (u * 3.6).toFixed(0) + ' km/h, ' + (u * 2.237).toFixed(0) + ' mph';
  let lastHTML = '';
  function readout() {
    let html = '';
    if (tab !== 4) {
      const P = cur(), arr = lastArr, main = arr.length ? arr.reduce((a, b) => loudness(a) > loudness(b) ? a : b) : null;
      const hz = main ? Math.abs(main.ratio) * P.f : 0, nm = main ? noteName(hz) : null, sent = noteName(P.f);
      if (tab === 1) {
        html = card('You hear', main ? hz.toFixed(0) + ' Hz' : 'nothing yet', main ? 'about ' + nm.name + (nm.cents ? (nm.cents > 0 ? ' +' : ' ') + nm.cents + ' cents' : '') + '; it sends ' + P.f + ' Hz (' + sent.name + ')' : 'the sound hasn’t reached you');
        html += card(main && main.ratio > 1.0005 ? 'Higher, because' : main && main.ratio < 0.9995 ? 'Lower, because' : 'Shift', main ? (main.ratio >= 1 ? '+' : '') + ((main.ratio - 1) * 100).toFixed(1) + '%' : '—', main ? 'the sound you hear left it ' + (main.dist / SOUND.v * 1000).toFixed(0) + ' ms ago, while it was ' + (main.ratio > 1 ? 'coming toward you' : 'going away') : 'move closer, or wait');
        html += card('Its speed', Math.hypot(src.vx, src.vy).toFixed(0) + ' m/s', kmh(Math.hypot(src.vx, src.vy)) + '; sound: ' + SOUND.v + ' m/s');
      } else if (tab === 2) {
        const sp = Math.hypot(src.vx, src.vy), M = sp / SOUND.v;
        html = card('Mach', M.toFixed(2), sp.toFixed(0) + ' m/s; ' + (M > 1 ? 'cone half-angle ' + (machAngle(sp) * 180 / Math.PI).toFixed(0) + '°, from sin = 1/Mach' : 'slower than sound: no cone'));
        html += card('You hear', arr.length === 0 ? 'nothing yet' : arr.length === 2 ? 'two sounds at once' : hz.toFixed(0) + ' Hz', arr.length === 2 ? 'after the boom: the jet going away, and (backward, rising in pitch) the sound it made coming in' : arr.length === 0 && M > 1 ? 'the jet is silent until its cone reaches you' : 'it sends ' + P.f + ' Hz');
        const h = Math.abs(src.y - lis.y), late = M > 1 ? h * Math.sqrt(sp * sp - SOUND.v * SOUND.v) / (sp * SOUND.v) : null;
        html += card('Boom after it passes overhead', late !== null ? late.toFixed(1) + ' s' : '—', late !== null ? 'flying ' + h.toFixed(0) + ' m above you; a faster jet is heard sooner after' : 'no boom below Mach 1');
      } else {
        const u = S.u[3], f0 = P.f, fs = f0 * SOUND.v / (SOUND.v - u), fl = f0 * (SOUND.v + u) / SOUND.v;
        html = card('You hear', main ? hz.toFixed(0) + ' Hz' : 'nothing yet', main ? 'about ' + nm.name + '; the siren sends ' + f0 + ' Hz' : '');
        html += card('Siren coming at ' + u + ' m/s', fs.toFixed(0) + ' Hz', 'f₀ v / (v − u): the crests are squeezed together in the air');
        html += card('You going toward it at ' + u + ' m/s', fl.toFixed(0) + ' Hz', 'f₀ (v + u) / v: you run into the crests faster; ' + (u > 0 ? 'less than the other way by ' + (fs - fl).toFixed(0) + ' Hz' : ''));
      }
    } else {
      const b = lightSpeed(), r = shiftRatio(), ha = 656.28 / r, z = 1 / r - 1;
      html = card('H-α line seen at', ha.toFixed(ha > 1000 ? 0 : 2) + ' nm', 'sent at 656.28 nm; ' + (z >= 0 ? 'redshift' : 'blueshift') + ' z = ' + (Math.abs(z) < 0.01 ? z.toExponential(2) : z.toFixed(3)));
      html += card(S.obj === 'star' ? 'Star’s speed' : 'Galaxy’s speed', S.obj === 'star' ? Math.abs(S.beta.star) + ' km/s ' + (b >= 0 ? 'away' : 'toward us') : (Math.abs(b)).toFixed(2) + ' c', S.obj === 'star' ? 'stars nearby move at tens of km/s; Barnard’s Star comes toward us at 110 km/s' : 'about ' + Math.round(Math.abs(b) * LIGHT.c / 1e3).toLocaleString('en-US') + ' km/s; the Virgo cluster recedes at 0.004 c, quasar 3C 273 at 0.15 c');
      html += card('Sideways motion', S.dir === 0 ? '—' : 'still shifts', S.dir === 0 ? 'straight along the line of sight' : 'light, unlike sound, is reddened even by motion across the line of sight: moving clocks run slow');
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }

  const TEXT = {
    1: { lede: 'An ambulance drives past with its siren on. Predict: does the pitch you hear change gradually, or suddenly as it goes by? And when the ambulance is right beside you, are you hearing it higher, lower, or at its true pitch?',
         notes: '<p><b>What to try.</b> Watch the circles: each is a crest of the sound, centered where the siren was when it sent it. Ahead they crowd together (short wavelength, high pitch); behind they spread out. Turn on the sound and listen as it passes, then stand farther from the road: the drop is just as large but more gradual. Drag the vehicle around, or drag yourself, and try the train and the race car.</p>' +
                '<p><b>Why.</b> The siren sends the same number of crests per second whatever it does, but while it moves it chases its own crests ahead and leaves those behind farther apart. The air carries every crest at 343 m/s, so ahead you meet them more often (f₀ v / (v − u) straight ahead) and behind less often. Beside the road, what matters is how fast the source was approaching when it sent the sound you are hearing now; that sound left it a moment ago, so the change is gradual, and when the vehicle is right beside you you still hear it a little high.</p>' +
                '<p><b>The model.</b> Sound at 343 m/s in still air at 20 °C. Every moment, the sim finds when the sound now reaching you was sent, from the recorded motion, and uses the source’s velocity then. Loudness falls as 1/distance. Pitches: a European ambulance siren’s high tone (960 Hz), a train horn (311 Hz), an engine note (280 Hz), all as steady tones. Real time, real speeds; the circles are every Nth crest.</p>' },
    2: { lede: 'A fighter jet flies over at 1.4 times the speed of sound. Predict: when do you first hear it: before it reaches you, when it’s overhead, or after it has passed?',
         notes: '<p><b>What to try.</b> Start with the airliner, slower than sound: you hear it coming, high-pitched. Then the fighter jet: the circles pile up into a cone that trails behind it, and you hear nothing until the cone reaches you, then a boom. Try Concorde at Mach 2: a narrower cone. Drag yourself closer to or farther from the path, or speed the jet up or down with the slider.</p>' +
                '<p><b>Why.</b> Faster than sound, the jet outruns everything it sends. All the sound it made while approaching arrives together, along the edge of the cone, as a sudden pressure jump: the sonic boom. The cone’s half-angle obeys sin(angle) = v_sound / v_jet. After the boom you hear two things at once: the jet going away, and the sound it made while coming in, arriving backward.</p>' +
                '<p><b>The model.</b> As in the first tab, in a side view, with the jet at 600 m. The boom is played as a short, low burst; a real one is an N-shaped pressure wave lasting a tenth of a second or so. The air is uniform: in real air, temperature changes bend the boom, and it can miss the ground altogether.</p>' },
    3: { lede: 'A siren and a listener move toward each other. Predict: is it the same whether the siren moves toward you at 30 m/s, or you move toward it at 30 m/s?',
         notes: '<p><b>What to try.</b> Choose who moves. With the listener moving, the circles stay evenly spaced around the siren, but you run into them faster. Raise the speed to 100 m/s or more and compare the two cards: the siren moving gives the bigger shift. Then let both move.</p>' +
                '<p><b>Why.</b> Sound travels through the air, so it matters who moves through the air. A moving siren changes the spacing of the crests in the air (the wavelength); a moving listener leaves the spacing alone and just meets crests faster. The two formulas, v / (v − u) and (v + u) / v, agree for slow speeds and part company as u approaches v. A listener running away from a siren at the speed of sound would hear nothing; a siren moving at the speed of sound toward you would pile all its crests into one.</p>' +
                '<p><b>The model.</b> As in the first tab, with a 700 Hz siren. The speed applies to whichever moves (both, when both do).</p>' },
    4: { lede: 'Light from moving stars and galaxies shifts too. Predict: what happens to the dark lines in a galaxy’s spectrum if the galaxy is moving away from us?',
         notes: '<p><b>What to try.</b> Move the star toward us and away and watch hydrogen’s dark lines slide in the zoomed strip: a few hundredths of a nanometer per 10 km/s. Pick a galaxy and increase its speed: the whole pattern of lines slides toward the red, then out of the visible into the infrared. Set the direction of motion to 90°: even moving straight across the line of sight, a fast source is reddened.</p>' +
                '<p><b>Why.</b> The same crowding and spreading of crests happens with light, but light needs no air: only the relative motion matters, and at high speed the moving source’s clock also runs slow. The received frequency is f₀ / (γ (1 − β cos θ)); straight away this is √((1 − β)/(1 + β)). Astronomers measure stars’ speeds this way to a few meters per second, which is how most of the first exoplanets were found (their stars wobble), and the redshifts of galaxies revealed that the universe is expanding.</p>' +
                '<p><b>The model.</b> Special-relativistic Doppler shift of hydrogen’s visible (Balmer) lines. For distant galaxies the redshift really comes from the expansion of space while the light travels, not from motion through space; for nearby galaxies the two pictures agree, and the slider’s speed is the equivalent speed.</p>' }
  };

  // ================================================================
  // 7. CONTROLS
  // ================================================================
  function buildPresets() {
    const list = PRESETS[tab] || []; $('preset').innerHTML = list.map(p => '<button data-v="' + p.id + '">' + p.name + '</button>').join('');
    document.querySelectorAll('#preset button').forEach(b => b.addEventListener('click', () => { const p = list.find(q => q.id === b.dataset.v); S.preset[tab] = p.id; S.u[tab] = p.u; S.f[tab] = p.f; resetScene(); sync(); upd(); }));
  }
  function visibility() {
    const snd = tab !== 4;
    $('lab_preset').hidden = !(tab === 1 || tab === 2); $('lab_who').hidden = tab !== 3; $('lab_u').hidden = !snd; $('lab_f').hidden = !snd;
    $('lab_obj').hidden = snd; $('lab_beta').hidden = snd; $('lab_dir').hidden = snd;
    $('snd').hidden = !snd; $('reset').hidden = !snd;
    $('go').textContent = playing ? 'Pause' : 'Play';
    $('snd').textContent = AU.on ? 'Sound: on' : 'Sound: off'; $('snd').setAttribute('aria-pressed', String(AU.on));
    document.querySelectorAll('#preset button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.preset[tab])));
    document.querySelectorAll('#who button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.who)));
    document.querySelectorAll('#obj button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.obj)));
    $('hint').textContent = tab === 1 || tab === 2 ? 'drag the ' + (tab === 2 ? 'jet' : 'vehicle') + ' or yourself' : tab === 3 ? 'drag the siren or the listener' : '';
    $('scene').classList.toggle('grab', snd);
  }
  function vals() {
    if (tab !== 4) { const u = S.u[tab]; $('u').max = tab === 2 ? '900' : '150'; $('u').min = tab === 2 ? '100' : '0'; $('u').step = tab === 2 ? '10' : '1'; $('u').value = String(u);
      $('u_v').textContent = u + ' m/s' + (tab === 2 ? ' (Mach ' + (u / SOUND.v).toFixed(2) + ')' : ' (' + (u * 3.6).toFixed(0) + ' km/h)');
      $('f').min = tab === 2 ? '50' : '100'; $('f').max = tab === 2 ? '400' : '1500'; $('f').value = String(S.f[tab]); $('f_v').textContent = S.f[tab] + ' Hz'; }
    else { const star = S.obj === 'star'; $('beta').min = star ? '-300' : '-0.3'; $('beta').max = star ? '300' : '0.95'; $('beta').step = star ? '5' : '0.01'; $('beta').value = String(S.beta[S.obj]);
      $('beta_name').textContent = star ? 'Speed away from us (negative: toward)' : 'Speed away from us';
      $('beta_v').textContent = star ? S.beta.star + ' km/s' : S.beta.gal.toFixed(2) + ' c'; $('dir').value = String(S.dir); $('dir_v').textContent = S.dir === 0 ? 'along the line of sight' : S.dir === 90 ? 'straight across it' : S.dir + '° from the line of sight'; }
  }
  function sync() { vals(); }
  function upd() { visibility(); vals(); draw(); readout(); }
  function setTab(k) {
    tab = k; playing = true; audioQuiet();
    [1, 2, 3, 4].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    lis = null; if (k !== 4) resetScene(); buildPresets(); sync(); upd();
  }
  [1, 2, 3, 4].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  document.querySelectorAll('#who button').forEach(b => b.addEventListener('click', () => { S.who = b.dataset.v; resetScene(); upd(); }));
  document.querySelectorAll('#obj button').forEach(b => b.addEventListener('click', () => { S.obj = b.dataset.v; S.dir = 0; upd(); }));
  $('u').addEventListener('input', () => { S.u[tab] = +$('u').value; const sp = S.u[tab];
    if (tab === 3) resetScene(); else if (src.mode === 'drive') { const d = Math.sign(src.vx) || 1; src.vx = d * sp; src.vy = 0; } upd(); });
  $('f').addEventListener('input', () => { S.f[tab] = +$('f').value; upd(); });
  $('beta').addEventListener('input', () => { S.beta[S.obj] = +$('beta').value; upd(); });
  $('dir').addEventListener('input', () => { S.dir = +$('dir').value; upd(); });
  $('go').addEventListener('click', () => { playing = !playing; if (!playing) audioQuiet(); upd(); });
  $('reset').addEventListener('click', () => { resetScene(); playing = true; upd(); });
  $('snd').addEventListener('click', () => { if (!AU.on) { AU.on = audioStart(); } else { AU.on = false; audioQuiet(); } upd(); });
  window.addEventListener('resize', draw);
  // dragging the source or the listener
  const sc = $('scene'); let grab = null;
  function toWorld(e) { const r = sc.getBoundingClientRect(), g = geom(r.width, r.height); return [(e.clientX - r.left) / g.s + VIEW[tab].x0, tab === 2 ? (r.height - 30 - (e.clientY - r.top)) / g.s : (r.height * 0.58 - (e.clientY - r.top)) / g.s]; }
  sc.addEventListener('pointerdown', e => {
    if (tab === 4) return; const w = toWorld(e), r = sc.getBoundingClientRect(), g = geom(r.width, r.height);
    const dS = Math.hypot(g.X(src.x) - (e.clientX - r.left), g.Y(src.y) - (e.clientY - r.top)), dL = Math.hypot(g.X(lis.x) - (e.clientX - r.left), g.Y(lis.y) - 8 - (e.clientY - r.top));
    grab = dS < dL ? src : lis; if (tab === 2 && grab === lis) w[1] = 0;
    grab.mode = 'drag'; grab.target = w; sc.setPointerCapture(e.pointerId); e.preventDefault();
  });
  sc.addEventListener('pointermove', e => { if (!grab) return; const w = toWorld(e); if (tab === 2 && grab === lis) w[1] = 0; if (tab === 2 && grab === src) w[1] = Math.max(50, w[1]); grab.target = w; });
  const endDrag = () => { if (grab) { if (grab === lis && tab !== 3) { lis.mode = 'still'; lis.vx = 0; lis.vy = 0; lis.target = null; } else release(grab); } grab = null; };
  sc.addEventListener('pointerup', endDrag); sc.addEventListener('pointercancel', endDrag);

  // ================================================================
  // 8. LOOP
  // ================================================================
  let last = null, lastRead = 0;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts;
    if (dt > 0 && !document.hidden && playing && !reduced) {
      if (tab !== 4) {
        advance(dt);
        const arr = heardNow();
        if (tab === 2 && arr.length === 2 && prevCount === 0) { boomFlash = simT; audioBoom(); }
        prevCount = arr.length;
        pitchLog.push([simT, arr[0] ? arr[0].ratio : null, arr[1] ? arr[1].ratio : null]); while (pitchLog.length && pitchLog[0][0] < simT - 9) pitchLog.shift();
        audioUpdate(arr, cur());
      }
      draw();
      if (ts - lastRead > 150) { readout(); lastRead = ts; }
    }
    requestAnimationFrame(frame);
  }
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
</html>
