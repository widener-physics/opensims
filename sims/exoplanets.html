<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finding exoplanets</title>
<style>
  :root {
    --paper: #F2F5F7; --panel: #FFFFFF; --ink: #172128; --muted: #5C6B73; --rule: #D3DCE2; --soft: #E7EDF1;
    --body: #1D4F73; --hot: #C8321E; --vel: #2E7D32; --space: #0E141A; --pt: #1D4F73; --avg: #C8321E; --blue: #2F6FD6; --red: #C8321E;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--serif); font-size: 17px; line-height: 1.55; padding: 32px 20px 64px; }
  main { max-width: 900px; margin: 0 auto; }
  .home { font-family: var(--sans); font-size: 14px; margin: 0 0 18px; }
  .home a { color: var(--muted); text-decoration: none; }
  .home a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .home a::before { content: "\2190\00a0"; }
  h1 { font-weight: 500; font-size: 30px; line-height: 1.2; margin: 0 0 10px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 14px; max-width: 68ch; min-height: 3em; }
  [hidden] { display: none !important; }

  .tabs { display: flex; border-bottom: 1px solid var(--ink); margin: 0 0 16px; font-family: var(--sans); font-size: 15px; }
  .tabs button { font: inherit; padding: 8px 14px; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; border-radius: 0; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .tabs button span { color: var(--muted); font-weight: 400; margin-right: 8px; }

  canvas { display: block; width: 100%; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; }
  #scene { aspect-ratio: 900 / 300; }
  #scene.short { aspect-ratio: 900 / 200; }
  #graph { aspect-ratio: 900 / 300; margin-top: 12px; cursor: crosshair; touch-action: none; }
  #graph.two { aspect-ratio: 900 / 440; }

  .row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; font-family: var(--sans); font-size: 14px; }
  .row2 .hint { color: var(--muted); }
  .row2 label { display: inline-flex; gap: 6px; align-items: center; }
  button { font: inherit; font-family: var(--sans); font-size: 14px; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #BFD7E2; outline-offset: 2px; }
  select, input[type=number] { font: inherit; font-family: var(--sans); font-size: 14px; padding: 5px 6px; border: 1px solid var(--ink); border-radius: 4px; background: var(--panel); color: var(--ink); }
  input[type=number] { width: 5.5em; }
  .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink); border-left: 1px solid var(--ink); padding: 6px 10px; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .readout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 24px; margin-top: 14px; font-family: var(--sans); font-size: 14px; }
  .readout > div { padding: 12px 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; }
  .readout .k { color: var(--muted); margin-bottom: 4px; }
  .readout .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .readout .f { color: var(--muted); margin-top: 4px; font-family: var(--serif); font-size: 15px; }

  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 28px; font-family: var(--sans); font-size: 14px; padding: 16px 20px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; margin-top: 14px; }
  .controls label { display: block; }
  .controls .row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
  .controls .val { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .controls input[type=range] { width: 100%; }
  .controls select { width: 100%; }
  input[type=range] { height: 28px; margin: 0; accent-color: var(--body); cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chips span { color: var(--muted); margin-right: 2px; }
  .chips button { padding: 2px 8px; font-size: 13px; background: transparent; color: var(--ink); border-color: var(--rule); }
  .chips button:hover { border-color: var(--ink); }
  .scales { display: flex; gap: 10px; flex-wrap: wrap; }
  .scales label { display: flex; flex-direction: column; gap: 2px; flex: 1 1 120px; }

  .notes { margin-top: 18px; font-size: 16px; color: var(--muted); max-width: 72ch; }
  .notes p { margin: 0 0 8px; }
  .notes b { color: var(--ink); font-weight: 600; }

  @media (max-width: 700px) {
    body { padding: 20px 14px 48px; }
    #scene, #scene.short { aspect-ratio: 1 / 0.95; }
    #graph { aspect-ratio: 4 / 3; }
    #graph.two { aspect-ratio: 3 / 4; }
    .readout { grid-template-columns: 1fr; }
    .controls { grid-template-columns: 1fr; padding: 14px 16px; }
    .tabs button { padding: 8px 6px; font-size: 13px; flex: 1 1 auto; }
    .tabs button span { display: none; }
  }

  /* ---- wide screens: laid out like an app ---------------------------------------------------------
     The workspace (canvases, and the buttons directly under them) sits on the left and the sidebar
     (sliders, toggles, readouts) on the right, so everything needed to run the simulation is on
     screen at once. Canvases keep their natural shape; if that would push the workspace past the
     bottom of the window, the script at the end of the page shrinks them together until it fits.
     The explanation follows underneath. Phones and narrow windows keep the stacked layout above,
     unchanged: this block only rearranges the same elements. */
  .about { display: none; }
  @media (min-width: 1200px) and (min-height: 620px) {
    body { padding: 0 24px 48px; }
    main.app { max-width: 1200px; display: grid; column-gap: 20px;
      grid-template-columns: minmax(0, 1fr) 340px;
      grid-template-rows: 58px auto auto minmax(0, 1fr); align-items: start;
      grid-template-areas: "bar bar" "stage panel" "lede panel" "notes panel"; }   /* the text runs straight on under the canvases */
    .topbar { grid-area: bar; align-self: stretch; display: flex; align-items: center; gap: 24px; min-width: 0; }
    .topbar .home { margin: 0; white-space: nowrap; }
    .topbar h1 { font-size: 22px; line-height: 1.1; margin: 0; min-width: 0; overflow: hidden;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }   /* long titles wrap onto a second line */
    .topbar .tabs { margin: 0 0 0 auto; border-bottom: 0; flex: none; }
    .topbar .about { display: inline; margin-left: auto; font-family: var(--sans); font-size: 14px; color: var(--muted); white-space: nowrap; }
    .topbar .tabs + .about { margin-left: 0; }
    .workspace { grid-area: stage; display: flex; flex-direction: column; gap: 10px; min-width: 0; padding-bottom: 16px; }
    .workspace > * { flex: none; margin-top: 0 !important; margin-bottom: 0 !important; }
    .sidebar { grid-area: panel; position: sticky; top: 0; max-height: calc(100vh - 58px); overflow-y: auto; padding-bottom: 16px;
      display: flex; flex-direction: column; gap: 12px; }
    .sidebar > * { flex: none; margin-top: 0 !important; }
    .sidebar > .readout, .sidebar > table { order: 1; }   /* sliders first, so they are never pushed off screen */
    .sidebar .readout, .sidebar .controls { grid-template-columns: 1fr; }
    .sidebar .readout > div { padding: 10px 14px; }
    .sidebar .readout .f { font-size: 14.5px; line-height: 1.45; }
    .sidebar .toggles { flex-direction: column; align-items: flex-start; gap: 8px; }
    .sidebar table { width: 100%; }
    .sidebar .toggles > label:has(> input[type=checkbox]) { display: block; padding-left: 22px; text-indent: -22px; }
    .sidebar .toggles > label > input[type=checkbox] { margin: 0 6px 0 0; vertical-align: -2px; }
    .sidebar .toggles > label:has(.seg) { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    main.app > section:not([hidden]) { display: contents; }
    p.lede { grid-area: lede; margin: 12px 0 10px; min-height: 0; }
    .notes { grid-area: notes; margin-top: 0; }
  }
  /* shorter screens (a 1366x768 laptop, or a 1080p laptop at 125%): the same layout, packed tighter */
  @media (min-width: 1200px) and (min-height: 620px) and (max-height: 820px) {
    main.app { grid-template-rows: 50px auto auto minmax(0, 1fr); }
    .workspace { gap: 8px; padding-bottom: 10px; }
    .sidebar { max-height: calc(100vh - 50px); padding-bottom: 10px; gap: 8px; }
    .sidebar .readout { gap: 8px; }
    .sidebar .readout > div { padding: 7px 12px; }
    .sidebar .readout .k { margin-bottom: 1px; }
    .sidebar .readout .v { font-size: 16px; }
    .sidebar .readout .f { font-size: 13.5px; line-height: 1.35; margin-top: 2px; }
    .sidebar .controls { padding: 10px 14px; gap: 2px 20px; }
    .sidebar .controls input[type=range] { height: 24px; }
  }
</style>

<body>
<main class="app">
  <div class="topbar">
  <nav class="home" aria-label="Site"><a href="../">Open Physics Sims</a></nav>
  <h1>Finding exoplanets</h1>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab1" aria-selected="true"><span>1</span>Transits</button>
    <button role="tab" id="tab2" aria-selected="false"><span>2</span>Wobble</button>
    <button role="tab" id="tab3" aria-selected="false"><span>3</span>Mystery planet</button>
  </div>
  <a class="about" href="#lede">How to use it ↓</a>
  </div>

  <p class="lede" id="lede"></p>

  <div class="workspace">
  <canvas id="scene" aria-label="The star and planet"></canvas>
  <div class="row2">
    <button id="go">Start observing</button>
    <button id="clr" class="secondary">Start over</button>
    <div class="seg" id="spd" role="group" aria-label="How fast time passes">
      <button data-s="0.08333333">2 h/s</button><button data-s="1">1 day/s</button><button data-s="10">10 days/s</button><button data-s="100">100 days/s</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Plot the data">
      <button data-m="time" aria-pressed="true">against time</button><button data-m="fold" aria-pressed="false" id="foldbtn">folded</button>
    </div>
    <label id="lab_foldP">fold at <input id="foldP" type="number" min="0.1" step="0.01" inputmode="decimal"> days</label>
    <label id="lab_bins"><input type="checkbox" id="bins" checked> averages</label>
    <span class="hint" id="hint"></span>
  </div>
  <div class="row2" id="answer">
    <label>radius <input id="aR" type="number" min="0" step="0.1" inputmode="decimal"> Earths</label>
    <label>mass <input id="aM" type="number" min="0" step="0.1" inputmode="decimal"> Earths</label>
    <select id="aT" aria-label="What kind of planet"><option value="">kind of planet…</option><option value="rocky">rocky, like Earth</option><option value="gas">gas-rich</option></select>
    <button id="check">Check</button><button id="reveal" class="secondary" hidden>Reveal</button><button id="newp" class="secondary">New mystery planet</button>
    <span class="hint" id="verdict" aria-live="polite"></span>
  </div>
  <canvas id="graph" aria-label="The measurements; point at the graph to read values"></canvas>
  </div>

  <div class="sidebar">
  <div class="readout" id="readout"></div>

  <div class="controls">
    <label id="lab_star"><div class="row"><span>Star</span></div><select id="star"></select></label>
    <div class="chips" id="presets"><span>planets:</span></div>
    <label id="lab_R"><div class="row"><span>Planet's radius</span><span class="val" id="R_v"></span></div>
      <input type="range" id="R" min="0" max="1000" step="1"></label>
    <label id="lab_M"><div class="row"><span>Planet's mass</span><span class="val" id="M_v"></span></div>
      <input type="range" id="M" min="0" max="1000" step="1"></label>
    <label id="lab_a"><div class="row"><span>Orbit's radius</span><span class="val" id="a_v"></span></div>
      <input type="range" id="a" min="0" max="1000" step="1"></label>
    <label id="lab_inc"><div class="row"><span>Tilt of the orbit (90° = edge-on)</span><span class="val" id="inc_v"></span></div>
      <input type="range" id="inc" min="80" max="90" step="0.01"></label>
    <label id="lab_sig"><div class="row"><span>Spectrograph's precision</span></div>
      <select id="sig"><option value="10">10 m/s, like the 1990s</option><option value="1">1 m/s, today's best</option><option value="0.1">0.1 m/s, hoped for</option></select></label>
    <div class="scales">
      <label id="lab_ys">brightness scale<select id="ys"></select></label>
      <label id="lab_vs">velocity scale<select id="vs"></select></label>
    </div>
    <label id="lab_ld"><input type="checkbox" id="ld" checked> the star's edge is dimmer (limb darkening)</label>
  </div>
  </div>

  <div class="notes" id="notes"></div>
</main>

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. MODEL
  //    The block between the markers was tested on its own against the solar system, a known exoplanet,
  //    brute-force integration and a simulated student's analysis. It is copied in unchanged.
  // ================================================================
  // ---- physics core: finding exoplanets by transits and by the star's wobble ----
  // A planet on a circular orbit of radius a around a star; both orbit their common center of mass.
  // Kepler's third law:  P^2 = 4 pi^2 a^3 / G (M* + Mp).
  // Orbital phase phi = 2 pi (t - t0) / P, with mid-transit at t0. The orbit is tilted by the inclination i
  // (90 deg = edge-on). On the sky, in stellar radii, the planet sits at
  //     X = (a/R*) sin(phi),   Y = -(a/R*) cos(phi) cos(i),   and in front of the star when cos(phi) > 0.
  // Transit: the planet (radius ratio k = Rp/R*) covers part of a limb-darkened disk. The star's brightness
  // across its face follows Eddington's gray-atmosphere law I(mu) = 1 - u (1 - mu), u = 0.6, mu = cos of the
  // angle from the disk center; the light blocked is integrated exactly over the part of the disk the planet
  // covers (a one-dimensional integral over rings of the star, done numerically).
  // Wobble: the star moves on a small circle opposite the planet. Its velocity away from us is
  //     v_r = -K sin(phi),   K = (2 pi G / P)^(1/3) Mp sin(i) / (M* + Mp)^(2/3).
  // Data: brightness measured every 30 minutes with Gaussian scatter (200 parts per million, roughly a bright
  // star seen by Kepler); velocities measured about once a night, with Gaussian scatter you choose.

  const GN = 6.6743e-11;                       // m^3 kg^-1 s^-2 (CODATA 2018)
  const GM_SUN = 1.3271244e20;                 // IAU 2015 nominal, m^3/s^2
  const R_SUN = 6.957e8;                       // IAU 2015 nominal, m
  const GM_EARTH = 3.986004e14, R_EARTH = 6.3781e6;     // IAU 2015 nominal (equatorial radius)
  const GM_JUP = 1.2668653e17, R_JUP = 7.1492e7;        // IAU 2015 nominal (equatorial radius)
  const M_SUN = GM_SUN / GN, M_EARTH = GM_EARTH / GN, M_JUP = GM_JUP / GN;
  const AU = 1.495978707e11, DAY = 86400;
  const U_LD = 0.6;                            // Eddington limb darkening

  // main-sequence stars: the Sun, and Mamajek's table of mean dwarf properties (version 2022.04.16)
  const STARS = {
    F5: { name: 'F5 dwarf (hotter than the Sun)', short: 'F5 star', M: 1.33, R: 1.473, T: 6550 },
    G2: { name: 'the Sun', short: 'the Sun', M: 1.0, R: 1.0, T: 5772 },
    K5: { name: 'K5 dwarf (orange, cooler)', short: 'K5 star', M: 0.70, R: 0.701, T: 4440 },
    M4: { name: 'M4 dwarf (a small red dwarf)', short: 'M4 star', M: 0.23, R: 0.274, T: 3210 }
  };

  // planet sizes in Earth radii, masses in Earth masses, orbits in AU
  const kOf = (RpE, star) => RpE * R_EARTH / (star.R * R_SUN);
  function periodDays(aAU, star, MpE) { const a = aAU * AU; return 2 * Math.PI * Math.sqrt(a * a * a / (GN * (star.M * M_SUN + (MpE || 0) * M_EARTH))) / DAY; }
  function aFromPeriod(Pd, star, MpE) { const P = Pd * DAY; return Math.cbrt(GN * (star.M * M_SUN + (MpE || 0) * M_EARTH) * P * P / (4 * Math.PI * Math.PI)) / AU; }
  function semiAmp(Pd, star, MpE, incDeg) {          // m/s
    const P = Pd * DAY, Ms = star.M * M_SUN, Mp = MpE * M_EARTH;
    return Math.cbrt(2 * Math.PI * GN / P) * Mp * Math.sin(incDeg * Math.PI / 180) / Math.pow(Ms + Mp, 2 / 3);
  }
  // mass from a measured K (inverse of semiAmp, solved by iteration because Mp also appears in M* + Mp)
  function massFromK(K, Pd, star, incDeg) {
    let m = 0;
    for (let n = 0; n < 60; n++) { const k1 = semiAmp(Pd, star, Math.max(m, 1e-9), incDeg); m = Math.max(m, 1e-9) * K / k1; }
    return m;
  }
  const densityOf = (RpE, MpE) => 5.513 * MpE / (RpE * RpE * RpE);   // g/cm^3, scaled from Earth's mean density

  // sky position in stellar radii, and whether the planet is in front
  function sky(t, sys) {
    const phi = 2 * Math.PI * (t - sys.t0) / sys.P, ar = sys.aAU * AU / (sys.star.R * R_SUN), ci = Math.cos(sys.inc * Math.PI / 180);
    return { X: ar * Math.sin(phi), Y: -ar * Math.cos(phi) * ci, front: Math.cos(phi) > 0, phi };
  }
  const impact = sys => sys.aAU * AU / (sys.star.R * R_SUN) * Math.cos(sys.inc * Math.PI / 180);

  // limb-darkened intensity at distance r (in stellar radii) from the disk center, and the disk's total
  const intensity = (r, u) => { const mu = Math.sqrt(Math.max(0, 1 - r * r)); return 1 - u * (1 - mu); };
  const totalFlux = u => Math.PI * (1 - u / 3);
  // fraction of the star's light blocked by a dark disk of radius k whose center is d from the star's center
  function blocked(d, k, u) {
    if (d >= 1 + k || k <= 0) return 0;
    const r0 = Math.max(0, d - k), r1 = Math.min(1, d + k);
    // the ring of radius r has arc 2 r alpha(r) inside the planet's disk
    const arc = r => {
      if (r <= 0) return 0;
      if (d < 1e-12) return r <= k ? 2 * Math.PI * r : 0;
      if (r <= k - d) return 2 * Math.PI * r;                       // the whole ring is covered
      const c = (r * r + d * d - k * k) / (2 * r * d);
      return c >= 1 ? 0 : c <= -1 ? 2 * Math.PI * r : 2 * r * Math.acos(c);
    };
    // integrate piece by piece between the places where the arc has a corner (where rings stop being wholly
    // covered), in a variable that clusters points at each piece's ends, where the arc and the intensity
    // have square-root edges
    const cuts = [r0, r1]; if (k - d > r0 && k - d < r1) cuts.splice(1, 0, k - d);
    const g = [[-0.7745966692414834, 5 / 9], [0, 8 / 9], [0.7745966692414834, 5 / 9]], n = 160;
    let s = 0;
    for (let c = 0; c + 1 < cuts.length; c++) {
      const ra = cuts[c], rb = cuts[c + 1];
      for (let j = 0; j < n; j++) {
        const a = j / n, b = (j + 1) / n;
        for (const [z, w] of g) {           // Gauss-Legendre, 3 points per panel, after r = ra + (rb - ra)(1 - cos(pi x))/2
          const x = (a + b) / 2 + z * (b - a) / 2, r = ra + (rb - ra) * (1 - Math.cos(Math.PI * x)) / 2;
          s += w * (b - a) / 2 * arc(r) * intensity(r, u) * (rb - ra) * Math.PI * Math.sin(Math.PI * x) / 2;
        }
      }
    }
    return s / totalFlux(u);
  }
  // relative brightness of the system at time t (1 = no planet in front)
  function brightness(t, sys, u) {
    const p = sky(t, sys);
    if (!p.front) return 1;
    return 1 - blocked(Math.hypot(p.X, p.Y), kOf(sys.RpE, sys.star), u === undefined ? U_LD : u);
  }
  // the star's velocity away from us, m/s
  function starVr(t, sys) { return -semiAmp(sys.P, sys.star, sys.MpE, sys.inc) * Math.sin(2 * Math.PI * (t - sys.t0) / sys.P); }

  // transit duration, first to last contact, days (Seager & Mallen-Ornelas 2003, circular orbit)
  function duration(sys) {
    const ar = sys.aAU * AU / (sys.star.R * R_SUN), k = kOf(sys.RpE, sys.star), b = impact(sys), si = Math.sin(sys.inc * Math.PI / 180);
    const q = (1 + k) * (1 + k) - b * b;
    return q <= 0 ? 0 : sys.P / Math.PI * Math.asin(Math.min(1, Math.sqrt(q) / (ar * si)));
  }

  // Mystery planets: a type of planet around a type of star, each varied a little. Every one is chosen so that
  // a few weeks of data give its size and mass clearly: transits deep enough and wobbles of at least 4 m/s.
  const POOL_SPEC = [
    ['G2', 13.4, 222, 3.5, 'a hot Jupiter'], ['K5', 9.5, 95, 9, 'a warm Saturn'], ['M4', 4.0, 17, 6, 'a Neptune'],

  const POOL = POOL_SPEC.map(([s, R, M, Pd, label]) => rnd => {

  // ---- end of core ----

  const RE_J = R_JUP / R_EARTH, ME_J = M_JUP / M_EARTH;
  const STAR_COLOR = { F5: '#FAF6FF', G2: '#FFF0DC', K5: '#FFD6A3', M4: '#FFB877' };

    ['Earth', 'G2', 1, 1, 1, 100], ['Jupiter', 'G2', RE_J, ME_J, 5.2026, 100], ['hot Jupiter', 'G2', 13.4, 222, 0.045, 1],

  // log sliders: 0..1000 maps onto a range
  const LOG = { R: [0.5, 25], M: [0.1, 5000], a: [0.01, 6] };
  const toS = (k, v) => Math.round(1000 * Math.log(v / LOG[k][0]) / Math.log(LOG[k][1] / LOG[k][0]));
  const fromS = (k, s) => LOG[k][0] * Math.pow(LOG[k][1] / LOG[k][0], s / 1000);

  const VS = [0.3, 1, 3, 10, 30, 100, 200, 500];                         // velocity scales, +/- m/s

  const blank = () => ({ ph: { t: [], f: [] }, fo: { x: [], f: [] }, rv: { t: [], v: [] }, t: 0, playing: false, nPh: 0 });
  const TAB = {
    1: Object.assign(blank(), { star: 'G2', RpE: 1, MpE: 1, aAU: 1, inc: 90, ld: true, speed: 100, mode: 'fold', bins: true, ys: 1 }),
    2: Object.assign(blank(), { star: 'G2', RpE: 13.4, MpE: 222, aAU: 0.045, inc: 90, ld: true, speed: 10, mode: 'fold', bins: true, vs: 6, sig: 10 }),

  let tab = 1;
  const S = () => TAB[tab];

  function clearData(x) { Object.assign(x, { ph: { t: [], f: [] }, fo: { x: [], f: [] }, rv: { t: [], v: [] }, t: 0, nPh: 0 }); }

    const x = TAB[3], pool = POOL.map((f, i) => i).filter(i => !x.sys || i !== x.poolIndex), i = pool[Math.floor(Math.random() * pool.length)];

  // ================================================================
  // 2. DRAWING

  function fit(canvas) {

  const font = (ctx, px, w) => { ctx.font = (w || '') + ' ' + px + 'px ' + C('--sans'); };

  // seen from above the orbit (not to scale): planet, star and its exaggerated wobble, and the direction to Earth

  function drawScene() {

  // ---- graphs
  let hover = null;          // pointer position over the graph
  function panel(ctx, box, xr, yr, xt, yt, fx, fy, xl, yl, title) {
    const X = v => box.x + (v - xr[0]) / (xr[1] - xr[0]) * box.w, Y = v => box.y + box.h - (v - yr[0]) / (yr[1] - yr[0]) * box.h;

    ctx.textAlign = 'left'; font(ctx, 12); ctx.fillText(title, box.x, box.y - 8);

    else { const span = tab === 3 ? Math.max(10, x.t) : Math.max(5, Math.min(4 * sys.P, 6000)); xr = [Math.max(0, x.t - span), Math.max(span, x.t)]; xs = x.rv.t; xl = 'days since you started observing'; }
    xt = ticks(xr[0], xr[1], 6);
    const P_ = panel(ctx, box, xr, yr, xt, yt, v => String(v), v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v), xl, 'm/s; + is away from us', 'the star\'s velocity');
    // error bars, then points
    ctx.save(); ctx.beginPath(); ctx.rect(box.x, box.y, box.w, box.h); ctx.clip();
    ctx.strokeStyle = 'rgba(29,79,115,0.35)'; ctx.lineWidth = 1;
    for (let i = 0; i < xs.length; i++) { const a = P_.X(xs[i]); if (a < box.x || a > box.x + box.w) continue; ctx.beginPath(); ctx.moveTo(a, P_.Y(x.rv.v[i] - x.sig)); ctx.lineTo(a, P_.Y(x.rv.v[i] + x.sig)); ctx.stroke(); }
    ctx.restore();
    dots(ctx, P_, xs, x.rv.v, C('--pt'), 4);
    const folded = (tab === 2 && x.mode === 'fold') || (tab === 3 && x.mode === 'fold' && x.foldP);
    if (folded && x.bins) averages(ctx, P_, xs, x.rv.v, 20);
    offScale(ctx, P_, xs, x.rv.v);
    return P_;
  }
  // readings beyond the vertical scale are not drawn; say so, so nobody mistakes an empty graph for no signal
  function offScale(ctx, P_, xs, ys) {
    let n = 0; for (let i = 0; i < xs.length; i++) if (xs[i] >= P_.xr[0] && xs[i] <= P_.xr[1] && (ys[i] < P_.yr[0] || ys[i] > P_.yr[1])) n++;
    if (n < 3 || n < 0.01 * xs.length) return;          // a stray noisy reading or two is not worth a warning
    font(ctx, 11, '600'); ctx.fillStyle = C('--hot'); ctx.textAlign = 'right';
    ctx.fillText(n + ' reading' + (n > 1 ? 's' : '') + ' off the scale: choose a larger scale', P_.box.x + P_.box.w - 6, P_.box.y + 14);
  }
  let panels = [];
  function drawGraph() {
    const cv = $('graph'); cv.classList.toggle('two', tab === 3);
    const { ctx, W, H, compact } = fit(cv);
    ctx.clearRect(0, 0, W, H);
    if (W < 120 || H < 100) { panels = []; return; }
    const x = S(), sys = sysOf(x), ml = compact ? 54 : 70, mr = 14;
    panels = [];
    if (tab === 3) {
      const h1 = (H - 2 * 62) / 2;
      panels.push(['light', lightPanel(ctx, { x: ml, y: 26, w: W - ml - mr, h: h1 }, x, sys)]);
      panels.push(['vel', velPanel(ctx, { x: ml, y: 26 + h1 + 62, w: W - ml - mr, h: h1 }, x, sys)]);
    } else if (tab === 1) panels.push(['light', lightPanel(ctx, { x: ml, y: 26, w: W - ml - mr, h: H - 26 - 36 }, x, sys)]);
    else panels.push(['vel', velPanel(ctx, { x: ml, y: 26, w: W - ml - mr, h: H - 26 - 36 }, x, sys)]);
    // the pointer's reading
    if (hover) panels.forEach(([kind, P_]) => {
      const b = P_.box; if (hover[0] < b.x || hover[0] > b.x + b.w || hover[1] < b.y || hover[1] > b.y + b.h) return;
      const xv = P_.xr[0] + (hover[0] - b.x) / b.w * (P_.xr[1] - P_.xr[0]), yv = P_.yr[0] + (b.y + b.h - hover[1]) / b.h * (P_.yr[1] - P_.yr[0]);
      ctx.strokeStyle = 'rgba(23,33,40,0.5)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(hover[0] + 0.5, b.y); ctx.lineTo(hover[0] + 0.5, b.y + b.h); ctx.moveTo(b.x, hover[1] + 0.5); ctx.lineTo(b.x + b.w, hover[1] + 0.5); ctx.stroke(); ctx.setLineDash([]);
      const txt = xv.toFixed(Math.abs(P_.xr[1] - P_.xr[0]) < 20 ? 2 : 1).replace('-', '−') + ', ' + (kind === 'light' ? fmtDip(yv, YS[x.ys]) : (yv > 0 ? '+' : '−') + Math.abs(yv).toFixed(VS[x.vs] < 5 ? 2 : 1) + ' m/s');
      font(ctx, 12, '600'); const tw = ctx.measureText(txt).width, tx = Math.min(hover[0] + 8, b.x + b.w - tw - 6), ty = Math.max(b.y + 16, hover[1] - 8);
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(tx - 3, ty - 13, tw + 6, 17); ctx.fillStyle = C('--ink'); ctx.textAlign = 'left'; ctx.fillText(txt, tx, ty);
    });
  }
  function draw() { drawScene(); drawGraph(); }

  // ================================================================
  // 3. READOUTS AND CONTROLS
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  const fmtR = r => r >= 6 ? (r / RE_J).toFixed(2) + ' Jupiters' : r.toFixed(2) + ' Earths';
  const fmtM = m => m >= 50 ? (m / ME_J).toFixed(2) + ' Jupiters' : m.toFixed(m < 10 ? 2 : 1) + ' Earths';
  const fmtP = d => d < 2 ? (d * 24).toFixed(1) + ' hours' : d < 700 ? d.toFixed(d < 20 ? 2 : 1) + ' days' : (d / 365.25).toFixed(2) + ' years';
  const fmtT = d => d < 2 ? (d * 24).toFixed(1) + ' hours' : d < 1000 ? d.toFixed(1) + ' days' : (d / 365.25).toFixed(1) + ' years';
  function readout() {
    const x = S(), sys = sysOf(x);
    let html = '';
    if (tab === 1) {
      html += card('The planet', fmtR(x.RpE), 'its radius is ' + (kOf(x.RpE, sys.star)).toFixed(4) + ' of the star\'s (' + sys.star.short + ': ' + sys.star.R.toFixed(3) + ' solar radii)');
      html += card('Its orbit', fmtP(sys.P), x.aAU.toFixed(3) + ' AU from ' + sys.star.short + ', tilted to ' + x.inc.toFixed(2) + '°');
      html += card('Observing', x.t > 0 ? fmtT(x.t) : 'not yet', x.t > 0 ? x.nPh.toLocaleString() + ' brightness readings so far (every 30 minutes)' : 'press Start observing');
    } else if (tab === 2) {
      const v = starVr(x.t, sys);
      html += card('The planet', fmtM(x.MpE), x.aAU.toFixed(3) + ' AU from ' + sys.star.short + ' (' + sys.star.M.toFixed(2) + ' solar masses), orbiting in ' + fmtP(sys.P));
      html += card('The star right now', (v < 0 ? 'approaching ' : v > 0 ? 'receding ' : '') + Math.abs(v).toFixed(Math.abs(v) < 10 ? 2 : 1) + ' m/s', 'how fast it moves toward or away from us; walking pace is about 1.4 m/s');
      html += card('Observing', x.t > 0 ? fmtT(x.t) : 'not yet', x.rv.t.length + ' velocity measurements, each good to ±' + x.sig + ' m/s (about one a night; some nights are cloudy)');
    } else {
      html += card('The star (known)', sys.star.short === 'the Sun' ? 'Sun-like' : sys.star.short.replace('star', 'dwarf'), sys.star.M.toFixed(2) + ' solar masses, ' + sys.star.R.toFixed(3) + ' solar radii (' + (sys.star.R * 109.1).toFixed(1) + ' Earth radii)');
      html += card('Observing', x.t > 0 ? fmtT(x.t) : 'not yet', x.nPh.toLocaleString() + ' brightness readings (every 30 minutes, ±200 ppm each) and ' + x.rv.t.length + ' velocities (±1 m/s each)');
      const a = x.answer;
      html += card('Your answer', !a ? '—' : a.ok ? 'Right: ' + sys.label.replace(/^a /, '') : x.revealed ? sys.label : 'Not yet',
        !a ? 'radius, mass and kind; within 20% counts' : (a.ok || x.revealed) ? 'radius ' + sys.RpE.toFixed(2) + ' Earths, mass ' + sys.MpE.toFixed(2) + ' Earths, density ' + densityOf(sys.RpE, sys.MpE).toFixed(1) + ' g/cm³, orbit ' + sys.P.toFixed(2) + ' days' : a.msg);
    }
    $('readout').innerHTML = html;
    if (tab < 3) {
      $('R_v').textContent = fmtR(x.RpE); $('M_v').textContent = fmtM(x.MpE); $('a_v').textContent = x.aAU.toFixed(3) + ' AU'; $('inc_v').textContent = x.inc.toFixed(2) + '°';
    }
  }

  const TEXT = {
    1: { lede: 'A distant astronomer watches the Sun while Earth passes in front of it. Predict: by how much does the Sun dim? A hundredth? A thousandth? Less? Start observing, then try Jupiter, a hot Jupiter, and Earth around a small red dwarf.',
         notes: '<p><b>What to try.</b> With Earth and the Sun, the dip is far smaller than the scatter in any single reading; watch the red averages as transits pile up, one a year. Switch to Jupiter: the dip is obvious at once. Put an Earth-size planet around the M4 red dwarf and it is easy to see, because the star is small. Tilt the orbit a little away from 90° and the transit gets shorter and shallower, then stops: from most directions in space, a planet never passes in front of its star. Turn off limb darkening and the bottom of the dip goes flat.</p>' +
                '<p><b>Why.</b> The planet hides a fraction of the star\'s disk equal to (<i>R</i><sub>p</sub>/<i>R</i><sub>*</sub>)², so the depth gives the planet\'s size relative to its star\'s: Earth covers 1/12,000 of the Sun (84 parts per million), Jupiter 1%. The time between dips is the orbital period, and Kepler\'s third law then gives the orbit\'s size. A star is brighter in the middle than at its edge (the edge shows cooler, higher layers), so a planet crossing the middle blocks a little more than its share: about 1.25 (<i>R</i><sub>p</sub>/<i>R</i><sub>*</sub>)². For a random tilt, the chance of seeing transits is about <i>R</i><sub>*</sub>/<i>a</i>: 0.5% for Earth, 10% for a hot Jupiter.</p>' +
                '<p><b>The model.</b> A circular orbit. Stars from Mamajek\'s table of average main-sequence stars, plus the Sun. Limb darkening by Eddington\'s law, <i>I</i> = 1 − 0.6(1 − cos <i>θ</i>), close to the Sun\'s in visible light. Brightness is read every 30 minutes with a scatter of 200 parts per million, roughly what the Kepler space telescope managed on a bright star. Planets are dark; the light they reflect, and starspots, are left out. No real telescope can see the planet\'s silhouette; the picture is there to show what the light curve means.</p>' },
    2: { lede: 'A planet and its star both orbit their common center of mass, so the star moves in a small circle, and its light shifts toward blue as it comes toward us and toward red as it goes away. Predict: which makes its star wobble faster, Jupiter, or the same planet much closer in? Then find out how hard Earth is to detect.',
         notes: '<p><b>What to try.</b> The hot Jupiter, measured to 10 m/s (the precision of the 1990s), shows a clear wobble in a few days; this is how 51 Pegasi b, the first planet found around a Sun-like star, was discovered in 1995. Move it out to Jupiter\'s distance: the wobble drops to 12.5 m/s and takes 12 years. Try Earth: the Sun wobbles at 9 centimeters a second, below even the 0.1 m/s precision astronomers hope for. Around a small red dwarf the same planet makes a bigger wobble. Tilt the orbit toward face-on and the wobble shrinks: we only see the part of the motion along our line of sight.</p>' +
                '<p><b>Why.</b> Momentum: the star moves opposite the planet with speed (<i>M</i><sub>p</sub>/<i>M</i><sub>*</sub>) times the planet\'s, so heavy planets close to light stars give the biggest wobbles. The amplitude is <i>K</i> = (2π<i>G</i>/<i>P</i>)<sup>1/3</sup> <i>M</i><sub>p</sub> sin <i>i</i> / (<i>M</i><sub>*</sub> + <i>M</i><sub>p</sub>)<sup>2/3</sup>. Since only sin <i>i</i> times the mass shows up, the wobble alone gives a minimum mass, unless the planet also transits, which means <i>i</i> is close to 90°.</p>' +
                '<p><b>The model.</b> A circular orbit. Velocities measured about once a night (a quarter of nights are cloudy) with Gaussian scatter at the precision you choose. Real stars add their own jitter, from convection and spots, of about 1 m/s, which is left out. The spectrum\'s shift is drawn 100,000 times larger than it is, so you can see it.</p>' },
    3: { lede: 'A star you know well, a planet you know nothing about. The star\'s brightness dips now and then, and its light shifts back and forth. Measure the planet\'s orbit, size and mass, and decide: is it rocky like Earth, or gas-rich?',
         notes: '<p><b>What to do.</b> Observe until you see several dips. Point at the graph to read times and values. The time between dips is the period; type it in and fold, and every orbit stacks up so the dip and the wobble stand out. Then:</p>' +
                '<p><b>Size.</b> For a transit across the middle of the star, the depth is about 1.25 (<i>R</i><sub>p</sub>/<i>R</i><sub>*</sub>)², so <i>R</i><sub>p</sub> = <i>R</i><sub>*</sub>√(0.8 × depth). Use the star\'s radius in Earth radii (the Sun is 109 Earth radii).</p>' +
                '<p><b>Mass.</b> Read the wobble\'s amplitude <i>K</i> from the folded velocities. Earth makes the Sun wobble at 0.0895 m/s with a 1-year period, and <i>K</i> grows as <i>M</i><sub>p</sub>/(<i>M</i><sub>*</sub><sup>2/3</sup><i>P</i><sup>1/3</sup>), so <i>M</i><sub>p</sub> ≈ (<i>K</i> / 0.0895 m/s) × (<i>M</i><sub>*</sub>/<i>M</i><sub>Sun</sub>)<sup>2/3</sup> × (<i>P</i> / 1 year)<sup>1/3</sup> Earth masses. The planet transits, so its orbit is nearly edge-on and this is its true mass.</p>' +
                '<p><b>What it is made of.</b> Density = 5.5 g/cm³ × (mass in Earths) / (radius in Earths)³. Rock and iron give 3 g/cm³ or more; a planet much less dense than that must hold a thick envelope of gas. Within 20% counts for the radius and the mass.</p>' }
  };

  const SHOW = { lab_star: [1, 2], presets: [1, 2], lab_R: [1], lab_M: [2], lab_a: [1, 2], lab_inc: [1, 2], lab_sig: [2], lab_ys: [1, 3], lab_vs: [2, 3], lab_ld: [1], answer: [3], lab_foldP: [3] };
  function visibility() {
    Object.keys(SHOW).forEach(id => { $(id).hidden = SHOW[id].indexOf(tab) < 0; });
    const x = S();
    $('go').textContent = x.playing ? 'Pause' : x.t > 0 ? 'Keep observing' : 'Start observing';
    document.querySelectorAll('#spd button').forEach(b => b.setAttribute('aria-pressed', String(Math.abs(+b.dataset.s - x.speed) < 1e-6)));
    document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === x.mode)));
    $('foldbtn').textContent = tab === 3 ? 'folded' : tab === 1 ? 'folded on the period' : 'folded on the period';
    $('lab_bins').hidden = !(x.mode === 'fold');
    $('hint').textContent = tab === 3 && x.mode === 'fold' && !x.foldP ? 'type a period to fold on' : 'point at the graph to read values';
    $('reveal').hidden = !(tab === 3 && x.answer && !x.answer.ok && !x.revealed);
  }
  function sync() {
    const x = S();
    if (tab < 3) { $('star').value = x.star; $('R').value = String(toS('R', x.RpE)); $('M').value = String(toS('M', x.MpE)); $('a').value = String(toS('a', x.aAU)); $('inc').value = String(x.inc); $('ld').checked = x.ld; }
    if (x.sig !== undefined) $('sig').value = String(x.sig);
    if (x.ys !== undefined) $('ys').value = String(x.ys); if (x.vs !== undefined) $('vs').value = String(x.vs);
    $('bins').checked = x.bins;
  }
  function upd() { visibility(); readout(); draw(); }
  function setTab(k) {
    tab = k; hover = null;
    [1, 2, 3].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    sync(); upd();
  }
  [1, 2, 3].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));

  Object.keys(STARS).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = STARS[k].name.replace(/^the Sun$/, 'the Sun (G2)'); $('star').appendChild(o); });
  YS.forEach((r, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = 'dips to ' + (r < 0.001 ? Math.round(r * 1e6) + ' ppm' : (r * 100) + '%'); $('ys').appendChild(o); });
  VS.forEach((v, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = '±' + v + ' m/s'; $('vs').appendChild(o); });
  PRESETS.forEach(([name, star, R, M, a, spd]) => {
    const b = document.createElement('button'); b.textContent = name;
    b.addEventListener('click', () => { const x = S(); Object.assign(x, { star, RpE: R, MpE: M, aAU: a, inc: 90, speed: spd }); clearData(x); x.playing = false;
      if (tab === 1) x.ys = R / STARS[star].R < 2 ? 1 : R / STARS[star].R < 6 ? 3 : 4;
      if (tab === 2) { const K = semiAmp(periodDays(a, STARS[star], M), STARS[star], M, 90); const idx = VS.findIndex(v => v >= 1.3 * Math.max(K, 3 * x.sig)); x.vs = idx < 0 ? VS.length - 1 : idx; }
      sync(); upd(); });
    $('presets').appendChild(b);
  });
  // any change to the system starts the observations over
  const change = fn => () => { const x = S(); fn(x); clearData(x); upd(); };
  $('star').addEventListener('change', change(x => { x.star = $('star').value; }));
  $('R').addEventListener('input', change(x => { x.RpE = fromS('R', +$('R').value); }));
  $('M').addEventListener('input', change(x => { x.MpE = fromS('M', +$('M').value); }));
  $('a').addEventListener('input', change(x => { x.aAU = fromS('a', +$('a').value); }));
  $('inc').addEventListener('input', change(x => { x.inc = +$('inc').value; }));
  $('ld').addEventListener('change', change(x => { x.ld = $('ld').checked; }));
  $('sig').addEventListener('change', change(x => { x.sig = +$('sig').value; }));
  $('ys').addEventListener('change', () => { S().ys = +$('ys').value; drawGraph(); });
  $('vs').addEventListener('change', () => { S().vs = +$('vs').value; draw(); });
  $('bins').addEventListener('change', () => { S().bins = $('bins').checked; drawGraph(); });
  $('go').addEventListener('click', () => { const x = S(); x.playing = !x.playing; upd(); });
  $('clr').addEventListener('click', () => { const x = S(); clearData(x); x.playing = false; upd(); });
  document.querySelectorAll('#spd button').forEach(b => b.addEventListener('click', () => { S().speed = +b.dataset.s; visibility(); }));
  document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => { S().mode = b.dataset.m; upd(); }));
  $('foldP').addEventListener('input', () => { const v = parseFloat($('foldP').value); TAB[3].foldP = isFinite(v) && v > 0.05 ? v : null; if (TAB[3].foldP) TAB[3].mode = 'fold'; upd(); });
  $('newp').addEventListener('click', () => { newMystery(); upd(); });
  $('reveal').addEventListener('click', () => { TAB[3].revealed = true; upd(); });
  $('check').addEventListener('click', () => {
    const x = TAB[3], sys = x.sys, R = parseFloat($('aR').value), M = parseFloat($('aM').value), T = $('aT').value;
    if (!isFinite(R) || !isFinite(M) || !T) { x.answer = { ok: false, msg: 'give a radius, a mass and a kind of planet' }; upd(); return; }
    const okR = Math.abs(R / sys.RpE - 1) <= 0.2, okM = Math.abs(M / sys.MpE - 1) <= 0.2, okT = (T === 'rocky') === isRocky(sys.RpE, sys.MpE);
    const bits = [];
    if (!okR) bits.push('the radius is ' + (R > sys.RpE ? 'too large' : 'too small'));
    if (!okM) bits.push('the mass is ' + (M > sys.MpE ? 'too large' : 'too small'));
    if (!okT) bits.push('the kind is wrong');
    x.answer = { ok: okR && okM && okT, msg: bits.join('; ') + '.' };
    $('verdict').textContent = x.answer.ok ? 'Right.' : '';
    upd();
  });
  const gpt = e => { const r = $('graph').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  $('graph').addEventListener('pointermove', e => { hover = gpt(e); drawGraph(); });
  $('graph').addEventListener('pointerdown', e => { hover = gpt(e); drawGraph(); });
  $('graph').addEventListener('pointerleave', () => { hover = null; drawGraph(); });
  window.addEventListener('resize', draw);

  // ================================================================
  // 4. LOOP: time runs at the chosen speed; the graph is redrawn a few times a second
  // ================================================================
  let last = null, sinceGraph = 0;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000);
    last = ts;
    const x = S();
    if (x.playing && !document.hidden && dt > 0) {
      observe(x, x.t + dt * x.speed);
      drawScene(); sinceGraph += dt;
      if (sinceGraph > 0.12) { sinceGraph = 0; drawGraph(); readout(); }
    }
    requestAnimationFrame(frame);
  }
  newMystery();
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
</html>
