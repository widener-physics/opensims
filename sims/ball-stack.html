    <div class="grp" id="lab_top"><div>Top ball</div><div class="seg" id="top" role="group" aria-label="Top ball"><button data-v="tennis">tennis ball</button><button data-v="golf">golf ball</button><button data-v="pingpong">ping-pong ball</button></div></div>
    <div class="grp" id="lab_tower"><div>Balls in the tower (heaviest at the bottom)</div><div class="checks" id="tower"></div></div>
    <div class="grp" id="lab_sm"><div>Stack</div><div class="seg" id="sm" role="group" aria-label="Stack"><button data-v="2">basketball + tennis ball</button><button data-v="3">+ ping-pong ball</button></div></div>
    <label id="lab_ts"><div class="row"><span>Time since the floor was hit</span><span class="val" id="ts_v"></span></div><input type="range" id="ts" min="0" max="1000" step="1"></label>

<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement), C = v => css.getPropertyValue(v).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. PHYSICS (tested on its own; see tests/ball-stack.test.js)
  // ================================================================
  // ---- physics core: the bouncing ball stack ----
  // SI units; heights are of each ball's bottom above the floor (y), velocities positive upward.
  const G = 9.81;
  // real balls: mass (kg), diameter (m), coefficient of restitution on a hard floor, and roughly how long a bounce
  // on a hard floor lasts (s). Masses and sizes from the sports' rules; bounciness from the rules' drop tests.
  const BALLS = {
    basketball: { name: 'basketball', m: 0.62,   d: 0.24,   e: 0.77, tau: 0.010,  color: '#D9651B' },
    soccer:     { name: 'soccer ball', m: 0.43,  d: 0.22,   e: 0.84, tau: 0.009,  color: '#F2F2F2' },
    tennis:     { name: 'tennis ball', m: 0.058, d: 0.067,  e: 0.75, tau: 0.005,  color: '#D7E34A' },
    golf:       { name: 'golf ball',  m: 0.0459, d: 0.0427, e: 0.86, tau: 0.0005, color: '#FFFFFF' },
    pingpong:   { name: 'ping-pong ball', m: 0.0027, d: 0.040, e: 0.89, tau: 0.001, color: '#FFB347' }
  };
  // two balls meeting: bounciness between them estimated as the geometric mean of their floor bounciness
  const pairE = (a, b) => Math.sqrt(a.e * b.e);
  // an instant collision of two masses moving along a line, with restitution e: velocities after
  function collide(m1, v1, m2, v2, e) {
    const p = m1 * v1 + m2 * v2, M = m1 + m2;
    return [(p - m2 * e * (v1 - v2)) / M, (p + m1 * e * (v1 - v2)) / M];
  }

  // ---- the stack as springs: each contact squashes like a spring ----
  // A contact pushes back like a spring of stiffness k while it is being squashed, and more steeply, k/e^2, while it
  // springs back, so that it gives back the share e^2 of the energy it stored, whatever is pressing on it (Walton and
  // Braun's model of inelastic contacts). A ball bouncing on a rigid floor is in contact for tau seconds, which
  // sets k = m (pi (1 + e) / (2 tau))^2. Two balls touching act as their two springs in series.
  // "ideal": every contact is very short (0.05 ms) and the balls start a few millimeters apart, so they collide one
  // pair at a time, as in the textbook argument. "springy": each ball's own bounce time, and the balls start touching.
  const IDEAL_TAU = 5e-5, IDEAL_GAP = 0.003;
  function stiffness(ball, ideal) { const t = ideal ? IDEAL_TAU : ball.tau; return ball.m * Math.pow(Math.PI * (1 + ball.e) / (2 * t), 2); }
  // the push of one contact, squashed by s (> 0), which has been squashed at most smax so far
  function contactForce(c, s, smax) {
    if (s <= 0) return 0;
    if (s >= smax) return c.k * s;                                  // being squashed further
    const ku = c.k / (c.e * c.e), s0 = smax * (1 - c.e * c.e);      // springing back, more steeply
    return Math.max(0, ku * (s - s0));
  }
  // set up a stack (ids from the bottom up), its bottom ball's bottom at height h, all at rest
  function makeStack(ids, h, ideal) {
    const balls = ids.map(id => BALLS[id]); let y = h; const ys = [];
    balls.forEach((b, i) => { ys.push(y); y += b.d + (ideal ? IDEAL_GAP : 0); });
    const k = balls.map(b => stiffness(b, ideal));
    // the contacts: with the floor (any ball can reach it), and each ball with the one above
    const floor = balls.map((b, i) => ({ k: k[i], e: b.e, smax: 0 }));
    const pairs = balls.slice(0, -1).map((b, i) => ({ k: k[i] * k[i + 1] / (k[i] + k[i + 1]), e: pairE(b, balls[i + 1]), smax: 0 }));
    // time step: a small part of the quickest contact
    const quick = Math.min(...floor.map((c, i) => Math.PI / 2 * Math.sqrt(balls[i].m / c.k) * (1 + c.e)), ...pairs.map((c, i) => Math.PI / 2 * Math.sqrt(balls[i].m * balls[i + 1].m / (balls[i].m + balls[i + 1].m) / c.k) * (1 + c.e)));
    const tmin = quick;
    return { ids, balls, y: ys, v: ys.map(() => 0), t: 0, floor, pairs, dt: tmin / 40, ideal };
  }
  // the forces now: gravity, the floor, and the neighbors. With commit, each contact remembers its deepest squash.
  function forces(st, commit) {
    const n = st.balls.length, F = st.balls.map(b => -b.m * G);
    for (let i = 0; i < n; i++) { const c = st.floor[i], s = -st.y[i]; F[i] += contactForce(c, s, c.smax); if (commit) c.smax = s > 0 ? Math.max(c.smax, s) : 0; }
    for (let i = 0; i < n - 1; i++) { const c = st.pairs[i], s = st.y[i] + st.balls[i].d - st.y[i + 1], f = contactForce(c, s, c.smax); F[i] -= f; F[i + 1] += f; if (commit) c.smax = s > 0 ? Math.max(c.smax, s) : 0; }
    return F;
  }
  // one step (velocity Verlet)
  function step(st) {
    const dt = st.dt, F0 = forces(st, false), n = st.balls.length;
    for (let i = 0; i < n; i++) { st.v[i] += 0.5 * dt * F0[i] / st.balls[i].m; st.y[i] += dt * st.v[i]; }
    const F1 = forces(st, true); for (let i = 0; i < n; i++) st.v[i] += 0.5 * dt * F1[i] / st.balls[i].m;
    st.t += dt;
  }
  // after the bounce, later contacts (the balls landing again) use each ball's own bounce time: in the ideal model this
  // changes nothing that matters, and it saves following very stiff springs for seconds
  function soften(st) {
    if (!st.ideal) return;
    const k = st.balls.map(b => stiffness(b, false));
    st.floor.forEach((c, i) => { c.k = k[i]; });
    st.pairs.forEach((c, i) => { c.k = k[i] * k[i + 1] / (k[i] + k[i + 1]); });
    st.dt = Math.min(...st.balls.map(b => b.tau)) / 40; st.ideal = false;
  }
  const touching = st => st.y.some((y, i) => y < 0 || (i < st.y.length - 1 && y + st.balls[i].d > st.y[i + 1] + 1e-12));
  // drop the stack from h and follow it until the top ball has reached its highest point (or tMax).
  // Records every frame (every `rec` seconds, and every step while anything is in contact), and returns the
  // greatest height each ball reaches after the bounce, and the speeds just after.
  function drop(ids, h, ideal, opts) {
    opts = opts || {}; const st = makeStack(ids, h, ideal), n = ids.length, rec = opts.rec || 0.004, frames = [];
    const tMax = opts.tMax || 30; let lastRec = -1, bounced = false, top = Array(n).fill(-1), speedAfter = null, contactStart = null, contactEnd = null;
    const save = () => frames.push({ t: st.t, y: st.y.slice(), v: st.v.slice() });
    save();
    while (st.t < tMax) {
      // between contacts, fly freely to the next one (or the next frame) in big steps
      const c = touching(st);
      if (!c) {
        // time until the next contact, if all fly freely (no one's position is above another's top yet)
        let tn = Infinity;
        for (let i = 0; i < n; i++) { const a = -G / 2, b = st.v[i], cc = st.y[i]; const r = (-b - Math.sqrt(b * b - 4 * a * cc)) / (2 * a); if (r > 0) tn = Math.min(tn, r); }
        for (let i = 0; i < n - 1; i++) { const gap = st.y[i + 1] - (st.y[i] + st.balls[i].d), dv = st.v[i] - st.v[i + 1]; if (dv > 0) tn = Math.min(tn, gap / dv); }
        const jump = Math.min(tn * 0.999, rec, (bounced ? 1e9 : 1e9)) - st.dt;
        if (jump > st.dt * 4) { for (let i = 0; i < n; i++) { st.y[i] += st.v[i] * jump - G * jump * jump / 2; st.v[i] -= G * jump; } st.t += jump; }
        else step(st);
      } else { if (!bounced && st.y.some(y => y < 0)) { bounced = true; contactStart = st.t; } step(st); }
      if (bounced && speedAfter === null && !touching(st) && st.v[0] >= 0 && st.v.every((v, i) => i === 0 || v >= st.v[i - 1])) {
        // the bounce is over once nothing is touching and nothing is heading for another collision
        speedAfter = st.v.slice(); contactEnd = st.t; soften(st);
      }
      if (bounced) for (let i = 0; i < n; i++) top[i] = Math.max(top[i], st.y[i]);
      // every step during the bounce itself (for slow motion); otherwise every `rec` seconds

      else {
        const top = r.top[n] + BALLS[ids[n]].d, start = r.start[n] + BALLS[ids[n]].d, rise = r.top[n] - r.start[n];
        const air = riseWithDrag(BALLS[ids[n]], r.speedAfter[n]), noAir = r.speedAfter[n] ** 2 / (2 * G), airNote = air < 0.9 * noAir ? '. Air resistance, left out here, would hold it to about ' + (r.top[n] - rise + air + BALLS[ids[n]].d).toFixed(1) + ' m' : '';
        html = card('Top ball (' + nm(ids[n]) + ') rises to', top.toFixed(2) + ' m', (top / start).toFixed(top / start < 0.95 ? 2 : 1) + ' times the height it was dropped from (' + start.toFixed(2) + ' m, measured to its top)' + (tab === 4 ? '; dropped alone it would bounce back to ' + (BALLS[ids[n]].e ** 2 * (start - BALLS[ids[n]].d) + BALLS[ids[n]].d).toFixed(2) + ' m' : '') + airNote);
        html += card('Speed just after the bounce', r.speedAfter[n].toFixed(2) + ' m/s', 'it fell at ' + vFall.toFixed(2) + ' m/s: ' + (r.speedAfter[n] / vFall).toFixed(2) + ' times as fast, so it climbs ' + (r.speedAfter[n] / vFall).toFixed(2) + '² = ' + ((r.speedAfter[n] / vFall) ** 2).toFixed((r.speedAfter[n] / vFall) ** 2 < 0.95 ? 2 : 1) + ' times as far as it fell');
        if (tab === 2) html += card('The textbook limit', (2 ** ids.length - 1) + ' times as fast', 'for ' + ids.length + ' perfectly bouncy balls, each much lighter than the one below: 2ᴺ − 1. Real masses and bounciness give less');
        else html += card('Bottom ball (' + nm(ids[0]) + ') rises to', (r.top[0] + BALLS[ids[0]].d).toFixed(2) + ' m', 'dropped alone it would bounce back to ' + (BALLS[ids[0]].e ** 2 * H0 + BALLS[ids[0]].d).toFixed(2) + ' m (to its top)');
      }
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }

  const TEXT = {
    1: { lede: 'Hold a tennis ball on top of a basketball and drop them together from a meter up. Predict: how high will the tennis ball bounce: as high as it started, a little lower, or higher?',
         notes: '<p><b>What to try.</b> Drop the tennis ball on the basketball and watch the right-hand view: the tennis ball goes up about three times as high as it started. Swap in a golf ball, then a ping-pong ball: the lighter the top ball, the higher it goes. Then switch the collisions to the spring model and drop again (see below).</p>' +
                '<p><b>Why.</b> The basketball hits the floor first and bounces back up at nearly the speed it fell, v. It then meets the tennis ball, still coming down at v: they approach each other at 2v. A light ball bouncing off a much heavier one leaves at that closing speed, relative to the heavy one, which is still moving up at v: so it leaves at 2v + v = 3v, and climbs 3² = 9 times as high. Real balls lose some speed in each collision, and the tennis ball isn’t that light, so it gets less than 3v; the basketball, having given away much of its momentum, hardly bounces.</p>' +
                '<p><b>The model.</b> Each contact is a stiff spring that gives back the ball’s measured share of the speed (its bounciness, from the sports’ own drop tests). “One at a time” makes every contact very short and leaves tiny gaps between the balls, so the collisions happen in turn, as in the textbook. “Squashed together” gives each ball its real bounce time (about 10 ms for a basketball, 5 ms for a tennis ball) and starts the balls touching, so the contacts overlap: this simple spring model predicts a much smaller boost. Real balls dropped this way do go about three to four times as high, close to the textbook; physicists have traced the spring model’s shortfall to the way a hollow ball’s skin flexes and springs back (Cross 2007; Berdeni, Champneys and Szalai 2015). Air resistance is ignored.</p>' },
    2: { lede: 'Stack more balls, each lighter than the one below. Predict: does adding a third ball on top help much, or does the extra boost fade away?',
         notes: '<p><b>What to try.</b> Start with the basketball and tennis ball, then add the ping-pong ball on top and drop again: the top ball now goes far higher than before. Try other towers. Compare the speed the top ball leaves with to the textbook limit.</p>' +
                '<p><b>Why.</b> Each collision works like the two-ball case: the ball above leaves at roughly twice the speed of the ball below plus its own falling speed. With perfectly bouncy balls, each much lighter than the one below, the speeds go v, 3v, 7v, 15v, …: (2ᴺ − 1)v for a tower of N balls. Heights grow as the square: a five-ball tower could, in principle, launch its top ball 961 times as high as it fell. Real balls aren’t that bouncy and aren’t that different in mass, so the growth is slower, but still dramatic. Toys such as the Astro Blaster are stacks of rubber balls built on this idea, and astronomers use it as a picture of how the rebounding core of a collapsing star can blast off its lighter outer layers in a supernova.</p>' +
                '<p><b>The model.</b> As on the first tab: real masses and bounciness. Each pair of balls is given the average bounciness of the two (geometric mean), an estimate. The whole-flight view rescales to fit the highest bounce. Air resistance is left out of the motion; it would slow a ping-pong ball launched this fast a great deal, and the readout says how high it would really get.</p>' },
    3: { lede: 'The whole bounce lasts a few thousandths of a second. Slow it right down. Predict: does the tennis ball get its speed from the basketball, or from the floor?',
         notes: '<p><b>What to try.</b> Drag the time slider through the bounce, watching the arrows and the graph. With collisions one at a time, the basketball turns around at the floor first, then meets the tennis ball and nearly stops while the tennis ball shoots up. Add the ping-pong ball and the same thing happens twice. Then switch to the spring model: the contacts overlap, the basketball is still squashed against the floor when the tennis ball lands on it, and less speed reaches the top.</p>' +
                '<p><b>Why.</b> The floor only pushes on the bottom ball. The tennis ball gets its speed from the basketball, which has a lot of momentum to give: by stopping almost dead, the basketball passes on most of its upward momentum, and because the tennis ball is light, that becomes a big speed. Momentum is conserved in each collision between the balls; the floor (and the Earth behind it) supplies the momentum that turns the basketball around.</p>' +
                '<p><b>The model.</b> As on the first tab. In the one-at-a-time model each contact lasts 0.05 ms and the balls start 3 mm apart, so the whole sequence takes under a millisecond; in the spring model the bounce takes about 13 ms.</p>' },
    4: { lede: 'Now turn the stack upside down: the tennis ball underneath, the basketball on top. Predict: does the basketball bounce higher than it would alone?',
         notes: '<p><b>What to try.</b> Drop the pair with the heavy ball on the bottom, then with the light ball on the bottom. Upside down, the basketball bounces no higher than it would alone, or lower; the tennis ball is squeezed between the two and rattles back and forth.</p>' +
                '<p><b>Why.</b> The trick needs the heavy ball underneath: it bounces off the floor carrying a lot of momentum, which it hands to the light ball above. With the light ball underneath, the floor turns the tennis ball around, but the tennis ball has too little momentum to turn the heavy basketball around: it bounces off it again and again, between the basketball and the floor, losing energy each time, like a fly trying to stop a truck. The order of the stack matters, not just what is in it.</p>' +
                '<p><b>The model.</b> As on the first tab. In the one-at-a-time model the tennis ball hits the floor and the basketball many times in quick succession; in the spring model it is squeezed between them in one long contact.</p>' }
  };

  // ================================================================
  // 5. CONTROLS
  // ================================================================
  $('tower').innerHTML = ORDER.map(id => '<label><input type="checkbox" data-v="' + id + '"> ' + BALLS[id].name + '</label>').join('');
  function visibility() {
    $('lab_bot').hidden = !(tab === 1 || tab === 4); $('lab_top').hidden = !(tab === 1 || tab === 4); $('lab_tower').hidden = tab !== 2;
    $('lab_sm').hidden = tab !== 3; $('lab_ts').hidden = tab !== 3; $('lab_order').hidden = tab !== 4;
    $('go').textContent = tab === 3 ? (playing ? 'Pause' : 'Play in slow motion') : (playing ? 'Pause' : RUN[tab] && DONE[tab] ? 'Drop again' : RUN[tab] && PLAY[tab] > 0 ? 'Play' : 'Drop');
    $('slow').hidden = tab === 3; $('slow').textContent = S.slow ? 'Speed: slowed ×10' : 'Speed: real time'; $('slow').setAttribute('aria-pressed', String(S.slow));
    $('hint').textContent = tab === 3 ? 'or drag the time slider' : '';
    document.querySelectorAll('#bot button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.bot)));
    document.querySelectorAll('#top button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.top)));
    document.querySelectorAll('#tower input').forEach(b => { b.checked = !!S.tower[b.dataset.v]; b.disabled = S.tower[b.dataset.v] && ORDER.filter(id => S.tower[id]).length <= 2; });
    document.querySelectorAll('#sm button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === S.sm)));
    document.querySelectorAll('#order button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.order)));
    document.querySelectorAll('#model button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.model[tab])));
    $('scene').setAttribute('aria-label', tab === 3 ? 'The bounce in slow motion, with each ball’s velocity' : 'A stack of balls dropped on the floor: a close-up and the whole flight');
    $('graph').setAttribute('aria-label', tab === 3 ? 'Each ball’s velocity through the bounce' : 'Height of each ball against time');
  }
  function vals() { if (tab === 3 && RUN[3]) { const r = RUN[3], [a, b] = windowOf(r), t = a + (b - a) * TS / 1000; $('ts').value = String(Math.round(TS)); $('ts_v').textContent = ((t - r.contactStart) * 1000).toFixed(S.model[3] === 'ideal' ? 3 : 2) + ' ms'; } }
  function upd() { visibility(); vals(); draw(); readout(); }
  function setTab(k) { tab = k; playing = false; [1, 2, 3, 4].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k))); $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes; upd(); }
  [1, 2, 3, 4].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  // a change of balls or model clears the run (it has to be dropped again)
  const changed = () => { playing = false; RUN[tab] = null; if (tab === 4 || tab === 1) { RUN[1] = null; RUN[4] = null; } if (tab === 3) { compute(3); TS = 0; } upd(); };
  document.querySelectorAll('#bot button').forEach(b => b.addEventListener('click', () => { S.bot = b.dataset.v; changed(); }));
  document.querySelectorAll('#top button').forEach(b => b.addEventListener('click', () => { S.top = b.dataset.v; changed(); }));
  document.querySelectorAll('#tower input').forEach(b => b.addEventListener('change', () => { S.tower[b.dataset.v] = b.checked; changed(); }));
  document.querySelectorAll('#sm button').forEach(b => b.addEventListener('click', () => { S.sm = +b.dataset.v; changed(); }));
  document.querySelectorAll('#order button').forEach(b => b.addEventListener('click', () => { S.order = b.dataset.v; changed(); }));
  document.querySelectorAll('#model button').forEach(b => b.addEventListener('click', () => { S.model[tab] = b.dataset.v; changed(); }));
  $('ts').addEventListener('input', () => { TS = +$('ts').value; playing = false; upd(); });
  $('slow').addEventListener('click', () => { S.slow = !S.slow; upd(); });
  $('go').addEventListener('click', () => {
    if (playing) { playing = false; upd(); return; }
    if (tab === 3) { if (TS >= 1000) TS = 0; playing = true; upd(); return; }
    if (!RUN[tab] || DONE[tab]) compute(tab);
    playing = true; upd();
  });
  window.addEventListener('resize', draw);

  // ================================================================
  // 6. LOOP
  // ================================================================
  let last = null;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts;
    if (playing && dt > 0 && !document.hidden) {
      if (tab === 3) { TS = Math.min(1000, TS + dt * 1000 / 4); if (TS >= 1000) playing = false; }   // the whole bounce in about 4 s
      else { const r = RUN[tab]; PLAY[tab] = Math.min(r.end, PLAY[tab] + dt * (S.slow ? 0.1 : 1)); if (PLAY[tab] >= r.end) { playing = false; DONE[tab] = true; } }
      upd();
    }
    requestAnimationFrame(frame);
  }
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
