<script>
(function () {
  'use strict';
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const $ = id => document.getElementById(id);
  const TAU = 2 * Math.PI;

  // ================================================================
  // 1. MODEL
  //    The block between the markers was tested on its own against the textbook transmission formula, the
  //    Schrodinger equation, exact free-packet motion, and measured alpha-decay half-lives. It is copied in unchanged.
  // ================================================================
  // ---- physics core: quantum tunneling ----
  // Units: energies in eV, lengths in nm, times in fs. An electron: hbar^2 / 2m = 0.0380998 eV nm^2, hbar = 0.6582120 eV fs.
  // Complex numbers as [re, im].
  const H2M = 0.0380998, HBAR = 0.6582120;
  const c = (re, im) => [re, im || 0];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const div = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
  const cexp = z => { const m = Math.exp(z[0]); return [m * Math.cos(z[1]), m * Math.sin(z[1])]; };
  const abs2 = a => a[0] * a[0] + a[1] * a[1];
  const csqrt = z => { const r = Math.hypot(z[0], z[1]), re = Math.sqrt((r + z[0]) / 2), im = Math.sign(z[1] || 1) * Math.sqrt(Math.max(0, (r - z[0]) / 2)); return [re, z[1] === 0 && z[0] < 0 ? Math.sqrt(-z[0]) : im]; };

  // ---- 1. a steady wave of energy E on a rectangular barrier of height V0 from x = 0 to x = a ----
  // In each region psi = A e^{i q x} + B e^{-i q x} with q = sqrt((E - V)/H2M) (imaginary, i kappa, inside a barrier
  // taller than E). Matching psi and psi' at each edge, with the incoming wave of amplitude 1 and nothing coming from
  // the right, gives the reflected amplitude r, the transmitted amplitude t, and the wave everywhere.
  function waveOn(E, V0, a) {
    const k = Math.sqrt(E / H2M), q = csqrt(c((E - V0) / H2M));     // q = k2 inside the barrier (complex if E < V0)
    const qq = abs2(q) < 1e-24 ? c(1e-9) : q;                       // E = V0 exactly: the limit, taken numerically
    // work backward from the right: psi = t e^{ikx} for x > a. Inside: A e^{iqx} + B e^{-iqx}, matched at x = a.
    // Take t = 1 first, then rescale so the incoming amplitude is 1.
    const I = c(0, 1), eka = cexp(c(0, k * a));
    const iqa = mul(I, mul(qq, c(a))), ep = cexp(iqa), em = cexp(c(-iqa[0], -iqa[1]));
    // psi(a) = A ep + B em = eka;  psi'(a) = i q (A ep - B em) = i k eka
    const ratio = div(c(k), qq);                                     // k / q
    const A = div(mul(eka, add(c(1), ratio)), mul(c(2), ep)), B = div(mul(eka, sub(c(1), ratio)), mul(c(2), em));
    // at x = 0: psi(0) = A + B = 1 + r (times scale); psi'(0) = i q (A - B) = i k (1 - r)
    const p0 = add(A, B), d0 = mul(div(qq, c(k)), sub(A, B));        // (1 + r), (1 - r) up to the common scale
    const inc = div(add(p0, d0), c(2)), ref = div(sub(p0, d0), c(2));
    const t = div(c(1), inc), r = div(ref, inc), An = div(A, inc), Bn = div(B, inc);
    const psi = x => x < 0 ? add(cexp(c(0, k * x)), mul(r, cexp(c(0, -k * x))))
      : x <= a ? add(mul(An, cexp(mul(mul(I, qq), c(x)))), mul(Bn, cexp(mul(mul(I, qq), c(-x)))))
      : mul(t, cexp(c(0, k * x)));
    return { k, q, kappa: E < V0 ? Math.sqrt((V0 - E) / H2M) : 0, r, t, R: abs2(r), T: abs2(t), psi };
  }
  // the textbook formula, for comparison
  function transmission(E, V0, a) {
    if (V0 === 0) return 1;
    if (E < V0) { const kap = Math.sqrt((V0 - E) / H2M), s = Math.sinh(kap * a); return 1 / (1 + V0 * V0 * s * s / (4 * E * (V0 - E))); }
    if (E > V0) { const k2 = Math.sqrt((E - V0) / H2M), s = Math.sin(k2 * a); return 1 / (1 + V0 * V0 * s * s / (4 * E * (E - V0))); }
    return 1 / (1 + V0 * a * a / (4 * H2M));
  }

  // ---- 2. a wave packet, by the Crank-Nicolson method on a grid ----
  // i hbar dpsi/dt = -H2M d2psi/dx2 + V psi. Each step solves (1 + i dt H / 2 hbar) psi_new = (1 - i dt H / 2 hbar) psi_old,
  // which keeps the total probability exactly 1. The matrix is tridiagonal and the same every step, so its
  // factorization is done once.
  function makeGrid(x0, x1, N, V) {
    const dx = (x1 - x0) / (N - 1), xs = new Float64Array(N), Vs = new Float64Array(N);
    for (let i = 0; i < N; i++) { xs[i] = x0 + i * dx; Vs[i] = V(xs[i]); }
    return { x0, x1, N, dx, xs, Vs };
  }
  function makeStepper(g, dt) {
    const N = g.N, a = dt * H2M / (2 * HBAR * g.dx * g.dx);      // off-diagonal coupling, in units of i
    // left matrix: diagonal 1 + i (2a + dt V / 2 hbar), off-diagonals -i a. Thomas algorithm, factored once.
    const dRe = new Float64Array(N), dIm = new Float64Array(N);
    for (let i = 0; i < N; i++) { dRe[i] = 1; dIm[i] = 2 * a + dt * g.Vs[i] / (2 * HBAR); }
    const off = [0, -a];
    const cpRe = new Float64Array(N), cpIm = new Float64Array(N), mRe = new Float64Array(N), mIm = new Float64Array(N);
    let prev = [0, 0];
    for (let i = 0; i < N; i++) {
      const di = [dRe[i], dIm[i]], den = i ? sub(di, mul(off, prev)) : di;
      mRe[i] = den[0]; mIm[i] = den[1];
      const cp = div(off, den); cpRe[i] = cp[0]; cpIm[i] = cp[1]; prev = cp;
    }
    const re = new Float64Array(N), im = new Float64Array(N), yRe = new Float64Array(N), yIm = new Float64Array(N);
    return function step(pr, pi) {
      // right side: (1 - i dt H / 2 hbar) psi
      for (let i = 0; i < N; i++) {
        const lr = i ? pr[i - 1] : 0, li = i ? pi[i - 1] : 0, rr = i < N - 1 ? pr[i + 1] : 0, ri = i < N - 1 ? pi[i + 1] : 0;
        const dI = -(2 * a + dt * g.Vs[i] / (2 * HBAR));            // diagonal: 1 + i dI
        // (1 + i dI) psi_i + i a (psi_{i-1} + psi_{i+1})
        re[i] = pr[i] - dI * pi[i] - a * (li + ri);
        im[i] = pi[i] + dI * pr[i] + a * (lr + rr);
      }
      // forward sweep
      for (let i = 0; i < N; i++) {
        let br = re[i], bi = im[i];
        if (i) { const t = mul(off, [yRe[i - 1], yIm[i - 1]]); br -= t[0]; bi -= t[1]; }
        const y = div([br, bi], [mRe[i], mIm[i]]); yRe[i] = y[0]; yIm[i] = y[1];
      }
      // back substitution
      pr[N - 1] = yRe[N - 1]; pi[N - 1] = yIm[N - 1];
      for (let i = N - 2; i >= 0; i--) { const t = mul([cpRe[i], cpIm[i]], [pr[i + 1], pi[i + 1]]); pr[i] = yRe[i] - t[0]; pi[i] = yIm[i] - t[1]; }
    };
  }
  // a Gaussian packet centered at xc, width sigma (in |psi|^2 the standard deviation is sigma), mean wavenumber k0
  function packet(g, xc, sigma, k0) {
    const pr = new Float64Array(g.N), pi = new Float64Array(g.N); let n = 0;
    for (let i = 0; i < g.N; i++) { const x = g.xs[i], env = Math.exp(-((x - xc) ** 2) / (4 * sigma * sigma)); pr[i] = env * Math.cos(k0 * x); pi[i] = env * Math.sin(k0 * x); n += env * env; }
    const s = 1 / Math.sqrt(n * g.dx); for (let i = 0; i < g.N; i++) { pr[i] *= s; pi[i] *= s; }
    return { pr, pi };
  }
  function probIn(g, P, xa, xb) { let s = 0; for (let i = 0; i < g.N; i++) if (g.xs[i] >= xa && g.xs[i] < xb) s += P.pr[i] ** 2 + P.pi[i] ** 2; return s * g.dx; }
  // the transmission a packet should show: the plane-wave T averaged over the packet's spread of wavenumbers
  function packetT(k0, sigma, V0, a) {
    const sk = 1 / (2 * sigma); let s = 0, w = 0;
    for (let j = -400; j <= 400; j++) { const k = k0 + 6 * sk * j / 400; if (k <= 0) continue; const p = Math.exp(-((k - k0) ** 2) / (2 * sk * sk)); s += p * transmission(H2M * k * k, V0, a); w += p; }
    return s / w;
  }

  // ---- 3. where it matters ----
  // The scanning tunneling microscope: electrons tunnel across the gap d between tip and surface through a barrier
  // about the height of the work function W, so the current falls as e^{-2 kappa d}, kappa = sqrt(W / H2M).
  const STM = { W: 4.5 };
  const stmKappa = () => Math.sqrt(STM.W / H2M);
  const stmCurrent = (d, I0, d0) => I0 * Math.exp(-2 * stmKappa() * (d - d0));
  // Alpha decay (Gamow): an alpha particle of energy Q inside a nucleus of radius R meets the Coulomb barrier
  // V = 2 Zd e^2 / (4 pi eps0 r) of the daughter nucleus (charge Zd). Tunneling probability per hit e^{-2G},
  // G = integral from R to b of sqrt(2 mu (V - Q)) / hbar dr, b = 2 Zd e^2 / Q; hits per second v / 2R.
  // Nuclear units: MeV, fm. e^2 / 4 pi eps0 = 1.44 MeV fm, hbar c = 197.327 MeV fm, alpha mass 3727.379 MeV.

      ctx.strokeStyle = C('--rule'); ctx.strokeRect(b.x, b.y, b.w, b.h);
      font(ctx, 10); ctx.fillStyle = C('--muted'); ctx.textAlign = 'right';
      (cc ? [0.4, 0.5, 0.6, 0.7, 0.8] : [-3, -2, -1, 0, 1, 2, 3]).forEach(v => { ctx.fillText(cc ? v.toFixed(1) : (Math.pow(10, v) >= 1 ? Math.pow(10, v).toFixed(0) : Math.pow(10, v).toFixed(3 + Math.max(0, -v - 1))).replace(/0+$/, '').replace(/\.$/, ''), b.x - 4, Y(v) + 3); });
      font(ctx, 11); ctx.fillStyle = C('--ink'); ctx.textAlign = 'left'; ctx.fillText(cc ? 'what it records: the tip\'s height (nm), adjusted to keep 1 nA flowing' : 'what it records: the current (nA, log scale) at a fixed tip height', b.x, b.y - 8);
      xAxis(ctx, b, xr, 0.5, 'position along the surface (nm)');
      ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip(); ctx.strokeStyle = C('--energy'); ctx.lineWidth = 2; ctx.beginPath();
      SCAN.trace.forEach((p, i) => { const y = Y(cc ? p[1] : Math.log10(Math.max(1e-6, p[2]))); i && Math.abs(p[0] - SCAN.trace[i - 1][0]) < 0.1 ? ctx.lineTo(X(p[0]), y) : ctx.moveTo(X(p[0]), y); });
      ctx.stroke(); ctx.restore();
      if (!SCAN.trace.length) { font(ctx, 12); ctx.fillStyle = C('--muted'); ctx.textAlign = 'center'; ctx.fillText('press Scan', b.x + b.w / 2, b.y + b.h / 2); }
      return;
    }
    // Geiger-Nuttall: half-life against energy, model curves for polonium and uranium, measured points
    const qr = [3.8, 9.2], X = q => b.x + (q - qr[0]) / (qr[1] - qr[0]) * b.w, lr = [-8, 19], Y = l => b.y + b.h - (l - lr[0]) / (lr[1] - lr[0]) * b.h;
    font(ctx, 10); ctx.fillStyle = C('--muted'); ctx.strokeStyle = C('--soft');
    [[-6, '1 µs'], [0, '1 s'], [Math.log10(86400), '1 day'], [Math.log10(YEAR), '1 yr'], [Math.log10(YEAR * 1e6), compact ? '10⁶ yr' : '1 million yr'], [Math.log10(YEAR * 1e9), compact ? '10⁹ yr' : '1 billion yr']].forEach(([l, t]) => { ctx.beginPath(); ctx.moveTo(b.x, Y(l) + 0.5); ctx.lineTo(b.x + b.w, Y(l) + 0.5); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(t, b.x - 4, Y(l) + 3); });
    for (let q = 4; q <= 9; q++) { ctx.textAlign = 'center'; ctx.fillText(q + '', X(q), b.y + b.h + 13); }
    ctx.strokeStyle = C('--rule'); ctx.strokeRect(b.x, b.y, b.w, b.h);
    font(ctx, 11); ctx.fillStyle = C('--ink'); ctx.textAlign = 'center'; ctx.fillText('alpha particle\'s energy (MeV)', b.x + b.w / 2, b.y + b.h + 28);
    ctx.textAlign = 'left'; ctx.fillText('half-life (log scale): tunneling model (lines) and measured (dots)', b.x, b.y - 8);
    ctx.save(); ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
    [[84, 210, 'polonium'], [92, 236, 'uranium']].forEach(([Z, A, nm], k) => { ctx.strokeStyle = C('--model'); ctx.globalAlpha = k ? 0.5 : 1; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let q = qr[0]; q <= qr[1]; q += 0.02) { const l = Math.log10(gamow(Z, A, q).halfLife); q === qr[0] ? ctx.moveTo(X(q), Y(l)) : ctx.lineTo(X(q), Y(l)); } ctx.stroke(); ctx.globalAlpha = 1; });
    ALPHA.forEach((n, i) => { ctx.fillStyle = C('--meas'); ctx.beginPath(); ctx.arc(X(n.Q), Y(Math.log10(n.t)), i === S.nuc ? 6 : 4, 0, TAU); ctx.fill(); if (i === S.nuc) { ctx.strokeStyle = C('--ink'); ctx.lineWidth = 2; ctx.stroke(); } });
    ctx.restore();
    font(ctx, 10); ctx.fillStyle = C('--model'); ctx.textAlign = 'left'; ctx.fillText('model: polonium (Z = 84), and paler, uranium (Z = 92)', b.x + 6, b.y + b.h - 8);
  }
  function draw() { drawScene(); drawGraph(); }

  // ================================================================
  // 3. READOUTS AND CONTROLS
  // ================================================================
  const card = (k, v, f) => '<div><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="f">' + f + '</div></div>';
  let lastHTML = '';
  const pct = T => T < 1e-12 ? 'none' : (100 * T < 0.001 ? sci(100 * T) : 100 * T < 1 ? (100 * T).toFixed(3) : (100 * T).toFixed(1)) + '%';
  function readout() {
    let html = '';
    if (tab === 1) {
      const w = waveOn(S.E, S.V, S.a), lam = TAU / w.k;
      html = card('Gets through', pct(w.T), 'reflected: ' + pct(w.R) + '. Together, always 100%');
      html += card('Wavelength outside', lam.toFixed(3) + ' nm', 'λ = h / p, with p = √(2mE)');
      html += card('Inside the barrier', S.E < S.V ? 'decays in ' + (1 / w.kappa).toFixed(3) + ' nm' : 'oscillates', S.E < S.V ? 'κ = √(2m(V₀ − E))/ħ = ' + w.kappa.toFixed(1) + ' nm⁻¹; the wave falls by e for each 1/κ of width' : 'above the barrier top it is still a wave, with a longer wavelength, and can still reflect');
    } else if (tab === 2) {
      const g = PK.g, left = probIn(g, PK.psi, -30, 0), right = probIn(g, PK.psi, S.a, 30);
      html = card('Probability past the barrier', pct(right), 'to the left: ' + pct(left) + '; inside the barrier: ' + pct(Math.max(0, 1 - left - right)));
      html += card('For a single energy', pct(transmission(S.E, S.V, S.a)), 'what a steady wave at the packet\'s average energy would give');
      html += card('Averaged over the packet', pct(packetT(Math.sqrt(S.E / H2M), S.sig, S.V, S.a)), 'the packet has a spread of energies; its faster parts get through more easily');
    } else if (S.where === 'stm') {
      const gap = SCAN.tipZ - SURF(SCAN.x), I = stmCurrent(gap, I0, D0);
      html = card('Current', (I >= 10 ? I.toFixed(0) : I >= 0.1 ? I.toFixed(2) : I.toPrecision(2)) + ' nA', 'across a gap of ' + gap.toFixed(2) + ' nm of empty space');
      html += card('Each 0.1 nm closer', '× ' + Math.exp(2 * stmKappa() * 0.1).toFixed(1), 'the current grows by this factor: e^(2κ × 0.1 nm), κ = ' + stmKappa().toFixed(1) + ' nm⁻¹ for a 4.5 eV work function');
      html += card('Mode', S.mode === 'current' ? 'steady current' : 'steady height', S.mode === 'current' ? 'a feedback loop raises and lowers the tip to keep 1 nA flowing; its height traces the surface' : 'the tip stays put and the current rises and falls with the surface');
    } else {
      const n = ALPHA[S.nuc], g = gamow(n.Z, n.A, n.Q);
      html = card('Chance per hit', '1 in ' + sci(1 / g.P).replace('1.0 × ', ''), 'the alpha particle hits the wall ' + sci(g.f) + ' times a second');
      html += card('Half-life, from the model', human(g.halfLife), 'ln 2 / (hits per second × chance per hit)');
      html += card('Half-life, measured', human(n.t), n.sym === 'Po-210' ? 'the model is off most here: polonium-210 has 126 neutrons, a closed nuclear shell this simple model ignores' : 'the simple model is within a factor of ' + Math.max(2, Math.round(Math.max(g.halfLife / n.t, n.t / g.halfLife))) + ', across a range of 24 powers of ten');
    }
    if (html !== lastHTML) { $('readout').innerHTML = html; lastHTML = html; }
  }

  const TEXT = {
    1: { lede: 'An electron with less energy than a barrier\'s height meets the barrier. Classically it must bounce back. Predict: does any of its wave get through, and what happens to that as the barrier gets wider or taller?',
         notes: '<p><b>What to try.</b> Start below the barrier top and widen the barrier: the part that gets through shrinks fast, by the same factor for each extra tenth of a nanometer. Raise the energy toward the top, then past it: above the top, some of the wave still reflects, and at certain energies none does (the dips toward 1 on the graph). Turn on the real and imaginary parts. On the left the incoming and reflected waves interfere, so the height ripples; on the right only one wave travels, so the height is flat.</p>' +
                '<p><b>Why.</b> The electron\'s wave function ψ obeys the Schrödinger equation. Where <i>E</i> &gt; <i>V</i> it oscillates with wavenumber <i>k</i> = √(2<i>m</i>(<i>E</i> − <i>V</i>))/ħ; inside a barrier taller than <i>E</i> it cannot oscillate, but it does not stop dead either: it decays as e<sup>−κ<i>x</i></sup>, κ = √(2<i>m</i>(<i>V</i><sub>0</sub> − <i>E</i>))/ħ. If the barrier is thin enough, some of it is left at the far side and continues as a smaller wave. The share that gets through is <i>T</i> = [1 + <i>V</i><sub>0</sub><sup>2</sup> sinh<sup>2</sup>(κ<i>a</i>)/(4<i>E</i>(<i>V</i><sub>0</sub> − <i>E</i>))]<sup>−1</sup>, close to 16(<i>E</i>/<i>V</i><sub>0</sub>)(1 − <i>E</i>/<i>V</i><sub>0</sub>) e<sup>−2κ<i>a</i></sup> for a thick barrier: exponential in the width. The height of the shaded band is |ψ|<sup>2</sup>, the probability density, with the incoming wave\'s amplitude set to 1. It does not change in time; ψ itself does, turning between its real and imaginary parts about 10<sup>15</sup> times a second (shown slowed when you turn them on).</p>' +
                '<p><b>The model.</b> An electron (ħ<sup>2</sup>/2<i>m</i> = 0.0381 eV nm<sup>2</sup>) and a rectangular barrier, solved exactly: a wave of one energy, steady in time, coming from the left.</p>' },
    2: { lede: 'A real electron is not an endless wave but a packet, here a few nanometers long. Predict: when the packet meets the barrier, does part of the electron go through and part bounce back?',
         notes: '<p><b>What to try.</b> Run the default packet and watch it split. Make the barrier wider, or lower the energy, and less gets through. Compare the share that ends up past the barrier with the single-energy value: they differ, because a short packet has a spread of energies (the shaded band on the graph), and its faster parts tunnel far more easily. Make the packet narrower and the spread widens. Watch the packet spread out as it travels, too.</p>' +
                '<p><b>Why.</b> The packet is a superposition of waves with a range of energies; each one is transmitted with its own <i>T</i>. After the collision the wave function has two pieces, one moving left and one moving right, and |ψ|<sup>2</sup> integrated over each gives the probability of finding the electron there. It is one electron: a detector finds it in one place or the other, never half in each, but repeated many times the fractions match these areas. The spreading is the uncertainty principle at work: a packet confined to a small region has a spread of momenta, so its parts move at different speeds.</p>' +
                '<p><b>The model.</b> The time-dependent Schrödinger equation solved step by step on a grid of 4161 points 0.0125 nm apart (the Crank–Nicolson method, which keeps the total probability exactly 1), in steps of 0.004 fs. The packet is a Gaussian 8 nm to the left of the barrier. Time runs about 10<sup>15</sup> times slower than in reality.</p>' },
    3: { lede: 'Tunneling is not a curiosity: microscopes that see single atoms, and the decay of uranium, depend on it. Predict: how much does the current change if the tip moves 0.1 nm, about half an atom\'s width?',
         notes: '<p><b>What to try.</b> Scanning tunneling microscope: scan with the current held steady and the tip\'s height traces the atoms and the step; switch to a steady height and watch the current jump by tens of times at the step. Move the tip up and down. Alpha decay: step through the nuclei, from polonium-212 (less than a microsecond) to thorium-232 (longer than the age of the universe), and watch how little the energy changes compared with the half-life.</p>' +
                '<p><b>Why.</b> In a scanning tunneling microscope, electrons tunnel across the vacuum gap between a sharp tip and the surface, through a barrier about as high as the metal\'s work function (about 4.5 eV), so the current falls as e<sup>−2κ<i>d</i></sup>: roughly nine times for each 0.1 nm. That is why a microscope with an ordinary tip can resolve single atoms (Binnig and Rohrer, Nobel Prize 1986). In alpha decay (Gamow, 1928), an alpha particle rattles about inside the nucleus, hitting the Coulomb barrier around 10<sup>21</sup> times a second; each hit it gets through with a chance e<sup>−2<i>G</i></sup>, where <i>G</i> = ∫√(2μ(<i>V</i> − <i>E</i>))/ħ d<i>r</i> across the barrier. A small change in energy changes the barrier\'s thickness, and the exponential turns that into a change of half-life by many powers of ten: the Geiger–Nuttall law.</p>' +
                '<p><b>The model.</b> STM: current ∝ e<sup>−2κ<i>d</i></sup>, set to 1 nA at a 0.5 nm gap, over a surface of atoms 0.25 nm apart with 0.02 nm bumps and a step one atom high. Alpha decay: a nucleus of radius 1.2 fm × (<i>A</i><sub>daughter</sub><sup>1/3</sup> + 4<sup>1/3</sup>), the alpha particle\'s energy the measured <i>Q</i> value, and hits per second <i>v</i>/2<i>R</i>. Measured half-lives from nuclear data tables.</p>' }
  };

  function visibility() {
    const show = (id, on) => { $(id).hidden = !on; };
    show('lab_E', tab !== 3); show('lab_V', tab !== 3); show('lab_a', tab !== 3); show('lab_sig', tab === 2);
    show('lab_where', tab === 3); show('lab_mode', tab === 3 && S.where === 'stm'); show('lab_gap', tab === 3 && S.where === 'stm' && S.mode === 'height'); show('lab_nuc', tab === 3 && S.where === 'alpha');
    show('lab_reim', tab !== 3); show('go', tab === 2 || (tab === 3 && S.where === 'stm')); show('reset', tab === 2 || (tab === 3 && S.where === 'stm'));
    $('E_t').textContent = tab === 2 ? 'Packet\'s average energy' : 'Electron\'s energy';
    if (tab === 2) $('go').textContent = PK.done ? 'Run again' : playing ? 'Pause' : PK.t > 0 ? 'Resume' : 'Go';
    if (tab === 3) $('go').textContent = SCAN.on ? 'Stop' : 'Scan';
    document.querySelectorAll('#where button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.where)));
    document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.mode)));
    document.querySelectorAll('#nuc button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === S.nuc)));
    $('hint').textContent = tab === 2 ? 'time slowed about 10¹⁵ times' : '';
  }
  function vals() {
    $('E_v').textContent = S.E.toFixed(2) + ' eV'; $('V_v').textContent = S.V.toFixed(1) + ' eV'; $('a_v').textContent = S.a.toFixed(2) + ' nm';
    $('sig_v').textContent = S.sig.toFixed(1) + ' nm'; $('gap_v').textContent = S.gap.toFixed(2) + ' nm';
  }
  function sync() { ['E', 'V', 'a', 'sig', 'gap'].forEach(id => { $(id).value = String(S[id]); }); vals(); }
  function upd() { visibility(); vals(); readout(); draw(); }
  function setTab(k) {
    tab = k; playing = false; SCAN.on = false;
    [1, 2, 3].forEach(j => $('tab' + j).setAttribute('aria-selected', String(j === k)));
    $('lede').innerHTML = TEXT[k].lede; $('notes').innerHTML = TEXT[k].notes;
    if (k === 2) setupPacket();
    sync(); upd();
  }
  [1, 2, 3].forEach(k => $('tab' + k).addEventListener('click', () => setTab(k)));
  ['E', 'V', 'a', 'sig'].forEach(id => $(id).addEventListener('input', () => { S[id] = +$(id).value; if (tab === 2) { playing = false; setupPacket(); } upd(); }));
  $('gap').addEventListener('input', () => { S.gap = +$('gap').value; SCAN.tipZ = S.gap; upd(); });
  $('reim').addEventListener('change', draw);
  ALPHA.forEach((n, i) => { const b = document.createElement('button'); b.dataset.v = String(i); b.textContent = n.sym; $('nuc').appendChild(b); b.addEventListener('click', () => { S.nuc = i; upd(); }); });
  document.querySelectorAll('#where button').forEach(b => b.addEventListener('click', () => { S.where = b.dataset.v; SCAN.on = false; upd(); }));
  document.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.v; SCAN.trace = []; if (S.mode === 'height') SCAN.tipZ = S.gap; upd(); }));
  $('go').addEventListener('click', () => {
    if (tab === 2) { if (PK.done) { setupPacket(); playing = true; } else playing = !playing; }
    else { SCAN.on = !SCAN.on; if (SCAN.on && SCAN.x >= 1.75) { SCAN.x = -1.75; SCAN.trace = []; } }
    upd();
  });
  $('reset').addEventListener('click', () => { if (tab === 2) { playing = false; setupPacket(); } else { SCAN.on = false; SCAN.x = -1.6; SCAN.trace = []; SCAN.tipZ = S.mode === 'height' ? S.gap : SURF(SCAN.x) + D0; } upd(); });
  window.addEventListener('resize', draw);

  // ================================================================
  // 4. LOOP
  // ================================================================
  let last = null;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(ts) {
    const dt = last === null ? 0 : Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (dt > 0 && !document.hidden) {
      let busy = false;
      if (!reduced) { phase = (phase + dt * TAU / 1.6) % (TAU * 1000); busy = tab === 1 || (tab === 3 && S.where === 'alpha'); }
      if (tab === 2 && playing) {
        // about 2.5 fs of electron time per second on screen
        const n = Math.max(1, Math.round(2.5 * dt / DT));
        for (let i = 0; i < n; i++) PK.step(PK.psi.pr, PK.psi.pi);
        PK.t += n * DT;
        // stop before anything reaches the edge of the grid
        const edge = probIn(PK.g, PK.psi, -26, -20) + probIn(PK.g, PK.psi, 20, 26);
        if (edge > 1e-3 || PK.t > 60) { playing = false; PK.done = true; visibility(); }
        busy = true; readout();
      }
      if (tab === 3 && S.where === 'stm' && SCAN.on) {
        SCAN.x += 0.35 * dt;
        if (S.mode === 'current') SCAN.tipZ = SURF(SCAN.x) + D0; else SCAN.tipZ = S.gap;   // feedback: hold the gap that gives 1 nA
        SCAN.trace.push([SCAN.x, SCAN.tipZ, stmCurrent(SCAN.tipZ - SURF(SCAN.x), I0, D0)]);
        if (SCAN.x >= 1.75) { SCAN.on = false; visibility(); }
        busy = true; readout();
      }
      if (busy) draw();
    }
    requestAnimationFrame(frame);
  }
  SCAN.tipZ = SURF(SCAN.x) + D0;
  setTab(1);
  requestAnimationFrame(frame);
})();
</script>
<script>
// Wide screens only: canvases keep their natural shape, but if that would push the workspace (and the
// buttons under the canvases) past the bottom of the window, shrink the canvases together, keeping
// their shape, until it fits. Phones and narrow windows are left alone.
(function () {
  const wide = window.matchMedia('(min-width: 1200px) and (min-height: 620px)');
  let busy = false;
  function fitStage() {
    if (busy) return; busy = true;
    let changed = false;
    document.querySelectorAll('.workspace').forEach(ws => {
      const kids = [...ws.children].filter(k => k.matches('canvas') || k.querySelector('canvas'));
      const before = kids.map(k => k.style.width);
      const set = f => kids.forEach(k => { const w = f < 0.999 ? (100 * f).toFixed(1) + '%' : ''; k.style.width = w; k.style.alignSelf = w ? 'center' : ''; });
      const done = () => { if (kids.some((k, i) => k.style.width !== before[i])) changed = true; };
      set(1);
      if (!wide.matches || !ws.offsetParent) { done(); return; }
      const top = ws.getBoundingClientRect().top + window.scrollY;
      const avail = window.innerHeight - top;
      // a sim can set --min-fit on its workspace when its drawing gets unreadable below some size
      const minFit = parseFloat(getComputedStyle(ws).getPropertyValue('--min-fit')) || 0.5;
      let f = 1;
      for (let i = 0; i < 4; i++) {
        const total = ws.getBoundingClientRect().height;
        if (total <= avail + 1) break;
        const C = kids.reduce((s, k) => s + k.getBoundingClientRect().height, 0);
        if (C <= 0) break;
        f = Math.max(minFit, f * (avail - (total - C)) / C);
        set(f);
      }
      done();
    });
    busy = false;
    if (changed) window.dispatchEvent(new Event('resize'));   // let the sim redraw at the new size
  }
  window.addEventListener('resize', fitStage);
  document.addEventListener('click', () => requestAnimationFrame(fitStage));
  if (wide.addEventListener) wide.addEventListener('change', fitStage);
  fitStage();
})();
</script>
</body>
</html>
